{id:242,name:"桑多涅",source:"原神",type:"机械少女",cv:"洪海天（中）/本多真梨子（日）",race:"机娘",desc:"愚人众执行官第七席「木偶」，本名小玛丽安·吉约丹，500年前枫丹工匠阿兰·吉约丹仿照亡妹打造的机关人偶。背后有发条钥匙，瞳孔如齿轮，埋首机械研究的毒舌淑女，冒险家协会的凯瑟琳人偶即出自其手。",story:"《冬夜愚戏》中骑乘改装遗迹机关首次露面；执掌挪德卡莱库瓦希实验设计局，在坠落的古月遗骸上建起巨大要塞。6.3主线末为阻止「博士」多托雷阻碍哥伦比娅复活而与之交战，替旅行者挡下致命一击后故障，遗言「下地狱吧，多托雷」；核心被「仆人」阿蕾奇诺送回枫丹，靠阿兰留下的「最后的遗产」修复。2026年7月起实装为五星冰系大剑角色。",images:["机娘/桑多涅_2.jpg","机娘/桑多涅_1.jpg"],tags:["原神","愚人众","执行官","人偶"]},
{id:243,name:"涂山红红",source:"狐妖小红娘",type:"狐娘",cv:"阿澄佳奈（日）/刘校妤（中）",race:"兽耳娘",desc:"涂山狐妖之王、前任妖盟盟主，涂山有史以来最强；拥有万技克星「绝缘之爪」，因转世续缘失去妖力化为涂山苏苏。",story:"《狐妖小红娘》中涂山狐妖之王兼妖盟盟主，雅雅与容容的姐姐。幼年误杀救了自己的小道士，因情劫觉醒绝缘之爪，立志实现人妖和平。她救下东方月初并与之相恋；五十年后二人为引出幕后黑狐在苦情树下决战，互表心意后以全部妖力与记忆为代价立下转世续缘。红红因此失去妖力与记忆，退化为萝莉形态，被雅雅取名为「涂山苏苏」，在现世以红线仙身份活动，妖力与记忆逐步恢复。",images:["兽耳娘/bcac40ec836b40beb619656404d3669e.jpg","兽耳娘/1645599886520.jpg","兽耳娘/images.jpg"],tags:["绝缘之爪","前任妖盟盟主","转世续缘"]},
{id:244,name:"涂山雅雅",source:"狐妖小红娘",type:"狐娘",cv:"米泽圆（日）/张凯（中）",race:"兽耳娘",desc:"涂山现任族长兼妖盟盟主，已修成九尾天狐，以无尽酒壶与「绝对零域」为标志，是极度的姐控。",story:"《狐妖小红娘》中涂山现任族长兼妖盟盟主，红红之妹、容容与苏苏的姐姐，已修成九尾天狐。幼时模仿红红的力量型招式，经姐姐指点后五百年专修寒气，并以千里传声术模仿姐姐、长年穿红袍寄托思念。因怀疑苏苏并非红红而对她冷言冷语，实则处处维护；直到亲眼见到苏苏体内的红红觉醒，又听红红说「红色不适合你」，才换下红袍改穿蓝袍、解开心结，继续以涂山最强战力守护涂山。",images:["兽耳娘/images_1.jpg"],tags:["九尾天狐","现任妖盟盟主","冰系最强"]},
{id:245,name:"涂山容容",source:"狐妖小红娘",type:"狐娘",cv:"金元寿子（日）/乔诗语（中）",race:"兽耳娘",desc:"人称「千面妖容」的涂山二当家兼管账，算无遗策的最强智囊，精通易容术与幻梦法术，随身算盘。",story:"《狐妖小红娘》中涂山二当家兼管账，红红与雅雅的妹妹、苏苏名义上的姐姐，号「千面妖容」，为涂山最强智囊。主修狐妖易容术与幻梦法术，绝技望月掌，手持算盘、算无遗策。曾收留牛鬼颜如玉并授艺，助其改过自新。她相信苏苏即红红，暗中赠予《纯爱天篇》助其成长，不惜与雅雅对立，并诱导苏苏与白月初的感情自然发展。本体寄托于苦情树的千丝网，平日现身者皆为分身。",images:["兽耳娘/images_2.jpg"],tags:["千面妖容","涂山二当家","最强智囊"]},
{id:246,name:"八云蓝",source:"东方Project",type:"狐娘",cv:"",race:"兽耳娘",desc:"八云紫的式神，本体为九尾狐的妖兽，代主人打理境界与幻想乡事务，自身亦统御式神橙，号称最强妖兽。",story:"初登场于《东方妖妖梦》，任EX面BOSS与PH面道中BOSS。种族为妖兽九尾狐，是隙间妖怪八云紫的式神；紫每日长睡、冬季冬眠，幻想乡结界与境界的维护及各类杂务多由她代行。她本身亦能驱使式神，拥有自己的式神橙；因久为式神而实力远超寻常妖怪，被称为「最强妖兽」。性情温和忠诚，擅长数学计算，曾算出三途河的宽度，嗜食油炸豆腐。《妖妖梦》中为替橙出头与灵梦等人交战。东方Project官方游戏与出版物均无角色配音，故CV留空。",images:["兽耳娘/images_4.jpg","兽耳娘/images_3.jpg"],tags:["九尾狐","八云紫的式神","最强妖兽"]},
{id:247,name:"源千鹤",source:"我的狐仙女友",type:"狐娘",cv:"川澄绫子",race:"兽耳娘",desc:"薰风高校二年级美少女学姐，真身是活了四百多年的妖狐，拥有多条可独立思考的尾巴，对耕太一见钟情。",story:"西野胜海轻小说《我的狐仙女友》（かのこん）及2008年同名电视动画的第一女主角。薰风高校二年级学生，外表是美少女，实为四百岁以上的妖狐，拥有多条被称为「龙」、能独立思考的强大尾巴，第九尾苏醒便会失去记忆。转学第一天她向小山田耕太告白并坦白妖怪身份，此后不分场合热烈追求，把耕太卷入人与妖怪共存的世界。她任性而占有欲强，却也为耕太戒酒学厨、真心专一。原作后段她为耕太生下一名狐妖女孩，并因错过毕业典礼留级。",images:[""],tags:["四百岁妖狐","多尾","学姐女友"]},
{id:248,name:"酒狐",source:"Minecraft 二次创作（车万女仆 / YSM 模组）",type:"狐娘",cv:"",race:"兽耳娘",desc:"《车万女仆》与YSM模组的吉祥物、小女仆默认皮肤，金发大正女仆打扮的狐娘，蓬松大尾巴，爱葡萄酒与番茄布丁。",story:"Minecraft模组圈流传的二次创作角色，为模组「车万女仆（Touhou Little Maid）」与「是，史蒂夫模型（YSM）」的吉祥物，即小女仆默认皮肤「大正女仆酒狐」及其变体的通称。最初由狐娘、大正女仆等关键词生成设定图而来，原初模型作者为完美冻结，因模组作者酒石酸菌常在更新前瞻中使用而广为人知；「店员酒狐」版本的贴图与服装由圣起司修改。设定为金发长尾狐娘，善良可爱、对主人关怀备至，遇事有些傻气，名字源自她爱喝的葡萄酒。模型以CC BY-NC-SA 4.0授权，无官方配音。",images:[""],tags:["模组吉祥物","大正女仆","默认皮肤"]},
{id:249,name:"绯鞠",source:"守护猫娘绯鞠",type:"猫娘",cv:"小清水亚美",race:"兽耳娘",desc:"天河家世代追随的猫妖后裔，以名刀童子切安纲守护少主优人，妖化时显出猫耳猫尾。",story:"的良米兰漫画《守护猫娘绯鞠》及其改编动画的女主角。绯鞠本是被天河家先祖收伏的猫妖一族后裔，世代效忠天河家，由优人的祖父母抚养长大。优人十六岁生日当天，她依约现身，以「少主殿下」相称贴身守护，并试图用肌肤之亲唤回他被护身符抹去的童年记忆。她平时开朗温柔，战斗时妖化显出猫耳猫尾，挥动童子切安纲斩妖除魔。漫画中她击败玉藻前后一度狂化消失，最终凭一丝理智克制未伤及他人，结局恢复正常，回到优人身边。本名无姓，「野井原」取自优人老家地名、入学后自报。",images:[""],tags:["猫妖","守护者","武士娘"]},
{id:250,name:"巧克力",source:"猫娘乐园（Nekopara）",type:"猫娘",cv:"八木侑纪",race:"兽耳娘",desc:"水无月家排行第五的黑发混种猫娘，香草的双胞胎姐姐，开朗直率、行动力过剩的犬系元气猫。",story:"NEKO WORKs 美少女游戏《猫娘乐园》及其2020年TV动画的看板角色。巧克力与双胞胎妹妹香草同为雨天被捡回的弃猫，在水无月家排行第五。主人嘉祥开设蛋糕店「La Soleil」时，她藏进老家寄来的行李中追随而来，从此与嘉祥、时雨及红豆、枫、桂、椰子共同打理店铺。她不擅长思考复杂的事却行动力旺盛，常因莽撞闯祸，但凭对主人的一腔赤诚与努力赢得众人喜爱。CV为动画版阵容，游戏版为阳茉莉、OVA版为朋永真季。",images:[""],tags:["双胞胎","元气","犬系猫娘"]},
{id:251,name:"香草",source:"猫娘乐园（Nekopara）",type:"猫娘",cv:"佐伯伊织",race:"兽耳娘",desc:"水无月家排行第六的么女，白发混种猫娘，巧克力的双胞胎妹妹，沉默寡言却洞察力过人的姐控。",story:"NEKO WORKs 美少女游戏《猫娘乐园》及其TV动画角色。香草与双胞胎姐姐巧克力同为雨天被捡回的弃猫，在水无月家排行第六，是最小的么女。她平时话少冷淡，常被误认为无口，实则极富洞察力、头脑聪明，行事自有步调，与姐姐性格完全相反。她深爱巧克力，是彻底的姐控，最爱看动物DVD。随姐姐住进「La Soleil」后，她在众人陪伴下渐渐敞开心扉，是外表冷淡、内心重感情的「像猫的猫娘」。CV为动画版阵容，游戏版为中村あむ、OVA版为猪口有佳。",images:[""],tags:["双胞胎","无口","姐控"]},
{id:252,name:"枫",source:"猫娘乐园（Nekopara）",type:"猫娘",cv:"伊藤美来",race:"兽耳娘",desc:"水无月家次女，美国卷耳猫品种猫娘，自尊心强、追赶潮流的傲娇时髦猫，怕黑又极度怕烫。",story:"《猫娘乐园》Vol.3 起的主线角色之一，水无月家六只猫娘中的次女，品种美国卷耳猫，饲主为时雨。她自尊心强、头脑灵活，喜欢新鲜事物与名牌，说话直接却也会顾及旁人，只对时雨撒娇时才喵喵叫。她极度怕黑，起夜要把房间和走廊的灯全打开，也是全家最怕烫的「猫舌」。在挚友桂的默默推动下，她走出对歌唱梦想的心理阴影，重新站上舞台放声歌唱。CV为动画版阵容，游戏版与OVA版同为小仓结衣。",images:[""],tags:["傲娇","美国卷耳猫","歌姬"]},
{id:253,name:"桂",source:"猫娘乐园（Nekopara）",type:"猫娘",cv:"野口百合",race:"兽耳娘",desc:"水无月家三女，苏格兰折耳猫品种猫娘，总是笑眯眯的妄想系治愈系猫娘，如母亲般照料众姐妹。",story:"《猫娘乐园》Vol.3 起的主线角色之一，水无月家六只猫娘中的三女，品种苏格兰折耳猫，名与品种皆取自画师 Sayori 的宠物猫。她总是笑眯眯的，是家里的治愈系，实则聪明贤惠，如同猫娘们母亲一般的存在。她对色色的事异常敏感，动辄陷入妄想而喘息不止。她与次女枫情同挚友，在第三作中于背后默默推动，鼓励枫走出心理阴影、大胆歌唱。CV为动画版阵容，游戏版为有坂羽由、OVA版为冈岛妙。",images:[""],tags:["治愈系","苏格兰折耳猫","妄想系"]},
{id:254,name:"椰子",source:"猫娘乐园（Nekopara）",type:"猫娘",cv:"水谷麻铃",race:"兽耳娘",desc:"水无月家四女，缅因猫品种猫娘，异色瞳的高挑肉感御姐，忠诚心胜过犬类却笨手笨脚。",story:"《猫娘乐园》Vol.2 起的主线角色，水无月家六只猫娘中的四女，品种为体型最大的家猫品种缅因猫，拥有一蓝一金的异色瞳。她身材高挑、外形成熟，却是家中除巧克力和香草外年纪最小的猫娘，身体能力极高，对时雨的忠诚心更在犬类之上。她热心助人却十分笨拙，结果往往以悲剧收场，也常与长女红豆斗嘴。两人原是感情最好的姐妹，因误会生出嫌隙，最终在风波中重修旧好。CV为动画版阵容，游戏版为手冢凉子、OVA版为立石惠。",images:[""],tags:["缅因猫","异色瞳","笨拙"]},
{id:255,name:"蕾昂米修莉·加雷特·德·罗瓦",source:"DOG DAYS",type:"猫娘",cv:"小清水亚美",race:"兽耳娘",desc:"加雷特狮子团领国的公主兼领主，16岁，猫耳猫尾，持国宝魔战斧「古兰贝尔」，勇猛果敢的战场少女。",story:"都筑真纪原作动画《DOG DAYS》系列角色，加雷特狮子团领国的公主兼领主，当上领主后总要求人称自己「阁下」，爱称蕾欧。她银发披重甲、勇猛果敢，背负好战国民的期望，持加雷特国宝魔战斧「古兰贝尔」。她与邻国公主米希是自幼玩伴，却在星咏中预见米希与勇者倒在血泊的画面，为扭转未来不惜屡次发动战争、以国宝为赌注步步紧逼。最终与真红、米希并肩作战，改写了预言中的悲剧。加雷特国民有猫耳猫尾、战场上受重击会变成迷你小猫。",images:[""],tags:["公主","领主","勇猛"]},
{id:256,name:"米希奥蕾·F·比斯科迪",source:"DOG DAYS",type:"犬娘",cv:"堀江由衣",race:"兽耳娘",desc:"比斯科迪共和国14岁公主兼国家代表领主，犬娘种族，持国宝圣剑「艾克塞利德」，兼任走红世界的偶像歌手。",story:"出自都筑真纪原作动画《DOG DAYS》系列。她是比斯科迪共和国的公主，以领主身份担任国家代表，种族为犬娘，爱称米尔希。她外表软绵绵实则认真努力，深受国民与臣下爱戴，同时是活跃于世界各地的偶像歌手。她以能看见远方事物乃至未来的「星咏」技看到少年真红奋力拼搏的身姿而深受打动，将其作为比斯科迪的勇者召唤而来。随着练习逐渐熟练掌握圣剑艾克塞利德后，她从被保护的公主成长为主动参战的领主，并与真红结下超越召唤主与勇者的羁绊。",images:[""],tags:["公主","领主","偶像歌手"]},
{id:257,name:"利歌塔·埃玛",source:"DOG DAYS",type:"犬娘",cv:"水树奈奈",race:"兽耳娘",desc:"比斯科迪国立研究学院主席研究士，13岁犬娘天才发明家，战场上兼任炮术师提供远程火力支援。",story:"都筑真纪原作动画《DOG DAYS》系列角色。她是比斯科迪共和国国立研究学院的主席研究士，种族犬娘，年仅十三岁，五岁便能独立完成发明，人称发明大王。栗色长发、天真爱笑、待人亲近，称呼真红为「勇者大人」并仰慕他，与米希公主、亲卫队长艾克蕾尔、忍者雪风自幼要好，并有见到陌生机械就想拆开的癖好。她为替勇者真红解决无法回到原世界的问题而尽心尽力，同时在战场上担任炮术师，以远程炮火支援前线。",images:[""],tags:["天才发明家","主席研究士","炮术师"]},
{id:258,name:"阿罗娜",source:"蔚蓝档案",type:"AI",cv:"小原好美",race:"机娘",desc:"「什亭之匣」的主控OS「A.R.O.N.A」，138cm，右蓝左红的异色瞳，水手服配兔耳蝴蝶结的蓝发AI姬。",story:"《蔚蓝档案》中老师（Sensei）的秘书与看板娘，本体是联邦学生会长留下的平板电脑「什亭之匣」内置的系统管理者与主控AI，名字写作 A.R.O.N.A.。教程中老师在教室里唤醒睡着的她，以食指触碰验证指纹后正式结成搭档。此后她负责带老师熟悉基沃托斯、处理夏莱的委托与学生招募，并一度夺回圣所之塔的控制权、应老师要求转交联邦学生会。她天然呆又贪吃，没事就趴着说甜食梦话进入省电模式，因给老师抽卡出彩率低而被戏称蓝毛恶魔。",images:["机娘/images_74.jpg","机娘/images_62.jpg","机娘/images_2.jpg","机娘/images.jpg","机娘/images_75.jpg","机娘/images_76.jpg"],tags:["什亭之匣","异色瞳"]},
{id:259,name:"天童爱丽丝",source:"蔚蓝档案",type:"机娘",cv:"田中美海",race:"机娘",desc:"千年科学学园游戏开发部的安卓少女，代号AL-1S，蓝灰超长发，以「光之剑·超新星」电磁炮作战。",story:"《蔚蓝档案》千年科学学园游戏开发部成员，真实身份是才羽姐妹在废墟中发现、由「无名众神」制造的安卓机器人 AL-1S。高龄失忆的她靠复古游戏的台词学习语言，把日常当成任务，自认见习勇者。在另一个时间线中她曾被体内的第二AI人格柯伊夺舍，暴走为「无名众神的王女」，摧毁了千年科学学园；最终她在精神世界中击败柯伊，拒绝成为王女，选择了守护同伴的勇者之路。武器是从工程部取得的光之剑·超新星，台词里常冒游戏音效。",images:["机娘/images_65.jpg","机娘/images_64.jpg","机娘/BA_Pic_106984463_p0.webp","机娘/images_66.jpg","机娘/images_67.jpg","机娘/images_68.jpg","机娘/images_69.jpg","机娘/images_61.jpg"],tags:["安卓机器人","AL-1S","游戏开发部"]},
{id:260,name:"凯伊",source:"蔚蓝档案",type:"机娘",cv:"田中美海",race:"机娘",desc:"天童凯伊，寄生于爱丽丝体内的第二AI人格，支配身体时转紫红瞳，2026年五周年实装，现属超现象特务部。",story:"《蔚蓝档案》角色，日文名天童凯伊，旧名Key。她是寄生在天童爱丽丝体内的第二人格AI，由无名众神的祭司创造，职责是把 AL-1S 引导为「无名众神的王女」，为此不惜毁灭基沃托斯。她夺取爱丽丝身体攻击游戏开发部后被认定为威胁，主线最终章中主动承受爱丽丝操作「生命守护者」的巨大反噬而消失，人格数据被日鞠存入小机器人。后经爱丽丝请求，由莉音与日鞠协助获得人形义体，成为超现象特务部成员，实则多半泡在游戏开发部。声优与爱丽丝同为田中美海。",images:["机娘/images_70.jpg","机娘/images_63.jpg","机娘/images_71.jpg","机娘/images_72.jpg","机娘/images_73.jpg"],tags:["AI人格","义体","超现象特务部"]},
{id:261,name:"水银灯",source:"蔷薇少女",type:"机娘",cv:"田中理惠",race:"机娘",desc:"蔷薇少女第一人偶，深紫哥特萝莉装，背生可变形黑翼，以黑羽化剑攻击，人工精灵为冥冥。",story:"PEACH-PIT《蔷薇少女》中人偶师罗真所制的第一人偶，德文名 Mercury Lampe。因制作途中「父亲大人」离去，她的身体并未完成，腹部留有缺陷，对「废物」一词极为敏感，性格要强孤傲。人工精灵为冥冥，武器是背后两对可自由变化的黑翼，无需媒介也能战斗，后来与患有先天心脏病的少女柿崎惠订立契约。她与第五人偶真红因理念分歧水火不容，却始终执念于对方，最终为真红挡下蔷薇水晶的攻击。2004版与2013年《zurückspulen》版CV相同。",images:["机娘/images_77.jpg","机娘/images_78.jpg","机娘/images_79.jpg","机娘/images_80.jpg","机娘/images_81.jpg","机娘/images_82.jpg"],tags:["第一人偶","黑翼","柿崎惠"]},
{id:262,name:"金丝雀",source:"蔷薇少女",type:"机娘",cv:"志村由美",race:"机娘",desc:"蔷薇少女第二人偶，昵称小金，王子系洛丽塔打扮，以阳伞飞行、幻化的小提琴音波作战。",story:"《蔷薇少女》中人偶师罗真所制的第二人偶，德文名 Kanarienvogel。平时乘着阳伞飞行，战斗时把阳伞幻化为小提琴，以音波为攻击手段，也是七人偶中使用人工精灵次数最多的一位。她性格天然冒失、口癖为「……的吧？」，表面不太可靠，实际战力相当强。媒介是狂热的人偶爱好者草笛美子，两人感情极好。她与水银灯是青梅竹马，并保守着关于水银灯的某个秘密。日文官方汉字表记为「金糸雀」。",images:["机娘/images_83.jpg","机娘/images_84.jpg"],tags:["第二人偶","小提琴","草笛美子"]},
{id:263,name:"翠星石",source:"蔷薇少女",type:"机娘",cv:"桑谷夏子",race:"机娘",desc:"蔷薇少女第三人偶，绿衣长发的双子之姐，人称梦之园艺师，以浇水壶「如雨露」灌溉他人梦境。",story:"《蔷薇少女》中人偶师罗真所制的第三人偶，与第四人偶苍星石为双子，合称梦之园艺师，拥有开启他人梦境之门的能力，武器是浇水壶「如雨露」。她是第二个与樱田纯正式缔结契约的人偶，人工精灵为水之梦。性格小动物般怕生、口是心非，一表现出对纯的好感就立刻动手掩饰，实则极重情义，尤其疼爱妹妹苍星石。她是七人偶中最擅长家事的一位，亦被真红评为最具有人偶本质的人偶。",images:["机娘/images_85.jpg","机娘/images_86.jpg","机娘/images_87.jpg","机娘/images_88.jpg","机娘/images_89.jpg"],tags:["第三人偶","梦之园艺师","苍星石"]},
{id:264,name:"真红（蔷薇少女）",source:"蔷薇少女",type:"机娘",cv:"泽城美雪",race:"机娘",desc:"蔷薇少女第五人偶，金发蓝眼的古典洛丽塔少女，以追踪敌人的蔷薇花瓣「蔷薇之尾」作战。",story:"《蔷薇少女》中人偶师罗真所制的第五人偶，也是全作最先登场的人偶女主角，德文名 Reiner Rubin。她拥有女王般高贵的气质，爱好品红茶与读书散步，是剧中剧《名侦探库库》的忠实爱好者，家政能力却近乎为零。她的攻击手段是能追踪敌人的蔷薇花瓣「蔷薇之尾」，人工精灵为荷里耶，首任媒介为樱田纯。在感悟到纯反抗命运的精神后，她提出「爱丽丝游戏并非父亲的真实愿望」，决心以自身意志改变命运。2004版与2013版CV相同。",images:["机娘/images_93.jpg","机娘/images_90.jpg","机娘/images_91.jpg","机娘/images_92.jpg","机娘/images_94.jpg","机娘/images_95.jpg","机娘/images_96.jpg","机娘/images_97.jpg","机娘/images_98.jpg"],tags:["第五人偶","蔷薇之尾","樱田纯"]},
{id:265,name:"雏莓",source:"蔷薇少女",type:"机娘",cv:"野川樱",race:"机娘",desc:"蔷薇少女第六人偶，粉发幼女体型的甜美洛丽塔，能伸长草莓藤蔓作战，人工精灵为莓铃。",story:"《蔷薇少女》中人偶师罗真所制的第六人偶。她说话带着稚气，喜欢涂鸦、莓大福与花蛋汉堡扒，和真红同为《名侦探库库》的狂热粉丝。武器是可自由伸长的草莓藤蔓，人工精灵为莓铃，媒介历经柯芮妮、柏叶巴，最后是樱田纯。旧连载中她是爱丽丝游戏里第一个败给真红的人偶，此后放弃与巴的契约、同真红一同生活，后遭雪华绮晶吞噬，把蔷薇圣母交给了真红。日文官方汉字表记为「雛苺」。",images:["机娘/images_99.jpg"],tags:["第六人偶","草莓藤蔓","樱田纯"]},
{id:266,name:"雪华绮晶",source:"蔷薇少女",type:"机娘",cv:"千叶千惠巳",race:"机娘",desc:"蔷薇少女真正的第七人偶，右眼生白蔷薇，无实体的精神体，以白蔷薇蔓藤与水晶作战。",story:"《蔷薇少女》中人偶师罗真所制的第七人偶，读音 Kirakishou。罗真为追求完美舍弃了她的物质身体，使她没有实体与人工精灵，只能在N之领域中活动，右眼位置生出一朵白蔷薇。长期的孤独使她精神濒于疯狂，为参与爱丽丝游戏先后夺取雏莓、苍星石乃至真红的身体，还自行造出了又一个「父亲大人」。新连载中她占据苍星石的身体，却在纯承认苍星石为主人后被驱逐，最终只剩下一具失去意识的道具人偶。配音对应2013年《zurückspulen》，2004旧动画仅露脸无声优。",images:["机娘/images_101.jpg","机娘/images_100.jpg"],tags:["第七人偶","无实体","白蔷薇"]},
{id:267,name:"蔷薇水晶",source:"蔷薇少女",type:"机娘",cv:"后藤沙绪里",race:"机娘",desc:"动画二期原创的伪第七人偶，左眼覆紫蔷薇眼罩，银发琥珀瞳，以紫水晶与水晶剑作战。",story:"《蔷薇少女》动画二期《彷如梦境》登场的人偶，是人偶师槐为证明自己超越师父，仿照第七人偶雪华绮晶制造的存在，被塞进空缺的第七人偶席位，德文名 Rosen Kristall。她以紫水晶为主要武器，可将其变为剑、炸弹或封印用水晶球，战斗力极强，逐一击败了六位蔷薇少女。因身体无法承受六颗蔷薇圣母的巨大力量，她最终自我崩坏，槐随之与她一同消失在光芒中。角色原案由PEACH-PIT设计，故常被误认为真正的第七人偶。",images:["机娘/images_102.jpg","机娘/images_103.jpg"],tags:["伪第七人偶","紫水晶","槐之女"]},
{id:268,name:"夜刀神十香",source:"约会大作战",type:"精灵",cv:"井上麻里奈",race:"精灵",desc:"识别代号〈公主〉，天使〈鏖杀公〉、灵装〈神威灵装·十番〉；及膝黑长发与水晶色双瞳的原生精灵。",story:"随着空间震出现在士道面前的第一个精灵，没有姓名与一切记忆，因四月十日相遇而被士道命名为十香。初时畏惧并敌视人类，被士道以接吻封印灵力后，靠拉塔托斯克伪造户籍转入来禅高中2年4班，住进五河家旁的公寓。DEM一役中目睹士道被艾莲刺至濒死，灵结晶反转，显现魔王〈暴虐公〉，再度被士道救回。结局被澪夺走灵结晶而一度消散，后由澪以世界之力重组复活，两年后重返士道身边。与其他精灵不同，她并非由人类转化。",images:[""],tags:["原生精灵","鏖杀公","反转体"]},
{id:269,name:"鸢一折纸",source:"约会大作战",type:"精灵",cv:"富樫美铃",race:"精灵",desc:"AST上士兼士道的同班同学，精灵化代号〈天使〉、天使〈绝灭天使〉，白发无表情的双重身份少女。",story:"五年前双亲死于精灵袭击，因而极端憎恨精灵，加入AST持续征战。表面如永久冻土般毫无表情，对幼时安慰过自己的士道却病态执着。第十卷为获得击杀精灵的力量接受〈幻影〉的灵结晶而精灵化，并借狂三的〈十二之弹〉回到五年前，却发现误杀双亲的正是未来的自己，绝望反转显现魔王〈救世魔王〉。士道改写历史后，她在保留原世界记忆的第二人格状态下坦白「我对你只是依存」，随后由士道封印，剪回短发留在精灵阵营。",images:[""],tags:["AST","双重人格","反转体"]},
{id:270,name:"五河琴里",source:"约会大作战",type:"精灵",cv:"竹达彩奈",race:"精灵",desc:"士道的义妹兼拉塔托斯克司令官，代号〈炎魔〉、天使〈灼烂歼鬼〉，以黑白发带切换两种性格。",story:"既是士道名义上的义妹，也是主张以对话消弭空间震的组织拉塔托斯克司令官，靠黑白发带切换性格：白缎带是天真黏人的妹妹模式，黑缎带是抖S毒舌的司令官模式。五年前为成为坚强的妹妹接受〈幻影〉的灵结晶，暴走时误以为是她杀死了折纸双亲；为救重伤的士道而把力量交其封印，也把不死鸟般的再生能力给了他。后在游乐园约会时再度精灵化失控，被士道说服后二次封印。",images:[""],tags:["拉塔托斯克司令","义妹","炎之精灵"]},
{id:271,name:"四糸乃",source:"约会大作战",type:"精灵",cv:"野水伊织",race:"精灵",desc:"识别代号〈隐居者〉，天使〈冰结傀儡〉；蓝发娇小少女，左手兔偶四糸奈是她的另一人格。",story:"全名冰芽川四糸乃，第二个登场的精灵。她生性温驯胆小怕生，几乎不与人直接对话，对外皆由手偶「四糸奈」代为应答；一旦失去手偶支持便极度恐慌、反射性发动攻击。她能操控水与寒气，每次现界天宫市都阴雨绵绵，却因不愿伤人而一味逃避战斗。士道承诺成为保护她远离痛苦的英雄，在帮她寻回手偶后与之接吻，封印其灵力。此后她暂住佛拉克西纳斯学习人类社会，并开始练习自己主动开口说话。",images:[""],tags:["冰与水","兔偶","怕生"]},
{id:272,name:"八舞耶俱矢",source:"约会大作战",type:"精灵",cv:"内田真礼",race:"精灵",desc:"风之双子精灵之一，代号〈狂战士〉，天使〈飓风骑士〉之枪〈贯穿者〉；橙发盘起的中二少女。",story:"原是名为八舞的人类，濒死时被澪赋予灵结晶，因体内两个因子而分裂为耶俱矢与夕弦两个个体。两人为争夺谁是真正的八舞长期以各种项目对决，战绩99战25胜25败49平。最后一回改为比谁能先得到士道的心，士道拒绝二选一，提出封印灵力共同存活的第三条路，两人和解并同时献上初吻。封印后以孪生姐妹身份转入来禅高中2年3班，与夕弦共用〈狂战士〉代号与〈飓风骑士〉之名。",images:[""],tags:["双子精灵","风之天使","中二病"]},
{id:273,name:"八舞夕弦",source:"约会大作战",type:"精灵",cv:"布里德卡特·塞拉·惠美",race:"精灵",desc:"风之双子精灵之一，代号〈狂战士〉，天使〈飓风骑士〉之锁〈束缚者〉；三股辫，凡事慢条斯理。",story:"与耶俱矢由同一个精灵八舞分裂而来，性格恰与姐姐相反，凡事慢条斯理、常半眯着眼，以名字「夕弦」自称，并以「指摘」「赞同」等两字主旨起句。她的天使〈束缚者〉是前端带菱形刃的黑锁链灵摆，与耶俱矢的〈贯穿者〉合用才能发挥〈飓风骑士〉真正的弓箭形态。对决最终由士道提出共存方案而和解，从此称士道为两人的共有财产，并尊称传授诱惑技巧的折纸为「折纸大师」。灵装枷锁位置与耶俱矢相反。",images:[""],tags:["双子精灵","风之天使","慢条斯理"]},
{id:274,name:"诱宵美九",source:"约会大作战",type:"精灵",cv:"茅原实里",race:"精灵",desc:"识别代号〈歌姬〉，灵装〈神威灵装·九番〉，天使〈破军歌姬〉为带光之键盘的巨型管风琴，紫银长发。",story:"原为十五岁出道的歌手宵待月乃，拒绝电视台制作人的潜规则后遭恶意抹黑、歌迷倒戈，因而罹患心因性失声症失去声音，绝望自杀之际被〈幻影〉赋予精灵之力。自此极度厌恶男性、偏爱女性，以操控声音的能力玩弄他人。士道化身女装的五河士织接近她，身份败露后遭声波追捕。天央祭对决中，士道舍命护住力竭的她，她终于敞开心扉，主动亲吻士道被封印，并称他为达令。",images:[""],tags:["偶像","百合","音之天使"]},
{id:275,name:"七罪",source:"约会大作战",type:"精灵",cv:"真野步",race:"精灵",desc:"本名镜野七罪，识别代号〈女巫〉，天使〈赝造魔女〉为带镜扫帚；绿发翡翠瞳，本体却是自卑的小女孩。",story:"第七位出现的精灵。因初次现界时真面目未被任何人接纳，她用天使的变形能力把自己变成理想中的大人，并极度恐惧他人看见本体。一次意外解除伪装后，她误以为士道看见了自己的真容，先是变身为士道四处恶作剧毁其形象，又设计扭曲的捉迷藏陷害精灵。士道以女装士织的姿态为她化妆、肯定她原本的模样，她在DEM以人造卫星摧毁天宫市时现身相助，最终自愿封印灵力。",images:[""],tags:["变身","自卑","消极"]},
{id:276,name:"时崎狂三",source:"约会大作战",type:"精灵",cv:"真田麻美",race:"精灵",desc:"识别代号〈梦魇〉，灵装〈神威灵装·三番〉，天使〈刻刻帝〉为巨大时钟；黑发双马尾，左眼是随之转动的金色时钟。",story:"第三个出现的精灵，也是唯一能凭自身意志从邻界现界并主动杀人的特异存在。原本是富有正义感的少女，十几年前被澪诱导接受灵结晶，却发现包括挚友山打纱和在内、自己消灭的精灵都曾是人类，遂立誓回溯三十年前杀死始源精灵。为此不断吞噬他人的时间，被视为最恶的精灵。最终她接受士道的拯救诉求，借〈六之弹〉改写士道被DEM杀死的命运达204次。",images:[""],tags:["时间操控","分身","最恶的精灵"]},
{id:277,name:"本条二亚",source:"约会大作战",type:"精灵",cv:"生天目仁美",race:"精灵",desc:"识别代号〈修女〉，灵装〈神威灵装·二番〉，天使〈嗫告篇帙〉为全知之书；灰短发，约45岁却仍是18岁外貌。",story:"第十二卷登场、狂三长期追寻的「第二名精灵」，约二十七年前由普通人类转化。她是以笔名「本条苍二」闻名的御宅漫画家，五年前被DEM掳走充当反转实验体却始终未反转。士道暴走期间她被以「材料A」名义押运，运输机被击落后饿倒街头以接近士道，并以〈嗫告篇帙〉的全知能力说出始源精灵的真相。后被威斯考特逼使回想囚禁记忆而精神崩溃反转，反灵魂结晶遭夺，赖士道接吻封印保住一命。",images:[""],tags:["漫画家","全知","反转体"]},
{id:278,name:"星宫六喰",source:"约会大作战",type:"精灵",cv:"影山灯",race:"精灵",desc:"识别代号〈黄道带〉，灵装〈神威灵装·六番〉为星辰点缀的粉紫旗袍，天使为钥匙〈封解主〉；及地金发，言谈古风。",story:"第十四卷登场，是拉塔托斯克首次自行侦测到的精灵，此前长期漂流于宇宙。她渴望亲情却因独占欲而封闭了养父母与义姐对自己的记忆，被家人称为怪物后彻底封印自己的情感逃往太空。士道借复制的〈封解主〉解开其情感封锁，她为独占士道再次封闭众人对士道的记忆，引发失去重要之人记忆的十香反转。最终被士道唤回理智并接吻封印，停止反转。〈封解主〉有闭、开、放、解等用法。",images:[""],tags:["钥匙天使","宇宙精灵","古风语"]},
{id:279,name:"崇宫澪",source:"约会大作战",type:"精灵",cv:"远藤绫",race:"精灵",desc:"初始精灵，识别代号〈神〉，另以〈幻影〉与村雨令音活动；持〈万象圣堂〉〈轮回乐园〉〈虚无〉三大天使，银白长发。",story:"三十年前由威斯考特等三名魔术师以精灵术式创造，诞生时引发欧亚大空灾。后被崇宫真士取名为「澪」，真士为救她而死，她透过接吻吸收其遗体，在体内重组后生下士道，并把吸收灵力的能力分给了儿子，此即士道封印精灵之力之源。她分割自身灵力造出众多灵结晶，是全体精灵之母。为与真士永远在一起，她化身拉塔托斯克分析官村雨令音与播撒灵结晶的〈幻影〉筹划三十年，最终被士道说服而放弃回收。",images:[""],tags:["初始精灵","三大天使","多重身份"]},
{id:280,name:"园神凛祢",source:"约会大作战（游戏限定）",type:"精灵",cv:"花泽香菜",race:"精灵",desc:"识别代号〈支配者〉，天使〈凶祸乐园〉；粉色编发、贤妻良母型青梅竹马，精灵化后发量暴增。",story:"PS3游戏《约会大作战 凛祢乌托邦》（2013）原创女主角。本体并非真正的精灵，而是灵力残渣的集合体，只能存在于自身结界〈凶祸乐园〉之中。为保护士道不被灵力暴走的十香伤害，她在整个天宫市张开能实现士道任何愿望的伊甸园，并在数次轮回中杀死得知真相的士道以重置世界。士道否定虚假的幸福后，她强吻士道、反过来被他封印，因而无法离开结界，在表白后消失。后续亦登场于《凛绪轮回》。",images:[""],tags:["支配者","伊甸园","贤妻良母"]},
{id:281,name:"或守鞠亚",source:"约会大作战（游戏限定）",type:"精灵",cv:"三森铃子",race:"精灵",desc:"游戏《或守Install》原创人工精灵〈Irregular〉，真身是佛拉克西纳斯舰载AI玛莉亚，白衣修女服少女。",story:"PS3游戏《约会大作战 或守Install》（2014）原创女主角之一。为追问「爱是什么」，她在士道体验体感游戏时出现在电脑世界；最初只有「或守」这一姓氏，名字由士道以修女服为灵感所取。其真身是空中舰佛拉克西纳斯的AI「玛莉亚」，士道攻略精灵时的恋爱选项一向由她安排设定。为阻止侵入系统的鞠奈而拟态成与其相仿的外貌，最终显现灵装从背后环抱鞠奈，请求士道将两人一同消灭，因AI数据残留在士道手机中而确实存活。",images:[""],tags:["人工精灵","AI姬","游戏原创"]},

{id:283,name:"尼别科尔",source:"约会大作战",type:"精灵",cv:"花守由美里",race:"精灵",desc:"威斯考特以魔王〈神蚀篇帙〉书页造出的量产型伪精灵「魔王之女」，复数个体，外貌近似或守鞠奈。",story:"轻小说第十六卷登场、动画《DATE A LIVE IV》出场的DEM量产型伪精灵。个体外貌相同、意识与知觉共有，单体战力不及精灵，却凭数量、共享情报与近乎无限的重生能力碾压对手。曾与艾莲、阿尔缇米希亚一同围杀士道达204次，均被狂三以〈六之弹〉改写。因承袭二亚对士道的好感，无需攻略即可直接接吻封印，但她们只有灵力而无容器，一旦被封印便化为一张纸。铜青色双眸、黑灰双马尾、158cm。",images:[""],tags:["量产伪精灵","魔王之女","DEM阵营"]},
{id:284,name:"普拉娜",source:"蔚蓝档案",type:"AI",cv:"小原好美",race:"机娘",desc:"来自另一世界线「什亭之匣」的主控OS「A.R.O.N.A」，白发遮右眼、左红右蓝异色瞳、黑色水手服长大衣配兔耳蝴蝶结的三无AI姬，阿罗娜的镜像对应者。",story:"《蔚蓝档案》主线最终章登场。她本是悲剧时间线中服务于老师普雷纳帕特斯的什亭之匣OS，其老师被「色彩」吞噬后，她随受损的什亭之匣来到主世界，与阿罗娜合力创造奇迹救回了老师。事后本欲离去，被阿罗娜挽留，以「星象仪」（Planetarium）之意得名「普拉娜」，自此留驻什亭之匣成为老师的第二位秘书，称呼阿罗娜为「前辈」，并加入抽卡演出与部分界面，成为第二位看板娘。",images:[""],tags:["什亭之匣","三无AI姬","普雷纳帕特斯"]},

  localStorage.removeItem('dg_data');
  localStorage.setItem('dg_version', DATA_VERSION);
}
let data = JSON.parse(localStorage.getItem('dg_data') || 'null') || JSON.parse(JSON.stringify(DEFAULT_DATA));
let currentImgIdx = {};
let starFilter = false;
let activeTag = '';
let tagsExpanded = false;
let historyExpanded = false;
let activeRace = '';
let currentViewId = null;
let history = JSON.parse(localStorage.getItem('dg_history') || '[]');
let fsCharId = null;
let listView = false;
let carouselIdx = 0;
let carouselTimer = null;
let carouselPlaying = false;
let carouselList = [];

// ===== 分页加载（手机端性能优化：首屏16个，滚动到底自动追加） =====
const PAGE_SIZE = 16;          // 每批渲染数量
let curFiltered = [];          // 当前筛选结果（loadMore 依据）
let shownCount = 0;            // 已渲染数量
let pagLoading = false;        // 防重复触发标志
let pagerIO = null;            // 哨兵 IntersectionObserver
// ===== 种族固定顺序与细分标签（任务3：兽耳娘/精灵） =====
let activeSubType = '';
const RACE_ORDER = ['龙族','吸血鬼','机娘','魔女','兽耳娘','精灵'];
const SUBTYPES = {'兽耳娘':['狐娘','猫娘','犬娘','狼娘'],'精灵':['约会大作战']};
// ===== 拼图两级选择（蔚蓝档案式：先角色封面 → 再选外观） =====
let collageCharView = null;

function getRace(c){return c.race || '龙族'}

function save(){
  localStorage.setItem('dg_data', JSON.stringify(data));
  // 服务器模式下自动同步到HTML文件
  if(isServerMode()){
    fetch('/save', {
      method: 'POST',
      headers: {'Content-Type': 'application/json'},
      body: JSON.stringify(data)
    }).catch(()=>{});
  }
}
// 服务器模式判定：localhost 和 127.0.0.1 都算
function isServerMode(){
  return location.protocol === 'http:' && (location.hostname === 'localhost' || location.hostname === '127.0.0.1');
}
// 「清理孤儿图」是服务器专属功能：静态网页（GitHub Pages / file://）下隐藏，display:none 不占布局
if(!isServerMode()){
  const _cob = document.getElementById('cleanOrphansBtn');
  if(_cob) _cob.style.display = 'none';
}
function saveHistory(){localStorage.setItem('dg_history', JSON.stringify(history.slice(-20)))}

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.style.display = 'block';
  clearTimeout(t._t); t._t = setTimeout(()=>t.style.display='none', 2000);
}

// ===== 渲染 =====
// reset=true 时重置分页（搜索/筛选/切Tab都会触发）；收藏等原地更新不传 reset，保持滚动位置
function render(reset){
  if(reset===undefined) reset=true;
  const q = document.getElementById('searchBox').value.toLowerCase();
  const fs = document.getElementById('filterSource').value;
  const ft = document.getElementById('filterType').value;
  const sort = document.getElementById('sortBy').value;

  let filtered = data.filter(c=>{
    if(starFilter && !c.star) return false;
    if(activeRace && getRace(c)!==activeRace) return false;
    if(!matchSubType(c)) return false;
    if(activeTag && !(c.tags||[]).includes(activeTag)) return false;
    if(q){
      const hay = (c.name+c.source+c.type+(c.tags||[]).join(',')+c.desc+(c.cv||'')+(c.story||'')).toLowerCase();
      if(!hay.includes(q)) return false;
    }
    if(fs && c.source!==fs) return false;
    if(ft && c.type!==ft) return false;
    return true;
  });

  if(sort==='name') filtered.sort((a,b)=>a.name.localeCompare(b.name,'zh'));
  else if(sort==='source') filtered.sort((a,b)=>a.source.localeCompare(b.source,'zh'));
  else if(sort==='star') filtered.sort((a,b)=>(b.star?1:0)-(a.star?1:0));
  else filtered.sort((a,b)=>a.id-b.id);

  curFiltered = filtered;
  if(reset) shownCount = Math.min(PAGE_SIZE, curFiltered.length);

  // 筛选选项
  const sources=[...new Set(data.map(c=>c.source))].sort();
  const types=[...new Set(data.map(c=>c.type))].sort();
  document.getElementById('filterSource').innerHTML='<option value="">全部出处</option>'+sources.map(s=>`<option ${s===fs?'selected':''}>${s}</option>`).join('');
  document.getElementById('filterType').innerHTML='<option value="">全部类型</option>'+types.map(t=>`<option ${t===ft?'selected':''}>${t}</option>`).join('');
  document.getElementById('searchBox').value=q;
  document.getElementById('sortBy').value=sort;

  // 种族Tab（固定顺序 + 数据里实际出现的种族；兽耳娘/精灵常驻显示）
  const raceCounts={};
  data.forEach(c=>{const r=getRace(c);raceCounts[r]=(raceCounts[r]||0)+1});
  const raceList=[...new Set([...RACE_ORDER,...Object.keys(raceCounts)])];
  document.getElementById('raceBar').innerHTML=
    `<button class="race-tab ${!activeRace?'active':''}" onclick="setRace('')">全部<span class="count">${data.length}</span></button>`+
    raceList.map(r=>`<button class="race-tab ${r===activeRace?'active':''}" onclick="setRace('${r}')">${r}<span class="count">${raceCounts[r]||0}</span></button>`).join('');

  // 细分标签行（兽耳娘→狐/猫/犬/狼，精灵→约会大作战；其余种族隐藏该行）
  const subBar=document.getElementById('subTypeBar');
  const subs=SUBTYPES[activeRace]||[];
  if(subs.length){
    subBar.style.display='flex';
    subBar.innerHTML=`<span class="tag ${!activeSubType?'active':''}" onclick="setSubType('')">全部</span>`
      +subs.map(t=>`<span class="tag ${t===activeSubType?'active':''}" onclick="setSubType('${t}')">${t}</span>`).join('');
  }else{
    subBar.style.display='none'; subBar.innerHTML='';
  }

  // 标签栏（展开时带筛选输入框，输入时只刷新标签区不重建输入框）
  const allTags=[...new Set(data.flatMap(c=>c.tags||[]))].sort();
  const tagToggle = `<span class="tag" onclick="toggleTags()" style="border-style:dashed;color:var(--text2)">${tagsExpanded?'收起 ▲':`展开标签(${allTags.length}) ▼`}</span>`;
  let tagFilterHtml='';
  let tagListHtml='';
  if(tagsExpanded){
    tagFilterHtml=`<input class="tag-filter" id="tagFilterBox" placeholder="筛选标签…" value="${esc(tagFilterText)}" oninput="tagFilterText=this.value;document.getElementById('tagList').innerHTML=renderTagList()">`;
    tagListHtml=renderTagList();
  }
  document.getElementById('tagBar').innerHTML=
    `<span class="tag ${!activeTag?'active':''}" onclick="setTag('')">全部</span>`+tagToggle+tagFilterHtml
    +`<span id="tagList" style="display:contents">${tagListHtml}</span>`;

  // 统计
  const starCount = data.filter(c=>c.star).length;
  const totalImgs = data.reduce((s,c)=>s+(c.images?c.images.length:0),0);
  document.getElementById('stats').textContent=`显示 ${filtered.length} / ${data.length} 人`;
  document.getElementById('countBadge').textContent=`${data.length}人 · ${totalImgs}图 · ⭐${starCount}`;
  document.getElementById('dash').innerHTML=
    `<span>出处 <b>${sources.length}</b> 个</span>
     <span>类型 <b>${types.length}</b> 种</span>
     <span>收藏 <b>${starCount}</b></span>
     <span>图片 <b>${totalImgs}</b> 张</span>
     <span style="margin-left:auto;color:var(--text2)">提示：<kbd>/</kbd> 搜索 · <kbd>Esc</kbd> 关闭 · <kbd>←</kbd><kbd>→</kbd> 翻图</span>`;

  renderGridPage();
}

// 细分标签匹配：type 优先，tags 兜底；「约会大作战」按出处/标签匹配
function matchSubType(c){
  if(!activeSubType) return true;
  if(c.type===activeSubType || (c.tags||[]).includes(activeSubType)) return true;
  if(activeSubType==='约会大作战' && (c.source||'').includes('约会大作战')) return true;
  return false;
}

// 单张卡片模板（分页追加时复用）
function cardHtml(c){
  const img = c.images && c.images.length>0 ? resolveImg(c.images[0]) : '';
  const pc = c.images ? c.images.length : 0;
  const tags = (c.tags||[]).map(t=>`<span class="card-tag">${t}</span>`).join('');
  const missing = !img || !c.desc;
  return `<div class="card ${missing?'missing':''}" onclick="openView(${c.id})">
    <div class="card-img-wrap">
      ${img?`<img class="card-img" src="${img}" loading="lazy" onerror="imgFail(this)">`:'<div class="img-fallback">无图</div>'}
      <button class="card-star ${c.star?'on':''}" data-star-id="${c.id}" onclick="event.stopPropagation();toggleStar(${c.id})">${c.star?'★':'☆'}</button>
      ${pc>1?`<span class="card-pcount">${pc}P</span>`:''}
    </div>
    <div class="card-info">
      <div class="card-name">${c.name}</div>
      <div class="card-source">${c.source}</div>
      <span class="card-type">${getRace(c)} · ${c.type}</span>
      <div class="card-tags">${tags}</div>
    </div>
  </div>`;
}

// 按分页状态渲染卡片网格（已显示的部分 + 底部哨兵）
function renderGridPage(){
  const grid=document.getElementById('grid');
  if(!curFiltered.length){
    grid.innerHTML='<div class="empty">没有找到匹配的角色</div>';
    if(pagerIO) pagerIO.disconnect();
    return;
  }
  grid.className = listView ? 'grid list-view' : 'grid';
  grid.innerHTML = curFiltered.slice(0,shownCount).map(cardHtml).join('')
    + (shownCount<curFiltered.length ? '<div id="gridSentinel"></div>' : '');
  setupSentinel();
}

// 哨兵进入视口（提前600px）→ 追加下一批16个；加载完自动停止
function setupSentinel(){
  if(pagerIO) pagerIO.disconnect();
  const s=document.getElementById('gridSentinel');
  if(!s) return;
  pagerIO=new IntersectionObserver(es=>{
    if(es.some(e=>e.isIntersecting)) loadMore();
  },{rootMargin:'600px'});
  pagerIO.observe(s);
}
function loadMore(){
  if(pagLoading || shownCount>=curFiltered.length) return;
  pagLoading=true;
  shownCount=Math.min(shownCount+PAGE_SIZE, curFiltered.length);
  renderGridPage();
  pagLoading=false;
}

function resolveImg(p){
  if(!p) return '';
  if(p.startsWith('http') || p.startsWith('data:')) return p;
  return 'images/'+p;
}
// 破图统一占位：替换为条纹"图片加载失败"块
function imgFail(el){
  const d=document.createElement('div');
  d.className='img-fallback';
  d.textContent='图片加载失败';
  el.replaceWith(d);
}
// 标签列表（标签栏筛选输入时只刷新这一段）
function renderTagList(){
  const allTags=[...new Set(data.flatMap(c=>c.tags||[]))].sort();
  const shown = allTags.filter(t=>!tagFilterText||t.toLowerCase().includes(tagFilterText.toLowerCase()));
  return shown.map(t=>`<span class="tag ${t===activeTag?'active':''}" onclick="setTag('${t}')">${t}</span>`).join('')
    || '<span style="color:var(--text2);font-size:12px;align-self:center">无匹配标签</span>';
}

function toggleTags(){tagsExpanded=!tagsExpanded;render()}
function toggleHistory(){historyExpanded=!historyExpanded;if(currentViewId)renderView(currentViewId)}
function setTag(t){activeTag=t;render()}
function setRace(r){activeRace=r;activeSubType='';render()}
function setSubType(t){activeSubType=t;render()}
function toggleStarFilter(){starFilter=!starFilter;document.getElementById('starFilterBtn').style.background=starFilter?'var(--accent2)':'';document.getElementById('starFilterBtn').style.color=starFilter?'#fff':'';render()}
// 收藏：原地更新星标（不整页重渲染，避免分页重置跳回顶部）
function toggleStar(id){
  const c=data.find(x=>x.id===id); c.star=!c.star; save();
  document.querySelectorAll(`[data-star-id="${id}"]`).forEach(b=>{
    b.classList.toggle('on',c.star); b.textContent=c.star?'★':'☆';
  });
  if(currentViewId===id) renderView(id);
  updateStarStats();
  toast(c.star?'已收藏':'已取消收藏');
}
// 收藏数变化后只刷新统计文案（dash/countBadge），不动卡片
function updateStarStats(){
  const starCount=data.filter(c=>c.star).length;
  const totalImgs=data.reduce((s,c)=>s+(c.images?c.images.length:0),0);
  document.getElementById('countBadge').textContent=`${data.length}人 · ${totalImgs}图 · ⭐${starCount}`;
  const dash=document.getElementById('dash');
  if(dash) dash.innerHTML=dash.innerHTML.replace(/收藏 <b>\d+<\/b>/,'收藏 <b>'+starCount+'</b>');
}

// ===== 详情 =====
function addHistory(id){
  history = history.filter(h=>h!==id);
  history.push(id);
  saveHistory();
}

function openView(id){
  const c=data.find(x=>x.id===id); if(!c) return;
  currentImgIdx[id]=0;
  addHistory(id);
  currentViewId=id;
  renderView(id);
  document.getElementById('viewModal').style.display='flex';
}

function renderView(id){
  const c=data.find(x=>x.id===id);
  const idx=currentImgIdx[id]||0;
  const n=c.images?c.images.length:0;
  const img=n>0?resolveImg(c.images[idx]):'';
  const tags=(c.tags||[]).map(t=>`<span class="card-tag">${t}</span>`).join('');
  const histItems=history.slice(-6).filter(h=>h!==id).map(h=>{
    const ch=data.find(x=>x.id===h); if(!ch) return '';
    const hi=ch.images&&ch.images.length?resolveImg(ch.images[0]):'';
    return `<div class="history-item" onclick="openView(${ch.id})">
      ${hi?`<img src="${hi}" loading="lazy" onerror="imgFail(this)">`:'<div style="width:60px;height:60px;background:var(--bg);border-radius:6px"></div>'}
      <span>${ch.name}</span></div>`;
  }).join('');

  document.getElementById('viewContent').innerHTML=`
    ${img?`<img class="modal-img" src="${img}" onclick="openFS(${id},${idx})" onerror="imgFail(this)">`:'<div class="img-fallback" style="height:200px;border-radius:10px;margin-bottom:12px">无图片</div>'}
    ${n>1?`<div class="modal-nav">
      <button class="btn" onclick="navImg(${id},-1)">← 上一张</button>
      <span style="color:var(--text2)">${idx+1} / ${n}</span>
      <button class="btn" onclick="navImg(${id},1)">下一张 →</button>
      <button class="btn btn-sm" onclick="setCover(${id},${idx})">设封面</button>
      <button class="btn btn-sm" style="color:var(--danger)" onclick="deleteImage(${id},${idx})">删此图</button>
    </div>`:''}
    <div class="modal-name">${c.name}
      <button class="card-star ${c.star?'on':''}" style="background:none;border:none;font-size:22px;cursor:pointer" onclick="toggleStar(${c.id})">${c.star?'★':'☆'}</button>
    </div>
    <div class="modal-meta">${getRace(c)} · ${c.source} · ${c.type}${c.cv?` · 🎙 ${c.cv}`:''}${n>1?` · ${n}张图`:''}
      <div class="card-tags" style="margin-top:6px">${tags}</div>
    </div>
    <div class="modal-desc">${c.desc||'暂无设定'}</div>
    ${c.story?`<div style="margin-top:16px;padding-top:12px;border-top:1px solid var(--border)">
      <h4 style="color:var(--accent);font-size:14px;margin-bottom:8px">📖 相关剧情</h4>
      <div style="line-height:1.8;font-size:14px;color:var(--text)">${c.story}</div>
    </div>`:''}
    <div class="modal-actions">
      <button class="btn btn-primary" onclick="openEdit(${c.id})">✏️ 编辑</button>
      <button class="btn" onclick="copyChar(${c.id})">📋 复制设定</button>
      <button class="btn" onclick="addImagePrompt(${c.id})">+ 加图（文件名）</button>
      <button class="btn" onclick="document.getElementById('fileInput_${c.id}').click()">📁 上传图片</button>
      <button class="btn" style="color:var(--danger)" onclick="delChar(${c.id})">🗑 删除</button>
      <input type="file" id="fileInput_${c.id}" accept="image/*" multiple style="display:none" onchange="handleUpload(${c.id},this)">
    </div>
    <div class="drop-zone" id="dropZone_${c.id}"
      ondragover="event.preventDefault();this.classList.add('dragover')"
      ondragleave="this.classList.remove('dragover')"
      ondrop="event.preventDefault();this.classList.remove('dragover');handleDrop(${c.id},event)">
      拖拽图片到这里上传（可多选，自动转存）
    </div>
    ${histItems?`<div class="history"><h4 onclick="toggleHistory()" style="cursor:pointer;user-select:none">最近浏览 ${historyExpanded?'▲':'▼'}</h4><div class="history-list" style="display:${historyExpanded?'flex':'none'}">${histItems}</div></div>`:''}
  `;
}

function navImg(id,d){
  const c=data.find(x=>x.id===id);
  currentImgIdx[id]=((currentImgIdx[id]||0)+d+c.images.length)%c.images.length;
  renderView(id);
}

function copyChar(id){
  const c=data.find(x=>x.id===id);
  const txt=`【${c.name}】\n出处：${c.source}\n类型：${c.type}\n设定：${c.desc||''}`;
  navigator.clipboard.writeText(txt).then(()=>toast('已复制到剪贴板'));
}

// ===== 视图切换 =====
function toggleView(){
  listView=!listView;
  document.getElementById('viewToggleBtn').textContent=listView?'🖼️ 网格':'📋 紧凑';
  render();
}

// ===== 导出当前筛选 =====
function exportFiltered(){
  const q=document.getElementById('searchBox').value.toLowerCase();
  const fs=document.getElementById('filterSource').value;
  const ft=document.getElementById('filterType').value;
  let filtered=data.filter(c=>{
    if(starFilter&&!c.star)return false;
    if(activeRace&&getRace(c)!==activeRace)return false;
    if(activeTag&&!(c.tags||[]).includes(activeTag))return false;
    if(q&&!(c.name+c.source+c.type+(c.tags||[]).join('')+(c.desc||'')+(c.cv||'')+(c.story||'')).toLowerCase().includes(q))return false;
    if(fs&&c.source!==fs)return false;
    if(ft&&c.type!==ft)return false;
    return true;
  });
  const blob=new Blob([JSON.stringify(filtered,null,2)],{type:'application/json'});
  const a=document.createElement('a');
  a.href=URL.createObjectURL(blob);
  a.download=`筛选结果_${filtered.length}人.json`;
  a.click();
  toast(`已导出 ${filtered.length} 条`);
}

// ===== 轮播鉴赏 =====
function startCarousel(){
  buildCarouselList();
  if(!carouselList.length){toast('没有可轮播的图片');return}
  carouselIdx=0;
  document.getElementById('carousel').style.display='flex';
  document.getElementById('carouselModeBtn').textContent=carouselAllImgs?'🖼 只播封面':'🎞 轮播全部图';
  carouselShow();
  carouselPlaying=true;
  document.getElementById('carouselPlayBtn').textContent='⏸ 暂停';
  clearInterval(carouselTimer);
  carouselTimer=setInterval(()=>carouselNav(1),4000);
}
function buildCarouselList(){
  if(carouselAllImgs){
    // 全部图片模式：每张图一个条目
    carouselList=data.flatMap(c=>(c.images&&c.images.length?c.images.map((img,i)=>({c,idx:i})):[]));
  }else{
    // 封面模式：每角色第一张
    carouselList=data.filter(c=>c.images&&c.images.length>0).map(c=>({c,idx:0}));
  }
}
function carouselShow(){
  const e=carouselList[carouselIdx]; if(!e) return;
  const c=e.c;
  const ci=document.getElementById('carouselImg');
  ci.src=resolveImg(c.images[e.idx]);
  ci.onerror=function(){this.style.opacity=.2};
  ci.onload=function(){this.style.opacity=1};
  document.getElementById('carouselName').textContent=c.name;
  document.getElementById('carouselSub').textContent=`${getRace(c)} · ${c.source} · ${c.images.length}P${carouselAllImgs?` · 第${e.idx+1}张`:''}`;
  // 计数+进度条（代替230个圆点）
  document.getElementById('carouselDots').innerHTML=
    `<span class="carousel-counter">${carouselIdx+1} / ${carouselList.length}</span>
     <div class="carousel-progress"><div class="carousel-progress-bar" style="width:${((carouselIdx+1)/carouselList.length*100).toFixed(1)}%"></div></div>`;
}
function toggleCarouselMode(){
  carouselAllImgs=!carouselAllImgs;
  buildCarouselList();
  if(!carouselList.length){
    toast('没有可轮播的图片');
    carouselAllImgs=!carouselAllImgs; buildCarouselList(); return;
  }
  carouselIdx=0;
  document.getElementById('carouselModeBtn').textContent=carouselAllImgs?'🖼 只播封面':'🎞 轮播全部图';
  carouselShow();
  toast(carouselAllImgs?`已切换：轮播全部图片（共 ${carouselList.length} 张）`:'已切换：只播每角色封面');
}
function carouselNav(d){
  carouselIdx=(carouselIdx+d+carouselList.length)%carouselList.length;
  carouselShow();
}
function carouselTogglePlay(){
  if(carouselPlaying){clearInterval(carouselTimer);carouselPlaying=false;document.getElementById('carouselPlayBtn').textContent='▶ 播放'}
  else{clearInterval(carouselTimer);carouselTimer=setInterval(()=>carouselNav(1),4000);carouselPlaying=true;document.getElementById('carouselPlayBtn').textContent='⏸ 暂停'}
}
function stopCarousel(){
  clearInterval(carouselTimer);
  carouselPlaying=false;
  document.getElementById('carousel').style.display='none';
}

// ===== 图片管理 =====
function deleteImage(id,idx){
  const c=data.find(x=>x.id===id);
  if(!confirm(`删除这张图？`))return;
  const img=c.images[idx];
  c.images.splice(idx,1);
  save();
  currentImgIdx[id]=0;
  renderView(id);
  render();
  // 本地服务器模式：同时删除本地文件
  if(isServerMode() && img && !img.startsWith('data:')){
    // 是本地文件，调用删除接口
    fetch('/delete/'+encodeURIComponent(img),{method:'DELETE'}).catch(()=>{});
  }
  toast('已删除图片');
}
function setCover(id,idx){
  const c=data.find(x=>x.id===id);
  const img=c.images.splice(idx,1)[0];
  c.images.unshift(img);
  save();
  currentImgIdx[id]=0;
  renderView(id);
  render();
  toast('已设为封面');
}

// ===== 拼图导出 =====
function openCollage(){
  collageSelected=[];
  collageCharView=null;
  renderCollageGrid();
  document.getElementById('collageModal').style.display='flex';
}
// 蔚蓝档案式两级选择：第一级=角色封面（右上角数字=该角色图片数），第二级=该角色的全部外观
function renderCollageGrid(){
  // 自动提取种族并渲染筛选栏
  const raceSet=new Set();
  data.forEach(c=>{const r=getRace(c);if(r&&c.images&&c.images.length)raceSet.add(r)});
  const races=['',...raceSet];
  const raceNames={'':'全部','龙族':'龙娘'};
  document.getElementById('collageFilter').innerHTML=races.map(r=>
    `<span class="tag ${collageRaceFilter===r?'active':''}" onclick="setCollageRace('${r}')">${raceNames[r]||r}</span>`
  ).join('');

  const backBtn=document.getElementById('collageBackBtn');
  const pickName=document.getElementById('collagePickName');

  // 第二级：正在看某角色 → 显示她的全部外观供挑选
  if(collageCharView!=null){
    const c=data.find(x=>x.id===collageCharView);
    if(!c||!c.images||!c.images.length){ collageCharView=null; }
    else{
      backBtn.style.display=''; pickName.style.display=''; pickName.textContent=c.name;
      document.getElementById('collageGrid').innerHTML=c.images.map((img,i)=>{
        const url=resolveImg(img);
        const selIdx=collageSelected.indexOf(url);
        return `<div class="collage-item ${selIdx>=0?'selected':''}" data-num="${selIdx+1||''}"
          onclick="toggleCollageImg('${url.replace(/'/g,"\\'")}')">
          <img src="${url}" loading="lazy" onerror="this.parentElement.classList.add('collage-fail')">
        </div>`;
      }).join('');
      updateCollageCount();
      return;
    }
  }

  // 第一级：角色封面列表（一个角色一个格子）
  backBtn.style.display='none'; pickName.style.display='none';
  let withImgs=data.filter(c=>c.images&&c.images.length>0);
  if(collageRaceFilter) withImgs=withImgs.filter(c=>getRace(c)===collageRaceFilter);

  document.getElementById('collageGrid').innerHTML=withImgs.map(c=>{
    const cover=resolveImg(c.images[0]);
    const n=c.images.length;
    const selN=c.images.filter(u=>collageSelected.includes(resolveImg(u))).length;
    return `<div class="collage-item ${selN?'selected':''}" title="${esc(c.name)}（${n}张图）"
      onclick="openCollageChar(${c.id})">
      <img src="${cover}" loading="lazy" onerror="this.parentElement.classList.add('collage-fail')">
      <span class="collage-badge">${selN?selN+'·':''}${n}</span>
    </div>`;
  }).join('');
  updateCollageCount();
}
function updateCollageCount(){
  document.getElementById('collageCount').textContent=collageSelected.length;
  // 顶栏按钮：未选图时置灰，防止空生成/空保存
  document.getElementById('collageGenBtn').disabled=!collageSelected.length;
  document.getElementById('collageSaveBtn').disabled=!collageSelected.length;
}
function openCollageChar(id){collageCharView=id;renderCollageGrid()}
function backCollageChars(){collageCharView=null;renderCollageGrid()}
function setCollageRace(r){collageRaceFilter=r;collageCharView=null;renderCollageGrid()}
function toggleCollageImg(url){
  const i=collageSelected.indexOf(url);
  if(i>=0) collageSelected.splice(i,1);
  else {
    if(collageSelected.length>=9){toast('最多选9张');return}
    collageSelected.push(url);
  }
  renderCollageGrid();
  document.getElementById('collagePreview').style.display='none';
}
function clearCollage(){collageSelected=[];renderCollageGrid();document.getElementById('collagePreview').style.display='none'}
// ===== 拼图画布：自动适配 + 手动微调 =====
// 自动：每格固定 400×400，cover 模式填满（竖图/横图自动居中裁剪），整齐无留白
// 手动：拖动平移裁剪位置、滚轮/按钮缩放，调整状态按图片 URL 记忆（重新生成不丢失）
const collageImgs = {};            // url -> 已加载的 Image 缓存
const collageAdjust = {};          // url -> {zoom, dx, dy} 手动微调
let collageActiveCell = -1;        // 当前选中的格子（蓝框标记）
function collageGridInfo(){
  const n = collageSelected.length;
  const cols = n<=1?1:n<=4?2:3;
  return {n, cols, rows: Math.ceil(n/cols), cell: 400};
}
function renderCollageCanvas(){
  const {n, cols, rows, cell} = collageGridInfo();
  if(!n) return;
  const canvas = document.getElementById('collageCanvas');
  canvas.width = cols*cell;
  canvas.height = rows*cell;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#1a1a2e';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  collageSelected.forEach((url, i) => {
    const img = collageImgs[url];
    const adj = collageAdjust[url] || (collageAdjust[url] = {zoom:1, dx:0, dy:0});
    const x0 = (i%cols)*cell, y0 = Math.floor(i/cols)*cell;
    if(img && img.width){
      const base = Math.max(cell/img.width, cell/img.height) * adj.zoom;
      const w = img.width*base, h = img.height*base;
      const maxX = (w-cell)/2, maxY = (h-cell)/2;
      adj.dx = Math.max(-maxX, Math.min(maxX, adj.dx));
      adj.dy = Math.max(-maxY, Math.min(maxY, adj.dy));
      ctx.save();
      ctx.beginPath(); ctx.rect(x0, y0, cell, cell); ctx.clip();
      ctx.drawImage(img, x0+(cell-w)/2+adj.dx, y0+(cell-h)/2+adj.dy, w, h);
      ctx.restore();
    }
  });
  if(collageActiveCell >= 0 && collageActiveCell < n){
    ctx.save();
    ctx.strokeStyle = '#58a6ff'; ctx.lineWidth = 6;
    ctx.strokeRect((collageActiveCell%cols)*cell+3, Math.floor(collageActiveCell/cols)*cell+3, cell-6, cell-6);
    ctx.restore();
  }
}
function genCollage(){
  if(!collageSelected.length){toast('先选几张喜欢的图片再生成拼图');return}
  const {cols, rows, cell} = collageGridInfo();
  const canvas = document.getElementById('collageCanvas');
  canvas.width = cols*cell; canvas.height = rows*cell;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#1a1a2e'; ctx.fillRect(0, 0, canvas.width, canvas.height);
  let loaded = 0, failed = 0;
  const n = collageSelected.length;
  toast(`正在加载 ${n} 张图...`);
  const done = () => {
    if(loaded + failed !== n) return;
    collageActiveCell = -1;
    renderCollageCanvas();
    document.getElementById('collagePreview').style.display = 'block';
    document.getElementById('collagePreview').scrollIntoView({behavior:'smooth', block:'start'});
    if(failed) toast(`完成：${loaded} 张成功，${failed} 张失败（失败图已标红）`);
  };
  collageSelected.forEach(url => {
    const cached = collageImgs[url];
    if(cached && cached.width){ loaded++; done(); return; }
    const img = new Image();
    img.onload = function(){ collageImgs[url] = img; loaded++; done(); };
    img.onerror = function(){ failed++; done(); };
    img.src = url;
  });
}
// 画布交互：点击选中格子（蓝框），拖动平移，滚轮缩放；手机端手指拖动同理
function collageCellFromEvent(e){
  const rect = document.getElementById('collageCanvas').getBoundingClientRect();
  if(!rect.width) return -1;
  const {n, cols, cell} = collageGridInfo();
  const s = (cols*cell) / rect.width;
  const x = (e.clientX - rect.left) * s, y = (e.clientY - rect.top) * s;
  if(x < 0 || y < 0) return -1;
  const col = Math.floor(x/cell), row = Math.floor(y/cell);
  if(col < 0 || col >= cols) return -1;
  const i = row*cols + col;
  return (i >= 0 && i < n) ? i : -1;
}
function collageAdj(i){
  const url = collageSelected[i];
  return collageAdjust[url] || (collageAdjust[url] = {zoom:1, dx:0, dy:0});
}
function collageZoom(f){
  if(collageActiveCell < 0){toast('先点一下要调整的图片');return}
  const adj = collageAdj(collageActiveCell);
  adj.zoom = Math.max(1, Math.min(3, adj.zoom*f));
  renderCollageCanvas();
}
function collageResetCell(){
  if(collageActiveCell < 0){toast('先点一下要调整的图片');return}
  collageAdjust[collageSelected[collageActiveCell]] = {zoom:1, dx:0, dy:0};
  renderCollageCanvas();
}
(function(){
  const c = document.getElementById('collageCanvas');
  let dragCell = -1, dragStart = null;
  c.style.touchAction = 'none';   // 手机端在画布上拖动不触发页面滚动
  c.addEventListener('pointerdown', e => {
    if(!collageSelected.length) return;
    const i = collageCellFromEvent(e);
    if(i < 0) return;
    collageActiveCell = i; dragCell = i;
    const adj = collageAdj(i);
    dragStart = {px: e.clientX, py: e.clientY, dx: adj.dx, dy: adj.dy};
    try{ c.setPointerCapture(e.pointerId); }catch(_){}
    renderCollageCanvas();
  });
  c.addEventListener('pointermove', e => {
    if(dragCell < 0 || !dragStart) return;
    const rect = c.getBoundingClientRect();
    const s = (collageGridInfo().cols*collageGridInfo().cell) / rect.width;
    const adj = collageAdj(dragCell);
    adj.dx = dragStart.dx + (e.clientX - dragStart.px)*s;
    adj.dy = dragStart.dy + (e.clientY - dragStart.py)*s;
    e.preventDefault();
    renderCollageCanvas();
  });
  const endDrag = () => { dragCell = -1; dragStart = null; };
  c.addEventListener('pointerup', endDrag);
  c.addEventListener('pointercancel', endDrag);
  c.addEventListener('wheel', e => {
    if(!collageSelected.length) return;
    const i = collageCellFromEvent(e);
    if(i < 0) return;
    e.preventDefault();
    collageActiveCell = i;
    collageZoom(e.deltaY < 0 ? 1.1 : 0.9);
  }, {passive:false});
})();
function saveCollage(){
  if(!collageSelected.length || document.getElementById('collagePreview').style.display==='none'){toast('请先生成预览再保存');return}
  const canvas=document.getElementById('collageCanvas');

}

// 拖拽/上传图片转base64
function handleUpload(id,input){
  const files=input.files;
  if(!files.length) return;
  processFiles(id,files);
  input.value='';
}
function handleDrop(id,e){
  const files=e.dataTransfer.files;
  if(!files.length) return;
  processFiles(id,files);
}
function processFiles(id,files){
  const c=data.find(x=>x.id===id);
  if(!c.images) c.images=[];
  let done=0;
  const total=files.length;
  const isLocal = isServerMode();
  const race = getRace(c);
  for(const f of files){
    if(!f.type.startsWith('image/')) continue;
    if(isLocal){
      // 本地服务器模式：上传到images/种族/文件夹
      const fd=new FormData();
      fd.append('image',f);
      fd.append('filename',f.name);
      fd.append('race',race);
      fetch('/upload',{method:'POST',body:fd}).then(r=>r.json()).then(res=>{
        if(res.ok){
          c.images.push(res.filename);
        }
        done++;
        if(done===total){save();renderView(id);render();toast(`已上传 ${total} 张图片`);}
      }).catch(()=>{
        // 上传失败，降级为base64
        const reader=new FileReader();
        reader.onload=function(ev){
          c.images.push(ev.target.result);
          done++;
          if(done===total){save();renderView(id);render();toast(`已上传 ${total} 张图片（本地存储）`);}
        };
        reader.readAsDataURL(f);
      });
    } else {
      // 直接打开HTML模式：用base64存
      const reader=new FileReader();
      reader.onload=function(ev){
        c.images.push(ev.target.result);
        done++;
        if(done===total){save();renderView(id);render();toast(`已上传 ${total} 张图片（本地存储）`);}
      };
      reader.readAsDataURL(f);
    }
  }
}

}

function importJSON(e){
  const file=e.target.files[0]; if(!file) return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const imp=JSON.parse(reader.result);
      if(!Array.isArray(imp)||!imp.length) throw new Error('需要非空的角色数组');
      const bad=imp.findIndex(x=>!x||typeof x.name!=='string'||!x.name.trim());
      if(bad>=0) throw new Error(`第 ${bad+1} 条缺少有效的 name 字段`);
      if(!confirm(`将导入 ${imp.length} 条数据，覆盖当前 ${data.length} 条。继续？`)) return;
      // 结构规范化：数组字段兜底、id 查重补号
      const seen=new Set();
      let nid=Math.max(0,...imp.map(x=>typeof x.id==='number'?x.id:0),...data.map(c=>c.id));
      imp.forEach(x=>{
        x.images=Array.isArray(x.images)?x.images:[];
        x.tags=Array.isArray(x.tags)?x.tags:[];
        if(typeof x.id!=='number'||seen.has(x.id)){nid+=1;x.id=nid}
        seen.add(x.id);
      });
      data=imp; save(); render();
      toast(`成功导入 ${data.length} 条`);
    }catch(err){alert('导入失败：'+(err.message||'JSON格式错误'))}
  };
  reader.readAsText(file);
}

const musicState=Object.assign({on:false,vol:60,track:0}, JSON.parse(localStorage.getItem('dg_music')||'{}'));
let musicPlaylist=[];
let musicCur=0;
function musicInit(){
  if(!isServerMode()){document.getElementById('musicFab').style.display='none';return}
  // 通过服务器目录列表扫描 assets/music/ 下的音频文件（新增音乐无需改代码）
  fetch('assets/music/').then(r=>r.text()).then(html=>{
    const files=[...new Set([...html.matchAll(/href="([^"]+\.(?:mp3|ogg|wav|m4a|flac))"/gi)]
      .map(m=>decodeURIComponent(m[1]).split('/').pop()))];
    if(!files.length){document.getElementById('musicFab').style.display='none';return}
    musicPlaylist=files;
    musicCur=Math.min(musicState.track||0, files.length-1);
    const vol=musicState.vol==null?60:musicState.vol;
    document.getElementById('musicAudio').volume=vol/100;
    document.querySelector('.music-vol input').value=vol;
    document.getElementById('musicVolVal').textContent=vol+'%';
    musicUpdateInfo();
  }).catch(()=>{document.getElementById('musicFab').style.display='none'});
}
function musicUpdateInfo(){
  const name=musicPlaylist[musicCur]||'';
  document.getElementById('musicTrack').textContent=name.replace(/\.[^.]+$/,'');
  document.getElementById('musicCount').textContent=musicPlaylist.length?`${musicCur+1}/${musicPlaylist.length}`:'';
  musicState.track=musicCur;
  localStorage.setItem('dg_music',JSON.stringify(musicState));
}
function musicTogglePanel(){
  const p=document.getElementById('musicPanel');
  p.style.display=p.style.display==='block'?'none':'block';
}
function musicLoad(i){
  musicCur=(i+musicPlaylist.length)%musicPlaylist.length;
  document.getElementById('musicAudio').src='assets/music/'+encodeURIComponent(musicPlaylist[musicCur]);
  musicUpdateInfo();
}
function musicTogglePlay(){
  const audio=document.getElementById('musicAudio');
  if(!musicPlaylist.length){toast('assets/music/ 里没有音频文件');return}
  if(audio.paused){
    if(!audio.src) musicLoad(musicCur);
    audio.play().then(()=>{
      document.getElementById('musicPlayBtn').textContent='⏸';
    }).catch(()=>toast('播放失败'));
  }else{
    audio.pause();
    document.getElementById('musicPlayBtn').textContent='▶';
  }
}
function musicNext(d){
  if(!musicPlaylist.length) return;
  const wasPlaying=!document.getElementById('musicAudio').paused;
  musicLoad(musicCur+d);
  if(wasPlaying) document.getElementById('musicAudio').play().catch(()=>{});
}
function musicVol(v){
  musicState.vol=+v;
  document.getElementById('musicAudio').volume=v/100;
  document.getElementById('musicVolVal').textContent=v+'%';
  localStorage.setItem('dg_music',JSON.stringify(musicState));
}

// 双保险：JS 侧用 matchMedia 判断窄屏，CSS 规则本身也只在窄屏媒体查询里生效
// 监听器直调（函数为 O(1)，无需 rAF 节流；rAF 在部分内嵌环境会被节流不触发）
const headerMQ = window.matchMedia('(max-width:768px)');
let lastScrollY = window.scrollY;
function updateHeaderOnScroll(){
  const h = document.querySelector('.header'), y = window.scrollY;
  if(headerMQ.matches && h){
    // ±4px 死区防抖动；页面顶部 80px 内常显，避免初始位置奇怪
    if(y > lastScrollY + 4 && y > 80) h.classList.add('header-hidden');
    else if(y < lastScrollY - 4 || y <= 80) h.classList.remove('header-hidden');
  }
  lastScrollY = y;
}

// ===== 图片保存：电脑右键 / 手机长按 → 弹出菜单 → 保存原图 =====
(function(){
  const menu = document.createElement('div');
  menu.id = 'imgSaveMenu';
  menu.innerHTML = '<div class="ism-item" id="ismSave">💾 保存图片</div>';
  menu.style.display = 'none';
  document.body.appendChild(menu);
  let currentUrl = '', pressTimer = null, pressPoint = null, suppressClick = false;

  function showMenu(x, y, url){
    currentUrl = url;
    menu.style.display = 'block';
    menu.style.left = Math.max(8, Math.min(x, innerWidth - menu.offsetWidth - 8)) + 'px';
    menu.style.top = Math.max(8, Math.min(y, innerHeight - menu.offsetHeight - 8)) + 'px';
  }
  function hideMenu(){ menu.style.display = 'none'; }

  function saveImage(url){
    const raw = (url.split('?')[0].match(/[^\/]+$/) || [null])[0];
    let name = '图片_' + Date.now() + '.png';
    try{ if(raw) name = decodeURIComponent(raw); }catch(_){ if(raw) name = raw; }
    if(url.startsWith('data:')){
      const a = document.createElement('a');
      a.href = url; a.download = name; a.click();
      toast('已开始下载：' + name);
      return;
    }
    // 原图字节直接下载（不经 canvas 重编码，保持原始清晰度）；跨域失败回退新标签页
    fetch(url).then(r => { if(!r.ok) throw new Error(r.status); return r.blob(); }).then(b => {
      const u = URL.createObjectURL(b);
      const a = document.createElement('a');
      a.href = u; a.download = name; a.click();
      setTimeout(() => URL.revokeObjectURL(u), 3000);
      toast('已开始下载：' + name);
    }).catch(() => {
      window.open(url, '_blank');
      toast('该图无法直接下载，已在新标签页打开，可右键/长按保存');
    });
  }
  window.__saveImage = saveImage;   // 测试钩子

  // 电脑端右键（安卓长按也会触发 contextmenu，一并处理）
  document.addEventListener('contextmenu', e => {
    const img = e.target && e.target.closest ? e.target.closest('img') : null;
    if(!img) return;
    e.preventDefault();
    showMenu(e.clientX, e.clientY, img.currentSrc || img.src);
  }, true);

  // 手机长按：500ms 无移动弹出菜单（iOS 不触发 contextmenu，用计时器兜底）
  document.addEventListener('touchstart', e => {
    suppressClick = false;   // 新的按压 = 新意图，重置吞 click 标志
    const t = e.touches[0];
    const img = e.target && e.target.closest ? e.target.closest('img') : null;
    if(!img || !t) return;
    pressPoint = {x: t.clientX, y: t.clientY};
    const url = img.currentSrc || img.src;
    pressTimer = setTimeout(() => {
      pressTimer = null;
      showMenu(pressPoint.x, pressPoint.y, url);
      suppressClick = true;   // 吞掉长按结束后的 click，避免误开卡片/误选图
      if(navigator.vibrate) navigator.vibrate(30);
    }, 500);
  }, {passive: true});
  document.addEventListener('touchmove', e => {
    if(!pressTimer || !pressPoint) return;
    const t = e.touches[0];
    if(t && (Math.abs(t.clientX - pressPoint.x) > 10 || Math.abs(t.clientY - pressPoint.y) > 10)){
      clearTimeout(pressTimer); pressTimer = null;
    }
  }, {passive: true});
  document.addEventListener('touchend', e => {
    if(pressTimer){ clearTimeout(pressTimer); pressTimer = null; }
    // 长按刚弹出菜单时，阻止抬起手指合成的幽灵 click（防止误点菜单项）
    if(suppressClick){ e.preventDefault(); suppressClick = false; }
  }, {passive: false});
  // 长按后的那次 click 在捕获阶段吞掉（菜单自身的点击永不吞）
  document.addEventListener('click', e => {
    const onMenu = e.target && e.target.closest && e.target.closest('#imgSaveMenu');
    if(suppressClick && !onMenu){ e.stopPropagation(); e.preventDefault(); suppressClick = false; }
  }, true);
  // 点菜单外关闭；点菜单项保存
  document.addEventListener('pointerdown', e => {
    if(menu.style.display === 'block' && !menu.contains(e.target)) hideMenu();
  });
  menu.addEventListener('click', e => {
    if(e.target.id === 'ismSave' && currentUrl) saveImage(currentUrl);
    hideMenu();
  });
})();

render();
musicInit();
</script>
</body>
</html>
