<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>美少女图鉴</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0d1117;--bg2:#161b22;--border:#30363d;--text:#e6edf3;--text2:#8b949e;
  --accent:#58a6ff;--accent2:#1f6feb;--accent3:#a371f7;--danger:#f85149;--star:#e3b341;
  --grad:linear-gradient(135deg,#58a6ff,#a371f7);
  --grad-btn:linear-gradient(135deg,#1f6feb,#8957e5);
  --accent-soft:rgba(88,166,255,.15);
  --header-bg:rgba(22,27,34,.82);
  --shadow-sm:0 2px 8px rgba(0,0,0,.25);
  --shadow-lg:0 16px 48px rgba(0,0,0,.45);
  --overlay:rgba(1,4,9,.72);
}
body.light{
  --bg:#f6f8fa;--bg2:#ffffff;--border:#d0d7de;--text:#1f2328;--text2:#59636e;
  --accent:#0969da;--accent2:#0969da;--accent3:#8250df;--danger:#cf222e;--star:#9a6700;
  --grad:linear-gradient(135deg,#0969da,#8250df);
  --grad-btn:linear-gradient(135deg,#0969da,#8250df);
  --accent-soft:rgba(9,105,218,.10);
  --header-bg:rgba(255,255,255,.85);
  --shadow-sm:0 2px 8px rgba(31,35,40,.08);
  --shadow-lg:0 16px 48px rgba(31,35,40,.18);
  --overlay:rgba(31,35,40,.45);
}
html{scrollbar-width:thin;scrollbar-color:var(--border) transparent}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:8px;border:2px solid var(--bg)}
::-webkit-scrollbar-thumb:hover{background:var(--accent2)}
::selection{background:rgba(88,166,255,.35)}
body{background:radial-gradient(1100px 480px at 50% -80px,var(--accent-soft),transparent 70%),var(--bg);color:var(--text);font-family:'Microsoft YaHei UI','PingFang SC','Microsoft YaHei',system-ui,'Segoe UI',sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased;text-rendering:optimizeLegibility}
button,input,select,textarea{font-family:inherit}
.btn:focus-visible,.tag:focus-visible,.race-tab:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.header{background:var(--header-bg);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:14px 24px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--border);position:sticky;top:0;z-index:100;flex-wrap:wrap;gap:8px}
.header h1{font-size:20px;font-weight:700;letter-spacing:.5px;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;display:flex;align-items:center;gap:8px;width:fit-content}
.header h1 span{color:var(--text2)!important;-webkit-text-fill-color:var(--text2);background:none}
.header-btns{display:flex;gap:6px;flex-wrap:wrap}
.btn{background:transparent;border:1px solid var(--border);color:var(--text);padding:6px 12px;border-radius:8px;cursor:pointer;font-size:13px;white-space:nowrap;transition:background .15s,border-color .15s,transform .15s,box-shadow .15s}
.btn:hover{background:var(--accent-soft);border-color:var(--accent)}
.btn:active{transform:scale(.97)}
.btn-primary{background:var(--grad-btn);border-color:transparent;color:#fff;box-shadow:var(--shadow-sm)}
.btn-primary:hover{background:var(--grad-btn);filter:brightness(1.12);transform:translateY(-1px);box-shadow:0 4px 14px rgba(31,111,235,.35)}
.btn-sm{padding:4px 8px;font-size:12px}
.dash{padding:12px 24px;display:flex;gap:16px;flex-wrap:wrap;align-items:center;background:transparent;font-size:13px;color:var(--text2)}
.dash b{color:var(--accent)}
.race-bar{padding:14px 24px 4px;display:flex;gap:8px;flex-wrap:wrap;background:transparent}
.toolbar{padding:10px 24px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:transparent}
.toolbar input,.toolbar select{background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:7px 12px;border-radius:8px;font-size:13px;transition:border-color .15s,box-shadow .15s}
.toolbar input{flex:1;min-width:180px}
.toolbar input:focus,.toolbar select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.toolbar input::placeholder{color:var(--text2)}
/* 手机端：向下滚动隐藏顶部工具栏，向上滚动显示（规则仅写在窄屏媒体查询里，桌面端不受影响） */
@media (max-width:768px){
  .header{transition:transform .3s ease}
  .header.header-hidden{transform:translateY(-110%)}
}
.stats{color:var(--text2);font-size:12px;margin-left:auto}
.tag-bar{padding:4px 24px 12px;display:flex;gap:6px;flex-wrap:wrap;background:transparent}
.race-tab{padding:6px 16px;border-radius:999px;border:1px solid var(--border);background:var(--bg2);color:var(--text2);cursor:pointer;font-size:14px;font-weight:bold;transition:all .15s}
.race-tab:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.race-tab.active{background:var(--grad-btn);color:#fff;border-color:transparent;box-shadow:0 2px 10px rgba(31,111,235,.35)}
.race-tab .count{font-size:11px;opacity:.75;margin-left:4px;font-weight:normal}
.tag{background:var(--bg2);border:1px solid var(--border);color:var(--text2);padding:3px 11px;border-radius:999px;font-size:12px;cursor:pointer;transition:all .15s}
.tag:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.tag.active{background:var(--grad-btn);color:#fff;border-color:transparent;box-shadow:0 2px 8px rgba(31,111,235,.3)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:18px;padding:24px}
.card{background:var(--bg2);border:1px solid var(--border);border-radius:14px;overflow:hidden;cursor:pointer;transition:transform .25s ease,border-color .2s,box-shadow .25s;position:relative}
.card:hover{transform:translateY(-5px);border-color:var(--accent);box-shadow:0 12px 32px rgba(0,0,0,.4)}
body.light .card:hover{box-shadow:0 12px 28px rgba(31,35,40,.16)}
.card-img-wrap{position:relative;width:100%;height:240px;background:var(--bg);overflow:hidden}
.card-img{width:100%;height:100%;object-fit:cover;object-position:top center;transition:transform .4s ease}
.card:hover .card-img{transform:scale(1.06)}
.card-pcount{position:absolute;top:8px;right:8px;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);color:#fff;padding:2px 9px;border-radius:999px;font-size:11px;font-weight:600}
.card-star{position:absolute;top:8px;left:8px;background:rgba(0,0,0,.55);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);border:none;color:rgba(255,255,255,.75);font-size:18px;cursor:pointer;padding:2px 7px;border-radius:999px;z-index:2;transition:transform .15s,color .15s}
.card-star:hover{transform:scale(1.2);color:#fff}
.card-star.on{color:var(--star)}
.card-info{padding:11px 13px 12px}
.card-name{font-size:17px;font-weight:600;color:var(--text);margin-bottom:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-source{font-size:14px;color:var(--text2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card-type{display:inline-block;background:var(--accent-soft);color:var(--accent);padding:2px 9px;border-radius:999px;font-size:13px;margin-top:8px;font-weight:600}
.card-tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:6px}
.card-tag{background:var(--bg);border:1px solid var(--border);color:var(--text2);padding:1px 7px;border-radius:999px;font-size:10px}
.card.missing{border-color:var(--danger)}
.card.missing::after{content:'缺图/缺设定';position:absolute;top:32px;left:8px;background:var(--danger);color:#fff;padding:2px 8px;border-radius:999px;font-size:10px;z-index:3}
/* 轮播模式 */
.carousel{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);z-index:500;display:none;justify-content:center;align-items:center;flex-direction:column}
.carousel img{max-width:90%;max-height:80vh;object-fit:contain;border-radius:8px}
.carousel-info{color:#fff;margin-top:16px;font-size:18px;text-align:center}
.carousel-sub{color:#aaa;font-size:13px;margin-top:4px}
.carousel-controls{position:absolute;bottom:20px;left:50%;transform:translateX(-50%);display:flex;gap:12px}
.carousel-btn{background:rgba(255,255,255,.15);border:none;color:#fff;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:14px;transition:background .15s}
.carousel-btn:hover{background:rgba(255,255,255,.3)}
.carousel-exit{position:absolute;top:20px;right:30px;color:#fff;font-size:36px;cursor:pointer;transition:transform .15s}
.carousel-exit:hover{transform:scale(1.15)}
.carousel-dots{position:absolute;bottom:70px;left:50%;transform:translateX(-50%);display:flex;gap:6px}
.carousel-dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.3);cursor:pointer;transition:all .2s}
.carousel-dot.active{background:#fff;transform:scale(1.25)}
/* 拼图模式：顶栏固定 + 内容区滚动（蔚蓝档案式布局） */
.collage-modal{background:var(--bg2);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);width:95%;max-width:900px;max-height:90vh;display:flex;flex-direction:column;overflow:hidden;position:relative}
.collage-topbar{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 14px;border-bottom:1px solid var(--border);flex-shrink:0;background:var(--bg2)}
.collage-topbar .btn{padding:8px 16px;font-size:14px;font-weight:600}
.collage-topbar-actions{display:flex;gap:8px}
.collage-body{flex:1;min-height:0;overflow-y:auto;padding:20px 24px 24px}
@media (max-width:768px){
  .collage-modal{width:96%;max-height:92vh}
  .collage-topbar{padding:8px 10px;gap:6px}
  .collage-topbar .btn{flex:1;padding:10px 6px;font-size:13px}
  .collage-body{padding:14px 12px 20px}
}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none;box-shadow:none}
.collage-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:8px;margin:16px 0}
.collage-item{position:relative;cursor:pointer;border-radius:8px;overflow:hidden;aspect-ratio:1}
.collage-item img{width:100%;height:100%;object-fit:cover;object-position:top center}
.collage-item.selected{outline:3px solid var(--accent)}
.collage-item.selected::after{content:attr(data-num);position:absolute;top:4px;left:4px;background:var(--accent2);color:#fff;width:24px;height:24px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:bold}
.collage-canvas-wrap{text-align:center;margin:16px 0}
.collage-canvas-wrap canvas{max-width:100%;border-radius:8px;touch-action:none;cursor:grab}
.collage-adjust-bar{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:10px;flex-wrap:wrap}
.collage-hint{color:var(--text2);font-size:12px}
/* 图片保存菜单（电脑右键 / 手机长按） */
#imgSaveMenu{position:fixed;z-index:650;background:var(--bg2);border:1px solid var(--border);border-radius:10px;box-shadow:var(--shadow-lg);padding:6px;min-width:160px;display:none}
#imgSaveMenu .ism-item{padding:10px 14px;border-radius:8px;color:var(--text);font-size:14px;cursor:pointer;white-space:nowrap;transition:background .15s}
#imgSaveMenu .ism-item:active,#imgSaveMenu .ism-item:hover{background:var(--accent-soft)}
img{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
/* 紧凑列表 */
.grid.list-view{grid-template-columns:1fr;gap:8px}
.grid.list-view .card{display:flex;height:auto}
.grid.list-view .card:hover{transform:translateY(-2px)}
.grid.list-view .card-img-wrap{width:80px;height:80px;flex-shrink:0}
.grid.list-view .card-info{flex:1;display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.grid.list-view .card-info .card-tags{margin-top:0}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:var(--overlay);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none;justify-content:center;align-items:center;z-index:200}
.modal{background:var(--bg2);border:1px solid var(--border);border-radius:16px;box-shadow:var(--shadow-lg);width:90%;max-width:720px;max-height:90vh;overflow-y:auto;padding:24px;position:relative;animation:modal-in .2s ease}
@keyframes modal-in{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.modal-close{position:absolute;top:12px;right:12px;background:var(--accent-soft);border:none;color:var(--text2);font-size:22px;width:34px;height:34px;border-radius:50%;cursor:pointer;z-index:10;transition:all .15s;display:flex;align-items:center;justify-content:center}
.modal-close:hover{color:var(--danger);background:rgba(248,81,73,.15);transform:rotate(90deg)}
.modal-img{width:100%;max-height:420px;object-fit:contain;border-radius:10px;margin-bottom:12px;cursor:zoom-in;background:var(--bg)}
.modal-nav{display:flex;justify-content:center;gap:10px;align-items:center;margin-bottom:16px}
.history{margin-top:20px;padding-top:16px;border-top:1px solid var(--border)}
.history h4{margin:0 0 10px;font-size:14px;color:var(--text2)}
.history-list{display:flex;gap:10px;flex-wrap:wrap}
.history-item{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;width:70px}
.history-item img{width:70px;height:90px;object-fit:cover;object-position:top center;border-radius:6px;background:var(--bg)}
.history-item span{font-size:11px;color:var(--text2);text-align:center;line-height:1.2}
.modal-name{font-size:22px;font-weight:700;color:var(--text);margin-bottom:6px;display:flex;align-items:center;gap:8px}
.modal-meta{color:var(--text2);font-size:13px;margin-bottom:12px}
.modal-desc{line-height:1.8;font-size:14px;color:var(--text)}
.modal-actions{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
.form-group{margin-bottom:12px}
.form-group label{display:block;font-size:13px;color:var(--text2);margin-bottom:4px}
.form-group input,.form-group textarea,.form-group select{width:100%;background:var(--bg);border:1px solid var(--border);color:var(--text);padding:8px 10px;border-radius:8px;font-size:14px;transition:border-color .15s,box-shadow .15s}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.form-group textarea{min-height:100px;resize:vertical}
.empty{text-align:center;padding:60px;color:var(--text2)}
.fs-view{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.95);display:none;justify-content:center;align-items:center;z-index:300;cursor:zoom-out}
.fs-view img{max-width:95%;max-height:95%;object-fit:contain}
.fs-close{position:absolute;top:20px;right:30px;color:#fff;font-size:40px;cursor:pointer;transition:transform .15s}
.fs-close:hover{transform:scale(1.15)}
.fs-nav{position:absolute;top:50%;transform:translateY(-50%);color:#fff;font-size:48px;cursor:pointer;padding:20px;user-select:none;transition:opacity .15s;opacity:.7}
.fs-nav:hover{opacity:1}
.fs-prev{left:10px}.fs-next{right:10px}
.toast{position:fixed;bottom:28px;left:50%;transform:translateX(-50%);background:var(--bg2);border:1px solid var(--border);box-shadow:var(--shadow-lg);color:var(--text);padding:10px 22px;border-radius:999px;font-size:14px;z-index:600;display:none;animation:toast-in .25s ease}
@keyframes toast-in{from{opacity:0;transform:translateX(-50%) translateY(10px)}to{opacity:1;transform:translateX(-50%)}}
.drop-zone{border:2px dashed var(--border);border-radius:10px;padding:20px;text-align:center;color:var(--text2);margin-top:8px;cursor:pointer;transition:border-color .15s,color .15s,background .15s}
.drop-zone.dragover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
/* ===== 二轮优化新增 ===== */
kbd{background:var(--bg2);border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:1px 6px;font-size:11px;font-family:inherit;color:var(--text)}
.img-fallback{width:100%;height:100%;display:flex;align-items:center;justify-content:center;color:var(--text2);background:repeating-linear-gradient(45deg,var(--bg),var(--bg) 8px,var(--bg2) 8px,var(--bg2) 16px);font-size:12px}
.modal-img{animation:fade-in .25s ease}
@keyframes fade-in{from{opacity:0}to{opacity:1}}
.tag-filter{background:var(--bg2);border:1px solid var(--border);color:var(--text);padding:3px 11px;border-radius:999px;font-size:12px;width:132px;transition:border-color .15s}
.tag-filter:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.carousel-counter{color:#ddd;font-size:13px;display:block;text-align:center;margin-bottom:6px;font-variant-numeric:tabular-nums}
.carousel-progress{width:220px;height:4px;background:rgba(255,255,255,.18);border-radius:999px;overflow:hidden;margin:0 auto}
.carousel-progress-bar{height:100%;background:var(--grad);border-radius:999px;transition:width .3s ease}
.collage-item.collage-fail::before{content:'加载失败';position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(248,81,73,.32);color:#fff;font-size:12px;z-index:2}
/* 分页加载哨兵（占满整行，高度1px不可见） */
#gridSentinel{grid-column:1/-1;height:1px}
/* 拼图：角色封面右上角的图片数徽标（蔚蓝档案式） */
.collage-item .collage-badge{position:absolute;top:6px;right:6px;background:rgba(0,0,0,.62);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);color:#fff;padding:1px 8px;border-radius:999px;font-size:11px;font-weight:600;z-index:2}
.collage-pickname{color:var(--accent);font-size:15px;font-weight:bold}
/* 背景音乐播放器 */
.music-fab{position:fixed;right:18px;bottom:18px;width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:var(--bg2);color:var(--text);font-size:15px;cursor:pointer;z-index:400;box-shadow:var(--shadow-sm);transition:box-shadow .2s;animation:music-float 3.2s ease-in-out infinite;display:flex;align-items:center;justify-content:center}
.music-fab:hover{box-shadow:var(--shadow-lg)}
@keyframes music-float{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.music-panel{position:fixed;right:18px;bottom:64px;width:240px;background:var(--bg2);border:1px solid var(--border);border-radius:14px;box-shadow:var(--shadow-lg);padding:14px;display:none;z-index:400;animation:modal-in .2s ease}
.music-head{display:flex;justify-content:space-between;align-items:center;font-size:13px;font-weight:600;margin-bottom:8px}
.music-count{color:var(--text2);font-size:11px;font-weight:normal}
.music-track{font-size:13px;color:var(--accent);margin-bottom:10px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.music-controls{display:flex;gap:8px;justify-content:center;margin-bottom:10px}
.music-controls button{width:40px;height:34px;border-radius:8px;border:1px solid var(--border);background:var(--bg);color:var(--text);cursor:pointer;font-size:14px;transition:all .15s}
.music-controls button:hover{border-color:var(--accent);color:var(--accent)}
.music-vol{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text2)}
.music-vol input{flex:1;accent-color:var(--accent)}
</style>
</head>
<body>

<div class="header">
  <h1>✨ 美少女图鉴 <span style="font-size:12px;color:var(--text2)" id="countBadge"></span></h1>
  <div class="header-btns">
    <button class="btn btn-primary" onclick="openAdd()">+ 添加</button>
    <button class="btn" onclick="randomChar()">🎲 随机</button>
    <button class="btn" onclick="startCarousel()">🎞️ 轮播</button>
    <button class="btn" id="starFilterBtn" onclick="toggleStarFilter()">⭐ 收藏</button>
    <button class="btn" onclick="openCollage()">💖 选最爱</button>
    <button class="btn" id="viewToggleBtn" onclick="toggleView()">📋 紧凑</button>
    <button class="btn" onclick="exportFiltered()">📥 导出筛选</button>
    <button class="btn" onclick="exportJSON()">导出JSON</button>
    <button class="btn" onclick="document.getElementById('importFile').click()">导入JSON</button>
    <button class="btn" id="cleanOrphansBtn" onclick="cleanOrphans()" title="删除磁盘上未被任何角色引用的图片（仅服务器模式）">🧹 清理孤儿图</button>
    <button class="btn" onclick="toggleTheme()">🌓 主题</button>
    <input type="file" id="importFile" accept=".json" style="display:none" onchange="importJSON(event)">
  </div>
</div>

<div class="dash" id="dash"></div>

<div class="race-bar" id="raceBar"></div>

<div class="tag-bar" id="subTypeBar" style="display:none;padding-top:0"></div>

<div class="toolbar">
  <input type="text" id="searchBox" placeholder="搜索：角色名 / 出处 / 标签 / CV / 设定 / 剧情..." oninput="render()" onkeyup="if(event.key==='/')event.preventDefault()">
  <select id="filterSource" onchange="render()"><option value="">全部出处</option></select>
  <select id="filterType" onchange="render()"><option value="">全部类型</option></select>
  <select id="sortBy" onchange="render()">
    <option value="id">按序号</option>
    <option value="name">按名字</option>
