const DEFAULT_DATA = [
{id:1,name:"02（零二）",source:"DARLING in the FRANXX",type:"龙娘",desc:"维尔纳·弗兰克博士根据叫龙公主(001)毛发制造的克隆叫龙人，代号002，APE直属9's精英驾驶员，长红色角，继承叫龙之血，被称为「ι」",story:"DARLING in the FRANXX的女主角。幼年逃出实验室时在森林里与广相遇，他读的绘本《魔物与王子》成了两人约定的原点。多年后她以APE最精英驾驶员的身份归来，与广重逢后尘封的情感与记忆苏醒。背负叫龙血统与「伙伴牺牲也会被原谅」的诅咒，最终决战中她与广驾驶鹤望兰号冲向叫龙化的地球核心，双双化作流星。转世后的两个孩子在樱花树下重逢，跨越生死与星海兑现了童年之约。",images:["龙族/02_1.jpg","龙族/02_3.jpg","龙族/images.jpg","龙族/images_1.jpg","龙族/1_2.jpg"],tags:["红角","混血"]},
{id:2,name:"缇奥·库拉鲁斯",source:"平凡职业造就世界最强",type:"龙娘",cv:"日笠阳子",desc:"龙人族最强黑龙，库拉鲁斯族后裔，563岁，天职守护者，龙化状态力量8800/体力12500。",story:"平凡职业造就世界最强的龙人族至强，563岁的黑龙后裔。为追查神之文明真相闯入大迷宫，被神代魔女施咒囚禁五百年，堕落成精神崩坏的古巨龙，直到南云始闯入才解脱。被始击败后以主仆之约追随，平时是高傲的御姐，一旦被摸尾巴立刻瘫软示弱，反差萌名场面。此后以龙人族最强战力与始共同对抗神之文明弗雷斯赫尔，守护是她的天职，也是她选择的新归宿。",images:["龙族/缇奥_1.jpg"],tags:["御姐","黑龙"]},
{id:3,name:"塔尼娅",source:"驯兽师与最强种猫耳少女",type:"龙娘",cv:"大久保瑠美",desc:"最强种龙族少女，号称天空支配之红，魔力量仅次于精灵族，红发红眼15岁，高傲好战，使用魔力强化火球和龙息。",story:"出自《被勇者队伍开除的驯兽使，邂逅了最强种猫耳少女》。按龙族规矩，15岁就要独自出门旅行磨炼。自称「天空支配之红」的她实力高傲自负，却在旅行初年就因轻敌败给兽人，落难之际被被开除的驯兽使雷因救下，从此赖上恩人加入队伍。最强种龙族，魔力量仅次于精灵族，魔力强化火球与龙息齐飞，龙化后更是天空的红色支配者。与猫耳少女加纳德、精灵索拉组成最强种蹭饭团，把雷因的冒险变成热闹的家庭剧。",images:["龙族/塔尼娅_1.jpg","龙族/塔尼娅_2.jpg","龙族/3_1.jpg","龙族/3_2.jpg"],tags:["傲娇","红发"]},
{id:233,name:"璐米欧儿",source:"影之诗",type:"龙娘",cv:"木村珠莉",desc:"金龙，四兄妹中的长女，金发金眼红角，身着黑金礼服，龙翼为金色。称号「金色威信」，弃牌龙卡组核心主战者。",story:"影之诗（Shadowverse）中的龙族主战者，四兄妹中的大姐。性格高傲自信，自称「最强无敌的姐姐大人」，与妹妹雅尔贞特（银龙）组成「金银绚烂」双人卡。金色龙鳞与红角是她的标志，能力是通过舍弃手牌造成伤害并回复PP，是弃牌龙卡组的核心角色。",images:["龙族/璐米欧儿_1.jpg","龙族/璐米欧儿_2.jpg","龙族/璐米欧儿_3.jpg"],tags:["金龙","御姐","四兄妹长女"]},
{id:234,name:"雅尔贞特",source:"影之诗",type:"龙娘",cv:"高桥李依",desc:"银龙，四兄妹中的次女，银发紫眼红角，身着黑白铠甲风礼服，龙翼为紫银色。与姐姐璐米欧儿组成「金银绚烂」双人卡。",story:"影之诗（Shadowverse）中的龙族主战者，璐米欧儿的妹妹。银发紫眼，性格认真严谨，与姐姐的高傲形成对比。是「金银绚烂·璐米欧儿&雅尔贞特」双人卡的银龙部分，四兄妹中的次女。",images:["龙族/雅尔贞特_1.jpg"],tags:["银龙","Q版","四兄妹次女"]},
{id:235,name:"リィベル",source:"闪耀星骑士",type:"龙娘",desc:"深渊书库的管理者，白发蓝眼，黑蕾丝长裙配蓝玫瑰发饰，龙角为黑色。称号「深渊书库的管理者」。",story:"闪耀星骑士（Starlight Knights）中的龙族角色，负责管理深渊书库。白发蓝眼，身着黑蕾丝长裙，头戴蓝玫瑰发饰，黑色龙角是她的标志。性格文静爱读书，是书库的守护者。",images:["龙族/リィベル_1.jpg","龙族/リィベル_2.jpg","龙族/リィベル_3.jpg"],tags:["书库","白发","黑蕾丝"]},
{id:4,name:"艾可",source:"星刻的龙骑士",type:"龙娘",cv:"伊濑茉莉也",desc:"艾瓦隆圣龙皇家末裔女皇，亚修的帕尔，龙族延续种族的希望，以人类外貌出生，头两侧幼龙软角，傲娇蛮横泼辣。",story:"星刻的龙骑士女主角。龙种皇女却在成人式上与人类骑士候补亚修缔结主从契约，震惊整个安萨兰王国。体内寄宿着艾瓦隆龙种的全部记忆——五年后的自己「娜比」。傲娇蛮横嘴上不饶人，关键时刻却总是第一个为亚修张开龙翼。卷入王国与教国的龙种阴谋后历经数次死战，多次以圣龙之力救亚修于绝境，最终在亚修的呼唤下拒绝了「与娜比融合而消失」的既定命运，选择以艾可的身份活下去。",images:["龙族/艾可_1.jpg","龙族/4_1.jpeg","龙族/4_1.jpg","龙族/4_2.jpg","龙族/4_3.jpg"],tags:["傲娇","幼龙"]},
{id:5,name:"娜比",source:"星刻的龙骑士",type:"龙娘",cv:"榊原由依",desc:"艾可体内的艾瓦隆龙种记忆化身，样貌为五年后的艾可（巨乳御姐），角尖锐成年状态，平时待在遗龙工房空间，指引未成熟的艾可，原计划融合后消失，被亚修打动抗拒融合。",story:"星刻的龙骑士。艾可体内艾瓦隆龙种记忆的具现，以五年后艾可的模样现身——成熟的身姿与从容是她对「未来的自己」的想象。居于遗龙工房空间，以解说口吻指引艾可成长，原计划在艾可成熟后通过融合取而代之。与亚修的相处让她动了凡心：不愿消失，想以自己的身份被爱。最终放弃融合计划，作为艾可的另一半灵魂共存。名场面是每次登场必以成熟魅力逗弄艾可、调教亚修。",images:["龙族/娜比_1.jpg"],tags:["御姐","一体双魂"]},
{id:6,name:"托尔",source:"小林家的龙女仆",type:"龙娘",cv:"桑原由气",desc:"混沌势力龙族，与人类战斗数万年，被神之剑击落到人类世界，被小林拔掉剑后成为女仆，魔法可感知屏蔽/修复/龙人形态转换。",story:"小林家的龙女仆。混沌势力最强种，与神明和人类厮杀了数万年，某夜被神之剑贯穿坠落到现代日本。拔出她胸口之剑的，是加班到烂醉的上班族小林——一句随口的收留被托尔认定是命运的邂逅，次日便以女仆装上门报到。此后数万年的战斗经验全部改用于打扫做饭与守护小林，与法夫纳、露科亚等龙族周旋于人间，向全世界宣告「小林是我的」。数万年杀伐化作的守护欲，最后都装进了便当、围裙和那句「欢迎回来」里。",images:["龙族/托尔_1.jpg"],tags:["女仆"]},
{id:7,name:"康娜卡姆依",source:"小林家的龙女仆",type:"龙娘",cv:"长绳麻理亚",desc:"精灵龙，14000+岁外表9岁小学生，紫渐变发水蓝眼，身高120cm，电气攻击，尾巴插插座充电（5V/2.5A），龙形态为10米白龙带羽毛。",story:"小林家的龙女仆。为追回离家出走的托尔而从异世界追到人间，结果被小学生生活迷住留了下来。精灵龙族一万四千岁，外表是小学二年级生。名场面：尾巴插插座充电（5V/2.5A）、对喜欢的东西先咬一口再说、电气攻击与瞬间龙化。与才川同学结成「秘密的朋友」，为了这份友情差点暴露龙的身份——康娜酱的日常，是龙族里最治愈的一段。一万四千岁的精灵龙正在人间上学——作业会写，插座会咬，朋友超珍贵。",images:["龙族/康娜_1.jpg","龙族/康娜_2.jpg"],tags:["萝莉"]},
{id:8,name:"露科亚",source:"小林家的龙女仆",type:"真龙",cv:"高桥未奈美",desc:"远古龙族，中南美阿兹特克神话的创世神之一，本名魁札尔科亚特尔（羽蛇神），本体巨大如山，异瞳右眼绿左眼蓝黄，身高185cm，三围120/70/85，被放逐的前龙女神。",story:"小林家的龙女仆。本名魁札尔科亚特尔——阿兹特克神话的羽蛇神，因罪责被放逐人间，成了小林家的食客。巨大如山的本体收进185cm的巨乳御姐皮囊，日常是喝酒看剧赖沙发。曾经统御龙族的威严如今化作对小林一家的守护欲：数次出手镇压来犯的龙与神，向世界证明女神也要恰饭。与托尔斗嘴数万年，是小林家事实上的大姨妈。从创世神到家庭龙，她用行动证明：被放逐的神，也能把日子过成节日。",images:["龙族/露科亚_1.jpg","龙族/露科亚_2.jpg","龙族/8_2.jpg"],tags:["御姐","巨乳","神"]},
{id:9,name:"萝丝",source:"龙之界点",type:"龙娘",cv:"钉宫理惠",desc:"传说中的红龙公主，外表14岁实际10岁，玫瑰金发蓝眼，龙纹红色，可展开红色翅膀短时间飞行与操纵火焰，对如月龙司一见钟情。",story:"龙之界点的红龙公主，传说中的纯血龙族。玫瑰金发蓝眼，龙纹绽红，外表14岁实际10岁。对人类少年如月龙司一见钟情后强行动用龙族契约赖进如月家，动不动以龙纹、火焰与短暂展开的红翼宣示主权，醋坛子打翻就是一场红龙暴走——是如月家最吵闹、也最耀眼的守护神。从「不许碰我」到寸步不离，这位红龙公主的心事全写在了醋意里。",images:["龙族/萝丝_1.jpg"],tags:["钉宫"]},
{id:10,name:"玛露卡",source:"龙之界点",type:"龙娘",cv:"堀江由衣",desc:"白龙皇女，主管冰与雪，起初对人类抱偏见，委托龙司夺回Ice Rage，被乔治喜欢，渐渐对龙司产生好感被萝丝视为竞争对手。",story:"龙之界点的白龙皇女，主管冰与雪。起初对人类满是不信任，委托龙司夺回族人圣物「Ice Rage」的旅途中，被室友乔治的死缠烂打逐步软化，也对龙司生出说不清道不明的好感，被萝丝当成了头号竞争对手。冰之权能与口是心非的傲娇齐飞——嘴上说着「人类真麻烦」，身体却诚实地站在了如月家这一边。冰雪淬出的皇女，其实比谁都怕冷场——这只是秘密，谁都不能告诉乔治。",images:["龙族/玛露卡_1.jpg","龙族/玛露卡_2.jpg"],tags:["傲娇","皇女"]},
{id:11,name:"奥菲斯",source:"高校DxD",type:"真龙",cv:"三森铃子",desc:"无限龙神，两大龙神之一，世界前十强者，诞生于次元夹缝的无，被真·赤龙神帝赶出家乡，个性天真无邪不谙世事，以哥特萝莉黑衣美少女形象出现。",story:"高校DxD的无限龙神，两大龙神之一，世界前十强者。诞生于次元夹缝的「无」，因过度强大被真·赤龙神帝驱逐出家乡。流落人间后被兵藤一诚捡回家，从此对这个「有意思的人类」寸步不离。以哥特萝莉黑衣美少女形象行走人间，天真无邪不谙世事，把一诚的耍宝当真理。关键时刻以无限之力多次扭转冥界大战的战局，是全作最强级别的天然呆。对这位龙神而言，世界很大，但「一诚在的地方」才是世界的中心。",images:["龙族/images_8.jpg","龙族/images_2.jpg","龙族/images_3.jpg","龙族/images_4.jpg","龙族/images_6.jpg","龙族/images_9.jpg"],tags:["萝莉","神"]},
{id:12,name:"古蕾雅",source:"玛娜莉亚朋友/巴哈姆特之怒",type:"龙娘",cv:"福原绫香",desc:"龙族与人族混血的龙族公主，马纳历亚学院就读，与安关系亲密，操纵火焰范围魔法攻击，活用飞行能力的突进攻击。",story:"玛娜莉亚朋友/巴哈姆特之怒。龙族与人族混血的龙族公主，玛娜莉亚魔法学院的自由门生。与人类好友安形影不离，两人组队在学院里制造过无数骚动，也一起熬过魔法祭的特训。操纵大范围烈焰魔法，更擅长活用飞行能力的突进战术——在学院的天空里，龙族公主也可以是同学中最可靠的那一个。公主的头衔、龙的血统、朋友的羁绊——古蕾雅把三样都炼成了自己的火焰。",images:["龙族/古蕾雅_1.jpg","龙族/古蕾雅_2.jpg","龙族/古蕾雅_3.jpg","龙族/12_1.jpg","龙族/12_4.jpg"],tags:["公主"]},
{id:13,name:"芙蕾多妮卡",source:"棺姬嘉依卡",type:"龙娘",cv:"斋藤千和",desc:"弃兽装铠龙（东之六四五），金发赤眼，可自由变换形体（连伤口也能化为乌有），原与八英雄之一多明妮卡订契约，多明妮卡死后为完成她再战斗的遗愿而行动。",story:"棺姬嘉依卡。弃兽「装铠龙」，东之六四五。金发赤眼，能自由变换形体，连伤口也能化于无形。百年前与八英雄之一的多明妮卡·斯卡罗迪缔结契约，在她死后继承「继续战斗下去」的遗愿，至今仍在履行。与托鲁、嘉依卡一行相遇后时而敌对时而同行，以近乎戏谑的姿态注视这群追寻亡者碎片的人，是全作最接近「龙之真实」的存在。百年之约未冷，铠龙仍在战场——这就是她存在的全部意义。",images:["龙族/芙蕾多妮卡_1.jpg","龙族/13_2.jpg","龙族/13_1.jpg"],tags:["铠龙"]},
{id:14,name:"拉丝蒂丝姆",source:"异世界悠闲农家",type:"龙娘",cv:"日冈夏美",desc:"狂龙，神代龙族德莱姆与白龙姬葛菈法伦之女，昵称拉丝蒂，龙形态全长15米，人形态像初中生，金色长发利落强悍，与村长火乐育有一子一女。",story:"异世界悠闲农家。神代龙族德莱姆与白龙姬葛菈法伦之女，别号「狂龙」。龙形态全长十五米，人形态却是慵懒的初中生模样，金色长发利落强悍。在异世界悠闲农家里与村长火乐成家育有一子一女，把「能吃是福」贯彻进龙生哲学——饿急了凶暴化，吃饱了瘫成画，是村里最省心也最费粮的居民。龙形的她镇守村界，人形的她镇守饭桌，两头都很称职。",images:["龙族/拉丝蒂丝姆_2.jpg"],tags:["狂龙","妈妈"]},
{id:15,name:"白莲",source:"异世界悠闲农家",type:"龙娘",desc:"别名真龙，神代龙族（从世界创生就存在的半神，无寿命，能宇宙飞行），女，配偶火乐（村长），儿女火一郎/光/卑弥呼，大树村村民老师，教兽人族/蜥蜴人孩子读写算术",story:"异世界悠闲农家。神代龙族——自世界创生便存在、无寿命、能宇宙飞行的真龙，别名真龙，半神级别的存在。在大树村与村长火乐结为配偶，育有火一郎、光、卑弥呼等子女。如今的基本职业是村小学老师，教兽人族与蜥蜴人的孩子读写算术。曾经翻云覆雨的伟力，如今最常用的场合是上课铃与黑板擦之间——神明下凡，先从备课开始。对孩子们来说，会飞的老师，比任何神话都精彩。",images:["龙族/白莲_1.jpg"],tags:["神"]},
{id:16,name:"米莉姆·纳瓦",source:"转生史莱姆",type:"龙娘",desc:"龙魔人，最古老三位魔王之一，称号破坏的暴君，创世神星王龙维鲁多拿巴与勇者鲁德拉妹妹露西亚之女，2000+岁身高135cm粉发，拥有无限魔素，少数能操纵星粒子的存在",story:"转生史莱姆。创世神星王龙维鲁多拿巴与勇者鲁德拉妹妹露西亚之女，两千年以上的最古老魔王之一，称号「破坏的暴君」。被利姆鲁用美食与真心收服成头号挚友。因克雷曼操纵挚友之死而真正暴怒的那一战，是她两千年里少有的认真：一人踏平对方魔国，无限魔素与星粒子解放，天地变色。日常是抱着利姆鲁撒娇的135cm萝莉魔王。两千年孤独的魔王，在利姆鲁这里第一次有了「朋友」这个词。",images:["龙族/16_3.png","龙族/images_10.jpg","龙族/米莉姆_1.jpg"],tags:["萝莉","魔王"]},
{id:17,name:"西尔菲德",source:"零之使魔",type:"龙娘",cv:"井口裕香",desc:"塔巴莎的使魔（韵龙），全长6米，人形态名依露库库（蓝发美女，身材好个子高，称呼塔巴莎为姐姐）",story:"零之使魔。塔巴莎的使魔「韵龙」，全长六米的巨龙，人形态依露库库则是身材高挑的蓝发美女。她称呼年幼的主人「姐姐」，人龙双形切换自由。在塔巴莎被王族阴谋与母亲疯病的阴影裹挟时，西尔菲德是唯一无条件陪她飞进风暴的存在——无论龙形还是人形，都守在姐姐身边。六米长的龙躯之下，是一颗认定了「姐姐」就绝不更改的心。",images:["龙族/西尔菲德_2.jpg"],tags:["人形态"]},
{id:18,name:"缇亚·莱特宁",source:"无限法夫纳",type:"龙之巫女",desc:"布伦希尔德教室9号，粉发娇小少女，自称悠的新娘，头上两只红角（琦莉为黑客尤克特拉希尔装设），第6卷后成为绿之尤克特拉希尔新核心，夺走其权能，第9卷自愿被悠龙化龙纹变苍蓝色",story:"铳皇无尽的法夫纳。布伦希尔德教室9号，自称「悠的新娘」的粉发娇小少女。头顶两只红角其实是琦莉为击倒尤克特拉希尔而装设的装置。第6卷吸收绿之尤克特拉希尔成为新核心并夺走其权能，从「被制造的新娘」变成真正的力量持有者；第9卷自愿接受悠的龙化，龙纹变为苍蓝色——她用整个存在兑现了新娘宣言，是教室里最莽也最纯粹的爱。从装置到核心，从新娘到战士——缇亚把「我喜欢你」活成了动词。",images:["龙族/缇亚_1.jpg"],tags:["娇小"]},
{id:19,name:"莉莎·海渥卡",source:"无限法夫纳",type:"龙之巫女",cv:"金元寿子",desc:"布伦希尔德教室1号，16岁，5月15日生，金发碧眼英国籍少女，班级领导者把同学当家人，龙纹位置在臀部，击败白之龙利维坦后获万有斥力能力，击败黄之龙赫拉斯瓦尔格尔后获显灵粒子。",story:"铳皇无尽的法夫纳。布伦希尔德教室1号，16岁的英国籍金发碧眼少女，5月15日生。把全班同学当家人的领导者，龙纹位置在臀部，是本人最不想被提起的秘密。击败白之龙利维坦后获得「万有斥力」，击败黄之龙赫拉斯瓦尔格尔后再获「显灵粒子」——两场龙战下来，这位大小姐以自己的权能撑起整间教室的防线。臀部的龙纹是她的软肋，也是她两战封神的勋章。",images:["龙族/莉莎_1.jpg","龙族/19_1.png","龙族/19_2.png"],tags:["大小姐","领导者"]},
{id:21,name:"莉姆",source:"异世界迷宫黑心企业",type:"龙娘",cv:"久野美咲",desc:"代特莫尔德迷宫遇到的龙型魔物，暴食魔神称号，平时少女姿态，饭量大经常饿，不进食凶暴性增加，极度好吃懒做，男主二之宫锦司用美食收服。",story:"异世界迷宫黑心企业。迷宫深处的龙型魔物，称号「暴食魔神」。平时是粉发绿眼的少女姿态，一旦饿了就凶暴化，饭量足以吃空一整层迷宫。被调入迷宫的黑心企业员工二之宫锦司用美食一步步收服，成了公司的龙形招牌——在连呼吸都要扣钱的公司里，她的好吃懒做与偶尔的凶暴反差，是全番最稳的笑点担当。对暴食魔神而言，世界上只有两种东西：能吃的，和还没来得及吃的。",images:["龙族/莉姆_1.jpg","龙族/莉姆_2.jpg"],tags:["吃货"]},
{id:22,name:"薇妮",source:"在地下城寻求邂逅",type:"龙娘",desc:"地下城19-24层稀有龙女（Vouivre）异端儿（Xenos），琥珀色眼银蓝色长发，额头有龙女之泪（红色宝石，价值连城），人形态罕见，与贝尔·克朗尼相遇",story:"在地下城寻求邂逅的地底深处的异端儿龙娘（Vouivre），银蓝长发琥珀色眼，额头嵌着价值连城的红色宝石「龙女之泪」。在地下城与贝尔相遇，是他第一个许下「想再见」的怪物朋友。作为拥有智性的异端儿，她渴望与人共存，却在身份暴露后被人类冒险者追猎，最终倒在贝尔怀中。她的死成为全作最沉重的转折，把贝尔与异端儿们推上共同寻求共存之路的命运。",images:["龙族/薇妮_1.jpg","龙族/薇妮_2.jpg","龙族/薇妮_3.jpg","龙族/22_1.jpg","龙族/22_2.jpg","龙族/22_3.jpg","龙族/22_4.png"],tags:["异端儿","温柔"]},
{id:23,name:"布伦希尔德",source:"失落的龙约",type:"龙娘",desc:"栖息阿德拉火山的绯龙，性格如燃烧岩浆般暴躁，阿德拉火山喷发因其躁动魔力，数百年前只身迎击魔兽保护火山，与一名男子结下契约，火属性4星",story:"失落的龙约中栖息阿德拉火山的绯龙，性格如燃烧的岩浆般暴躁，其躁动魔力正是火山喷发的信号。数百年前魔兽来袭时，她只身迎击守住火山，也因此与一名男子结下契约。如今的她以契约之力与羁绊为炉，把暴烈炼成守护之焰——火属性4星，是火山地带最凶也最可靠的邻居。与那位男子的契约故事至今仍在火山地带流传——暴烈的龙，也会为羁绊收敛怒火。",images:["龙族/布伦希尔德_1.jpg"],tags:["火山"]},
{id:24,name:"加列翁",source:"碧蓝幻想",type:"龙娘",desc:"六龙之一·地之楔（土属性），创世神巴哈姆特创世时自然诞生，世界稳定的楔，人形态目测20岁身高155cm，用心灵感应，亲吻他人给予祝福",story:"碧蓝幻想六龙之一「地之楔」，创世神巴哈姆特创世时自然诞生的存在，是维系世界稳定的楔。几乎不言语，以心灵感应交流，亲吻他人可以施与祝福。人形态目测20岁、身高155cm。沉默地履行楔之职责，大地异变时现身——她的每一次苏醒，都是世界尺度的大事。想要得到她的祝福，先要学会读懂她沉默的温柔。大地的每一次震颤，都是这根「楔」在履行职责的心跳。",images:["龙族/加列翁_1.jpg","龙族/加列翁_2.jpg","龙族/加列翁_3.jpg"],tags:["地之楔","沉默"]},
{id:25,name:"艾哈",source:"赤龙战役",type:"龙之巫女",cv:"泽城美雪",desc:"尼尔·卡姆伊革命军少女，负责王族忌布基护卫，联系者种族（与双眼损毁的巨大犬状魔物瓦尔共享生命），会合前过野兽般生活。",story:"2015年动画《Chaos Dragon 赤龙战役》角色。煌历3015年，岛国尼尔·卡姆伊的守护神赤龙暴走，三国混成调查队介入，国运随之激荡。隶属于独立派革命军的艾哈担任王族忌布基（伊吹）的护卫，作为「联系者」种族与双眼损毁的巨大犬状魔物瓦尔共享生命——与瓦尔同生共死的战斗方式，也是她全部的温柔所在。在赤龙暴走的乱世里，少女与魔兽的共生，是尼尔·卡姆伊最温柔的羁绊。",images:["龙族/艾哈_1.jpg","龙族/艾哈_3.jpg"],tags:["巫女"]},
{id:26,name:"特娅",source:"龙鸣 DRAGONAUT",type:"龙娘",cv:"茅原实里",desc:"塔那托斯派遣的第二只原龙ALBUM（拉丁文=纯白），紫发紫眸少女，任务是带回地球龙蛋，使阵失去家人的元凶，心地善良与主角相爱，歌声能被阵听到（共鸣）",story:"龙鸣 DRAGONAUT的原龙ALBUM（拉丁语「纯白」）——塔那托斯派往地球的第二只原龙，紫发紫眸的少女。降临地球的事故夺走了阵的家人，怀负罪感的她与阵相遇、相爱，她的歌声只有阵能听见（共鸣）。在「带回龙蛋」的使命与对人类的爱之间挣扎，最终选择与阵共同面对龙的宿命，以自己的方式为这段跨越种族的羁绊找到了归宿。",images:["龙族/特娅_1.jpg","龙族/特娅_2.jpg"],tags:["原龙","共鸣"]},
{id:27,name:"上杉绘梨衣",source:"龙族",type:"龙之巫女",desc:"蛇岐八家上杉家家主（对外），实际是赫尔佐格用上杉越基因制造的试管婴儿，拥有言灵审判（序列号111高危），号称蛇岐八家最强的剑，需死侍胎儿血清维持生命，与源稚生/源稚女同胞兄妹",story:"龙族。赫尔佐格以上杉越基因制造的试管婴儿，对外是蛇岐八家上杉家家主，实为八家饲养的「最强之剑」，需死侍胎儿血清维持生命，拥有高危言灵·审判（序列号111）。龙族3中与路明非相遇，游乐园的一天是她一生中唯一像普通少女的时光——Sakura铃铛、八音盒与樱花之约。最终在高天原事变中香消玉殒，留下的铃铛与未完成的约定，成为路明非此后所有暴走的起点。",images:["龙族/上杉绘梨衣_1.jpg","龙族/images_12.jpg","龙族/images_13.jpg","龙族/images_14.jpg","龙族/images_15.jpg","龙族/images_16.jpg","龙族/images_17.jpg","龙族/images_18.jpg"],tags:["半龙","悲剧"]},
{id:28,name:"夏弥",source:"龙族",type:"真龙",desc:"大地与山之王耶梦加得（Jormungandr），龙王芬里厄的妹妹，卡塞尔学院一年级新生，血统A级，言灵风王之瞳（序列号74），四大龙王之一，双生兄妹被对方吞食后进化为死神海拉",story:"龙族。大地与山之王耶梦加得的人间体，龙王芬里厄之妹，血统A级，以卡塞尔学院一年级新生的身份接近路明非。北京胡同里的同居日常是她短暂的「人类体验」，言灵·风王之瞳（序列号74）昭示龙王之力，真相揭开后一场龙王级大战；双生兄妹互吞的宿命让她最终进化为死神海拉——以最残酷的方式完成王之加冕。从北京的烟火气到龙王的王座，她走过的每一步都是宿命，也是选择。",images:["龙族/bfqj8hdh0hm7p15v1a1q37jxkgnw6zx.png","龙族/images_11.jpg","龙族/夏弥_1.jpg","龙族/夏弥_2.jpg","龙族/9c16fdfaaf51f3deb48f9ad0f6b5e71f3a292df5d376_1_1.webp"],tags:["半龙","真龙"]},
{id:29,name:"艾拉",source:"复苏的魔女",type:"龙娘",desc:"即将迎来千岁生日的古老种族后裔，外表可爱小萝莉，在人类世界旅行上百年见多识广，平时人形态示人，真正生气时变回龙形态，UR级全能型，竞技场霸主，龙舞自带回血减伤",story:"复苏的魔女。奇洛拉世界蒙特尼亚公国的古老龙族后裔，即将迎来千岁生日。平时以人形小萝莉示人，在人类世界旅行上百年见多识广，唯独不愿在人前变回龙形态破坏形象。真正动怒时才展露真身：范围火焰吐息配合龙舞印记的每秒回血，攻守一体，让她成为竞技场里人称「全能UR霸主」的存在。千年将至的龙族后裔，把「保持可爱」当作比龙形态更重要的原则。",images:["龙族/艾拉_1.jpg"],tags:["萝莉"]},
{id:30,name:"美露莘",source:"FGO",type:"龙娘",cv:"高野麻里佳",desc:"英国白龙阿尔比恩转生为妖精，摩根妖精骑士最强者，奥罗拉养女，帕西瓦尔养妹，可变形为飞行形态，第三技能变回原本模样释放龙之威压（对界宝具Hollowheart Albion）。妖精国不列颠圆桌骑士之一，获得泛人类史圆桌骑士·兰斯洛特灵基赐名的妖精骑士，在不列颠只是一种「龙」的妖精，被誉为妖精国最高贵、最美丽的妖精。",story:"FGO第二部六章。英国白龙阿尔比恩转生而成的妖精，摩根妖精骑士中最强者，称号妖精骑士兰斯洛特。奥罗拉养女、帕西瓦尔养妹，以甜美人形行走妖精国，可变形为飞行形态。第三技能解放真身时，天空将响起龙的威压——对界宝具「Hollowheart Albion」展开，便是她作为白龙的本来面目。妖精国崩坏的终局战中，她以白龙之姿划破长空。",images:["龙族/美露莘_1.jpg","龙族/images_21.jpg","龙族/images_22.jpg","龙族/images_23.jpg","龙族/images_24.jpg","龙族/メリュジーヌ满破.png","龙族/images_25.jpg","龙族/images_26.jpg","龙族/30_1.png","龙族/30_4.jpg"],tags:["妖精","FGO"]},
{id:31,name:"提亚马特（幼体）",source:"FGO",type:"真龙",cv:"悠木碧",desc:"古代美索不达米亚神话创世神，Beast II，身高160cm~7400万km²，天生没有死，只要地上还有活着的生命就不会消亡，少女体140cm/成人体160cm。",story:"FGO绝对魔兽战线的最终Boss，Beast II。美索不达米亚创世女神，因「被抛弃的神」之悲愿黑化，以黑泥之海覆盖生命——想让一切回归子宫，只因再没有生命需要母亲。天生没有死亡概念，只要地上还有活着的生命便不会消亡。少女体140cm与成人体160cm的极端反差，加上魔兽十一子的压制力，让第七特异点的最终决战成为人理史上最沉重的一页。最终被锁入虚空封印。",images:["龙族/提亚马特_2.jpg","龙族/images_19.jpg","龙族/images_20.jpg","龙族/31_2.jpg"],tags:["神","FGO"]},
{id:32,name:"真红（Shinku）",source:"异环",type:"龙娘",cv:"唐夏芳",desc:"异象管理局收容二组，光属性S级主C，异能月夜红龙，生日8月13日，大招绯红之怒进入第二型态大幅增伤，残秒收招龙焰审判龙喷爆发。",story:"异环（NTE）异象管理局收容二组的光属性S级主C，龙族血脉，头顶龙角身带长尾，8月13日生日。大招「绯红之怒」进入第二型态大幅增伤，残秒收招「龙焰审判」以龙喷终结战场，异能「月夜红龙」。近战爆发、多次短距位移、大范围AOE，让她成为1.2版本深渊的常驻答案。从测试阶段到正式实装，这位龙娘主C用实力证明：龙族血脉，就是版本答案。",images:["龙族/真红_1.jpg"],tags:["主C","龙角"]},
{id:33,name:"伊丽莎白·巴托里",source:"FGO",type:"龙娘",desc:"原型匈牙利血腥伯爵夫人，龙娘（无辜的怪物长龙角）",story:"FGO。原型匈牙利血腥伯爵夫人伊丽莎白·巴托里，因残虐传说被后人妖魔化而成的「无辜的怪物」——长出龙角龙尾的龙娘。坚信自己是天才偶像，高音域的音波与龙息是她的武器，万圣节年年强占活动舞台开演唱会。从铁血伯爵夫人到「超绝对偶像预备役」，这份跨越生死的自信，正是她最可爱的怪物之处。嗓门能震碎城墙的龙娘偶像，梦想是开一场让全人类都来听的演唱会。",images:["龙族/伊丽莎白_1.jpg","龙族/伊丽莎白_2.jpg","龙族/伊丽莎白_3.jpg","龙族/33_1.jpg"],tags:["FGO"],star:false},
{id:34,name:"法露特（黑龙骑士）",source:"影之诗",type:"龙娘",cv:"三泽纱千香",desc:"统领魔龙军首领，天空霸者，骑搭档黑龙驰骋战场，使用两把长矛，心高气傲但对强者给予敬意，认为公平对决战胜强者是无上荣耀，传说卡牌",story:"影之诗龙族传说卡，统领魔龙军的首领，号称天空霸者。与搭档黑龙心意相通，驰骋战场时双长矛所向披靡。心高气傲却对强者致以敬意——在她看来，公平对决中堂堂正正战胜强者，才是无上荣耀；偷袭与轻蔑都是对骑士之名的玷污，是龙职业中期压场的传说战力。骑上黑龙冲向天空的那一刻，她就是魔龙军仰望的旗帜。对强大的敬意与对胜利的执念，构成了这位黑龙骑士的全部骄傲。",images:["龙族/法露特_1.jpg","龙族/法露特_2.jpg"],tags:["骑士"]},
{id:35,name:"龙之魔女·莉莉乌姆",source:"影之诗",type:"龙娘",cv:"钉宫理惠",desc:"悠久学园传说卡龙族，用牙爪火焰创造龙为其效力，终极形态召唤莉莉乌姆之龙（5/5突进），永火龙罪魁祸首之一。",story:"影之诗悠久学园的龙族传说卡。以牙爪与火焰创造眷属之龙为己效力，终极形态召唤「莉莉乌姆之龙」（5/5突进）踏平战场。被称为「永火」异变的罪魁祸首之一——龙之魔女的火焰烧到哪里，哪里的命运就开始燃烧；她的卡面与语音里，藏着影之诗龙族最危险也最华丽的传说。在她的学园传说里，被龙之魔女盯上的人，连求饶都要先排队。",images:["龙族/莉莉乌姆_1.jpg"],tags:["魔女","钉宫"]},
{id:36,name:"龙剑少女·艾拉",source:"影之诗",type:"龙娘",desc:"影之诗龙职业2费随从，挥剑苦修的龙族少女，进化时PP最大值+1。后续系列卡有「龙骑士·艾拉」（CV户松遥）、「羁绊龙剑士·艾拉」",story:"影之诗龙职业2费随从。挥剑苦修的龙族少女，一句「嘿嘿……还是比不上龙先生就是了」道破进化的动机——想追上龙先生的背影。进化时PP最大值+1，以自身成长为整个龙族提速。后续的「龙骑士·艾拉」「羁绊龙剑士·艾拉」延续这条修行线：从少女到骑士，每一张卡都是同一份不服输。挥剑、落空、再挥剑——少女的修行没有捷径，只有一天比一天更亮的剑光。",images:["龙族/龙剑少女艾拉_1.jpg"],tags:["影之诗","龙职业"]},
{id:37,name:"清姬",source:"FGO",type:"龙娘",desc:"爱过于沉重变成大蛇的少女，因对欺骗自己的安珍的妄执而化为喷火大蛇，宝具转身火生三昧EX（对人宝具自身），不继承龙种血脉只是妄执所化，Berserker职阶",story:"FGO。日本传说「安珍与清姬」的化身——被负心人欺骗的执念让她化为喷火大蛇，把躲进道成寺梵钟的安珍连钟烧死，宝具「转身火生三昧·EX」正是这段传说的具现。不继承龙种血脉，纯粹是「妄执所化」的龙，Berserker职阶。如今把同样的偏执之爱倾注在主人公身上：查岗、追踪、般若面具——她的爱火至今没有熄灭的意思。对安珍是地狱，对主人是天堂——同一团妄执之火，烧出两种命运。",images:["龙族/清姬_1.jpg","龙族/清姬_2.jpg","龙族/2aa0647751e2a2d402ecfae22a569735.jpg","龙族/ef6dc148395d4696b22f1a0b8fd955d0.jpg","龙族/37_1.png"],tags:["FGO","病娇"]},
{id:38,name:"堤丰·厄斐墨洛斯",source:"FGO",type:"龙娘",cv:"山根绮",desc:"自天上坠落的太祖之龙，龙种兼神兽已超出常理范畴，希腊神话盖亚所生巨人/怪物，身高152cm体重43kg，混沌·恶天，幸运E（堤丰）/B（厄斐墨洛斯），Pretender职阶。真面目是古代提坦之战中本应毁灭的提坦系舰船残骸坠落到地球，被纳入宙斯他们神话体系中的「古老巨神」「怪物之祖」，实力与宙斯不相上下甚至更胜一筹，真体被封印于埃特纳火山的地底。",story:"FGO。希腊神话中盖亚所生、连神明都畏惧的「太祖之龙」堤丰自天上坠落的姿态，龙种兼神兽，超出常理范畴。一体双魂：堤丰与厄斐墨洛斯共成一体，混沌·恶·天，幸运E。152cm/43kg的少女外形与神兽内核形成极端反差，Pretender职阶。「落泪之翼」活动中，因她的愿望而分裂出的存在，成为整场活动命运的伏笔。拥有极大量怪物因子，有涅墨亚的狮子、斯芬克斯、拉冬、刻耳柏洛斯、金羊毛之龙等众多子嗣。",images:["龙族/38_1.jpg","龙族/提丰_1.jpg","龙族/提丰_3.jpg","龙族/提丰_4.jpg","龙族/38_2.jpg","龙族/38_3.jpg","龙族/38_4.jpg"],tags:["FGO","一体双魂","太祖龙"]},
{id:39,name:"伊普西龙",source:"FGO",type:"龙娘",desc:"提丰的姐妹，一体双魂，同为太祖龙（与提丰·厄斐墨洛斯同一人）",story:"FGO「落泪之翼」活动中登场，是堤丰·厄斐墨洛斯为实现愿望而创造的「另一个自我」，视提丰为姐姐。奥德修斯Alter揭开的真相：她并非来自无常果实，而是厄斐墨洛斯的产物——与提丰同源一体的太祖龙。当「妹妹」的存在本身成为活动主线的谜底，她天真的笑容背后，是一场关于存在与分离的温柔悲剧。存在即是奇迹，分离亦是羁绊——她的名字，写在了「落泪之翼」的结局里。",images:["龙族/伊普西龙_1.jpg"],tags:["FGO","一体双魂","太祖龙"]},
{id:40,name:"白露",source:"崩坏星穹铁道",type:"龙娘",desc:"仙舟罗浮持明族衔药龙女，性格活泼小女孩，药到病除的名医，常开不拘一格药方（多喝热水/睡一觉就好），治病时闭着眼睛，雷属性丰饶命途，可为队友附加生息状态并复活",story:"崩坏星穹铁道仙舟罗浮持明族的衔药龙女，年轻一辈里的名医。雷属性丰饶命途，行医风格不拘一格：药方常开「多喝热水、睡一觉就好」，治病时闭着眼睛全凭手感，气得同行直摇头。战斗中可为队友附加生息状态甚至复活倒下者——医者仁心直接写进了机制里。龙角下的少女悬壶济世，是仙舟最温柔的奇迹。药方可以敷衍，医术绝不含糊——被她治好的病人，都成了「多喝热水」的忠实信徒。",images:["龙族/白露_1.jpg","龙族/白露_2.jpg"],tags:["医生"]},
{id:41,name:"龙珏",source:"阴阳师",type:"龙娘",cv:"佟心竹（中）/石见舞菜香（日）",desc:"阴阳师2024年八周年「云华之卷」SSR式神，本体为守护云华城的神明青龙。特色机制「玄血」攻防转换，技能「龙叱」龙腾天地生",story:"阴阳师2024年八周年「云华之卷」上线的SSR式神，本体是守护云华城的神明青龙，中配佟心竹、日配石见舞菜香。技能「龙叱」龙腾天地生，特色机制可将敌方血条转为「玄血」，攻防转换间尽显神龙之威。上线即成为斗技与PVE双修的热门，专属主题曲《云华见龙》——云华城的龙，八周年版图上最年轻的神明。玄血翻覆间攻守易势，青龙起处，云华城的灯火长明。",images:["龙族/龙珏_1.jpg"],tags:["神","阴阳师"]},
{id:42,name:"四万十",source:"碧蓝航线",type:"龙娘",desc:"重樱所属轻巡洋舰，愿望具现特别计划舰，被解封的龙之传承，白发红眼龙角龙尾，穿暴露和服，供物おやつ可换一切（聊天到降雨），第六期科研舰",story:"碧蓝航线重樱所属轻巡洋舰，第六期科研舰，「愿望具现」特别计划的产物，身上封着被解封的龙之传承——白发红眼、龙角龙尾，一身暴露和服。她能以一份供物点心（おやつ）交换几乎一切：陪聊到天明、唤来一场雨，甚至更了不得的奇迹。对指挥官来说，这位龙娘舰船是科研计划里最「不科学」也最治愈的存在。和龙之传承一同苏醒的她，正用一份又一份点心，把舰队的日子过成了传说。",images:["龙族/四万十_1.jpg","龙族/525px-四万十立绘.jpg","龙族/42_1.jpg"],tags:["舰娘","和服"]},
{id:43,name:"龙和",source:"白荆回廊",type:"龙娘",cv:"醋醋（中）",desc:"白荆回廊金鳞族同调者，出身异界「海错」，龙晴之姐。火元素战线核心战力，配合伊琅相思、罗咤可构筑火队。",story:"白荆回廊的金鳞族同调者，出身异界「海错」——登场一句「金鳞族，龙和。你就是监督？我妹妹龙晴承蒙你照拂了」，把兄妹俩与监督的世界线系在一起。海错的鳞光映在现世的火场上，她是火元素战线的核心战力之一，配合伊琅相思、罗咤可构筑凶悍的新火队。鳞为甲，火为兵，龙和的战斗一如其名，平和之下藏着一整片海的重量。海错的水汽混着现世的火光，这位金鳞族的战将，把「守护妹妹」刻进了每一次出手。",images:["龙族/龙和_1.jpg","龙族/龙和_2.jpg"],tags:["金鳞族","白荆回廊"]},
{id:44,name:"青龙元君",source:"归龙潮",type:"龙娘",cv:"谢莹",desc:"归龙潮1.1版本「龙吟狮醒」首位限定五星破韧位，称号「苍龙振霄」，狮子区守护神/宗武盟统领，召唤霜龙多段范围轰炸。",story:"归龙潮1.1版本「龙吟狮醒」实装的首位限定五星破韧位，称号「苍龙振霄」。狮子区守护神、宗武盟统领，象征铁血与正义，统领狮卫维护四方和平。战斗中召唤霜龙多段范围轰炸，将敌人牵引聚拢再一举冻结，破韧与控场一体成型——青龙所至，四海肃然。守护狮区的日子里，她的霜龙既是威慑，也是市民心中最安定的图腾。铁血不是冷酷——狮卫的每一道防线背后，都是她的公正与担当。",images:["龙族/青龙元君_2.jpg"],tags:["东方龙","归龙潮"]},
{id:45,name:"丹妮",source:"千年之旅",type:"龙娘",cv:"写川",desc:"圣龙王朝末代女帝，五星星痕（君王级），继承龙神血脉，称号「人类最后的屏障」。年仅8岁便孤身前往多斯克城击杀龙族叛徒，继位后迅速平定权力骚乱，亲手处决5名叛变的格罗瑞亚亲王。技能风暴王权/龙帝君临/光辉之夏，风暴女王。",story:"千年之旅。圣龙王朝的末代女帝，年纪轻轻便以雷霆手段稳固王位——8岁孤身闯多斯克城，继位后亲手处决5名叛变的格罗瑞亚亲王。她继承龙神血脉，是人类最后的屏障。风暴王权卷起飓风群体伤害，龙帝君临加持友军破防，光辉之夏撑起全队护盾。从平定内乱到对抗深渊的神之实验，丹妮以幼帝之躯扛起了整个龙族的未来。「欢迎回来。」——对星痕而言，她既是女王，也是可以依靠的家人。",images:["龙族/丹妮_1.jpg"],tags:["女王","圣龙王朝"]},
{id:46,name:"吉拉蒂亚",source:"千年之旅",type:"龙娘",cv:"宋政楠（中）/石川由依（日）",desc:"红龙亲王艾莉克希娅之女，极为罕见的独生龙种，母亲力量完全遗留，几乎代表凡人力量的极限，5岁成为圣龙王国最年轻龙神，阿塔利家族候补魔女，画师鵜飼沙樹。",story:"千年之旅的独生龙种——红龙亲王艾莉克希娅之女，母亲的力量完整遗留其身，几乎代表凡人力量的极限。5岁加冕为圣龙王国史上最年轻的龙神，同时以阿塔利家族候补魔女的身份修行，画师鵜飼沙樹。萝莉的外表下，是龙神之位与王国未来的重量。年纪虽小，龙神的威光已然初显——圣龙王国的未来，就压在这具小小的身板里。",images:["龙族/吉拉蒂亚_1.jpg"],tags:["萝莉","公主"]},
{id:47,name:"龙三元",source:"妖怪名单",type:"龙娘",cv:"冯骏骅（动画）",desc:"东海龙宫三公主，龙之末裔，学校校医和副校长，与苏九儿闺蜜，法宝御龙宝珠，看韩剧产生龙之泪（每颗五十万两），妖力胜过七成苏九儿，童年与阳眼转世阿疯相遇，龙百年一岁人百年一世",story:"妖怪名单。东海龙宫三公主、龙之末裔（属「神」而非「妖」），现职封夕所在学校的校医兼副校长，苏九儿的闺蜜兼黑名单同僚。法宝御龙宝珠，爱珠宝首饰；看韩剧哭出的眼泪是延寿仙药「龙之泪」，每颗价值五十万两，妖力胜过七成苏九儿。「龙百年一岁，人百年一世」——与封夕在「阿疯」那一世的旧缘，是她漫长生命里最柔软的一页。",images:["龙族/龙三元_1.jpg"],tags:["公主","校医"]},
{id:48,name:"苇草",source:"明日方舟",type:"龙娘",desc:"维多利亚出身，德拉克族（dragon），身高172cm，感染者，深池领袖（被姐姐逼迫成为影子），能力燃烧生命活化生物质（以前会让人自燃，成长后只活化不燃烧），后转医疗干员（焰影苇草）",story:"明日方舟。维多利亚德拉克族末裔，本名拉芙希妮，身高172cm感染者。被迫以「深池领袖」的影子身份站上台前，真正的线牵在双胞胎姐姐爱布拉娜手中。能力是燃烧生命活化生物质，失控时曾令接触者自燃。在姐姐的野望与自我意志的夹缝中挣扎觉醒，最终以「焰影苇草」之姿归来——转职医疗干员，不再燃烧他人，而是以火续人。德拉克的血、深池的旗、妹妹的名——三重枷锁之下，她仍在寻找自己的答案。",images:["龙族/苇草_3.jpg","龙族/48_4.jpg","龙族/苇草_2.jpg","龙族/48_3.jpg"],tags:["明日方舟"]},
{id:49,name:"塔露拉",source:"明日方舟",type:"龙娘",desc:"乌萨斯公爵科西切（不死的黑蛇）夺走的养女，愤怒的红龙，能力纯爆燃加热升温（火的君主），曾自愿成为感染者杀死科西切（但科西切不死），被科西切法术标记可随时夺舍身体，后意志恢复夺回身体控制权",story:"明日方舟。被乌萨斯公爵科西切（不死的黑蛇）夺走的养女，乌萨斯与龙的血统在她体内撕扯。以「愤怒的红龙」之姿成为整合运动领袖，把感染者的大旗插遍切尔诺伯格——却被科西切的法术暗中标记，身体随时可能被夺舍。在阴谋与理想的裂缝中一度沉沦，最终凭借残存的自我夺回身体控制权。等待她的不是凯旋，而是漫长的赎罪之路——红龙的愤怒，终于烧向了真正该烧的人。",images:["龙族/塔露拉_1.jpg","龙族/49_4.jpg"],tags:["明日方舟","领袖"]},
{id:50,name:"爱布拉娜",source:"明日方舟",type:"龙娘",cv:"浮梦若薇（中）/能登麻美子（日）",desc:"深池领袖，焚尽伪装的德拉克，苇草（拉芙希妮）的双胞胎姐姐，从小野心家政略长，操纵紫色火焰源石技艺，以盖尔王权力珍宝为饵驱使深池争夺赏赐，深池真实领导者。",story:"明日方舟深池的「真实领袖」，苇草（拉芙希妮）的双胞胎姐姐。从小野心与政略并长，把妹妹推上影子之位、自己隐于幕后操盘，以盖尔王的权力珍宝为饵驱使深池众。操纵紫色火焰的源石技艺是其獠牙，冷静的声线之下是一场蓄谋已久的豪赌——塔拉问题的解法，她要亲手写在维多利亚的版图上。紫焰燃处，深池的旗帜所指，即是她野望的疆界。与妹妹的对峙迟早要来——那将是德拉克一族命运的最终章。",images:["龙族/爱布拉娜_1.jpg"],tags:["明日方舟","双胞胎"]},
{id:51,name:"风笛",source:"明日方舟",type:"龙娘",cv:"沈玥（中）/丰崎爱生（日）",desc:"前维多利亚风暴突击队成员，代号乐器命名（队长号角），小丘郡暴乱后脱离部队，出色突击战斗能力，习惯团队作战，杀怪回费先锋。",story:"明日方舟前维多利亚风暴突击队成员，代号取自队内「乐器命名」传统，背着与娇小身形极不相称的巨型风笛。小丘郡暴乱后脱离部队，带着出色的突击战斗能力与刻进骨子里的团队习惯来到罗德岛。杀敌回复部署费用的先锋打法，让她成为战场节奏的发动机——号角一响，全队起跑。风笛声起处，先锋开路——这支乐器既是她的代号，也是全队的冲锋号。在维多利亚失去的，她要在罗德岛找回来——以军人的方式。",images:["龙族/风笛_1.jpg","龙族/51_1.jpg","龙族/51_2.jpg","龙族/51_4.jpg"],tags:["明日方舟"]},
{id:52,name:"露娜",source:"第七史诗",type:"龙娘",desc:"万坦贝克龙骑士，半龙半人，龙角龙尾，外号水龙",story:"第七史诗的「水龙」，万坦贝克龙骑士。温滕贝格王室出身的半龙——人类父亲与龙族母亲所生，与姐姐尤娜同为龙裔，却曾因血统遭受无情报歧。温滕贝格王室与龙族和解后，她被以英雄之礼接纳，从此献身于人类与龙族共存的事业，誓要终结一切横亘在两族之间的阻碍。龙角龙尾，一杆长枪贯穿战场。如今她挺枪而战的身影，已成为两族和平最鲜活的旗帜。",images:["龙族/露娜_1.jpg","龙族/露娜_2.jpg","龙族/露娜_3.jpg","龙族/52_1.png","龙族/52_2.jpg","龙族/52_3.png","龙族/52_4.png"],tags:["骑士"]},
{id:53,name:"特赛里恩",source:"冰与火之歌/血与火",type:"龙娘",desc:"冰与火之歌外传《血与火》母龙，号「蓝女王」，深钴蓝色翅膀，利爪龙冠腹部鳞片亮如铜，吐钴蓝色火焰，驭龙者戴伦·坦格利安，血龙狂舞时期最年轻的龙，敏捷速度出众",story:"冰与火之歌外传《血与火》。血龙狂舞时期的母龙，号「蓝女王」，驭龙者为韦赛里斯一世与阿莉森的三子戴伦·坦格利安（绿党）。深钴蓝的翅膀与龙焰、利爪龙冠腹部鳞片亮如铜箔，以敏捷速度出众著称。戴伦驾驭她突现腾石镇战场，一战救下濒溃的绿党军；最终在第二次腾石镇的巨龙混战中身负重伤，战后被三箭终结——血龙狂舞无数龙殒中最令人唏嘘的一笔。",images:["龙族/特赛里恩_1.jpg"],tags:["冰与火之歌","蓝女王"]},
{id:54,name:"西施",source:"王者荣耀",type:"龙娘",desc:"龙族公主皮肤「游龙清影」，东方龙女",story:"王者荣耀西施的「游龙清影」皮肤，以东方龙为灵感的龙族公主形象。素白与青碧的衣袂间，清水在她指尖凝成游龙；技能牵引的丝线化作水龙缠绕，大招展开时更有一条游龙破水而出，将「沉鱼」的江南水韵与龙的传说合而为一。峡谷里的东方龙女，飘逸与威严并存。技能特效里水龙随丝线起舞，一收一放之间，敌人已被她牵向命运的方向。西施不动，游龙先行——这份举重若轻的优雅，正是「沉鱼」二字的新注解。",images:["龙族/54_1.png","龙族/西施_1.jpg","龙族/54_3.jpg"],tags:["东方龙"]},
{id:55,name:"今汐",source:"鸣潮",type:"龙之巫女",desc:"鸣潮天城龙主今令尹，原名汐，出生今州云霄山，16年前残象潮中夭折后被岁主「角」复活成为其共鸣者，衍射/长刃5星，共鸣发动时颅顶长类龙角结晶，能凝聚淡色天光成类岁主形光芒，幼年常做溺水梦抓着鳞片",story:"鸣潮今州天城龙主，原名汐，生于今州云霄山。16年前的残象潮中夭折，被岁主「角」复活并成为其共鸣者，自此肩负龙主之责。共鸣发动时颅顶生长类龙角的结晶，能凝聚淡色天光化作类岁主形的光芒。幼年常做溺水的梦——黑暗中始终抓着的那片鳞，是她与角之间跨越生死的羁绊。今州在她守护下沉稳运转。岁主观星，龙主守城——今州的每一寸安宁，都有她的天光作证。",images:["龙族/今汐_2.jpg","龙族/55_1.jpg","龙族/55_2.jpg","龙族/55_3.jpg"],tags:["龙主"]},
{id:56,name:"物部深月",source:"铳皇无尽的法夫纳",type:"龙之巫女",desc:"6岁交通事故父母双亡时D能力觉醒，物部家养女，与悠无血缘兄妹（邻居6年+家人7年共13年），布伦希尔德教室，第八抗体龙种，权能本质通过人类共通属性量子共振同调状态下对因果律固定干涉，扭曲人类命运强制确定死亡",story:"铳皇无尽的法夫纳。6岁在交通事故中失去父母时D能力觉醒，成为物部家养女，与悠是无血缘的兄妹（邻居6年加家人7年共13年）。布伦希尔德教室成员，第八抗体龙种。权能本质是借人类共通属性量子共振、在完全同调状态下对因果律固定干涉——扭曲人类命运，强制确定「死亡」。平日里是安静懂事的妹妹，战场上却是教室最深的底牌。被命运诅咒的少女，最终选择亲手改写命运——哪怕代价是自己的安稳。",images:["龙族/物部深月_1.jpg"],tags:["妹妹","因果律"]},
{id:57,name:"琦莉·史尔特尔·穆斯贝尔海姆",source:"铳皇无尽的法夫纳",type:"龙之巫女",desc:"身高约160cm，并非人类而是由弗栗多以上位元素制造而成，被标记为灾难的D中最危险者，龙崇拜教派穆斯贝尔之子的领袖，最初是反派，缇娅头上两只红角是为击倒尤克特拉希尔由她装设",story:"铳皇无尽的法夫纳。并非人类，而是由龙「弗栗多」以上位元素制造的存在，被标记为「灾难的D」中最危险者，身高约160cm。龙崇拜教派「穆斯贝尔之子」的领袖，最初以反派身份登场——缇亚头顶两只红角，正是她为击倒尤克特拉希尔而装设的装置。与悠等布伦希尔德教室众人的对抗，最终也成为她寻找自身存在意义的旅程。被制造出来的「灾难」，也在用自己的方式寻找答案：我不是武器，我是琦莉。",images:["龙族/琦莉_1.jpg","龙族/琦莉_2.jpg"],tags:["反派"]},
{id:58,name:"祀",source:"明日方舟：终末地",type:"龙娘",desc:"塔卫二极少数巨兽代理人之一，巨兽是泰拉原生超因果生物，祀与其巨兽关系复杂，实际上并非谁的代理她只是她自己，隐藏强大神秘下是仍对世界抱有希望好奇心的年轻灵魂，6星寒冷属性限定辅助，墨魂机制可伪真伤",story:"明日方舟：终末地中塔卫二上极少数巨兽代理人之一。巨兽是泰拉原生超因果生物，而祀与她的巨兽关系复杂——「实际上并非谁的代理，她只是她自己」。隐藏的强大与神秘之下，仍是对世界抱有希望与好奇心的年轻灵魂。6星寒冷属性限定辅助，墨魂机制可打出伪真伤，是终末地开服季最亮眼的龙娘。巨兽的伟力、人类的躯壳、自己的意志——祀的存在本身，就是终末地最大的谜题之一。",images:["龙族/祀_1.jpg","龙族/祀_2.jpg","龙族/祀_3.jpg"],tags:["明日方舟","巨兽"]},
{id:59,name:"夏洛特",source:"影之诗",type:"龙娘",cv:"大原沙耶香",desc:"影之诗龙职业卡牌「龍人少女‧夏洛特」，龙人族（Dragonewt），守着自己族群的地盘，对硬闯者毫不客气。",story:"影之诗龙人族少女，守着自己族群的「地盘」。对硬闯的外人毫不客气，宣称必须先吃点「有点痛的惩罚」；但若是久违的老客人，进化后的她会摆摆手特别原谅——两句卡牌台词写尽龙人少女的护家本能与小傲娇。白天守门、待客、偶尔吓唬迷路的冒险者，是龙族职业里最有人情味的低费随从之一。对龙人而言，地盘即是家；对这位少女而言，家比什么都重要。",images:["龙族/夏洛特_1.jpg"],tags:["影之诗","龙人"]},
{id:60,name:"夕",source:"明日方舟",type:"龙娘",desc:"炎国出身，身高162cm非感染者，岁兽十二碎片中第十一位（幺妹），曾隐居灰齐山的炎国画家，性格孤傲被令认为胆小，与年关系紧张，拥有高超画艺和将画中景象实体化的权能，为十一位兄弟姐妹绘制了画像但自画像至今未动笔，龙形态是水墨画风格",story:"明日方舟。岁兽十二碎片中最小的幺妹，炎国隐居灰齐山的画家，身高162cm非感染者。权能是将画中景象实体化——笔落之时，山水兵马皆可出纸。「画中人」事件里以一座画中古城与罗德岛结缘。性格孤傲，被令认为胆小，与年关系紧张。为十一位兄弟姐妹都绘了画像，唯独自画像至今未动笔——画不出自己，或许正是她隐居的理由。画中可藏山河万里，笔下难描一个自己——岁兽幺妹的画案，摆着最难的命题。",images:["龙族/夕_1.jpg","龙族/夕_2.jpg","龙族/夕_3.jpg","龙族/60_4.jpg"],tags:["明日方舟","画家"]},
{id:61,name:"黍",source:"明日方舟",type:"龙娘",desc:"岁家第六子，炎国农业天师，限定寻访春节限定干员，权柄农耕，与年/夕/令等同为岁兽十二碎片，龙形态与令的龙长得比较像",story:"明日方舟岁家第六子，炎国农业天师，春节限定干员。与年、夕、令同出岁兽十二碎片，执掌的权柄是「农耕」——春种秋收、水利土壤皆在她掌中，龙形态与令的龙长得有几分相似。别的兄弟姐妹或铸剑或作画，她选择守着田垄：春种一粒粟，岁兽在看。对黎民来说，这位天师比任何神明都更接近人间烟火。风调雨顺的年份，记得去田垄边看看——那位金发龙角的姑娘，正在看麦浪。",images:["龙族/黍_1.jpg","龙族/黍_2.jpg","龙族/60_3.jpg","龙族/61_4.jpg"],tags:["明日方舟","天师"]},
{id:62,name:"贝拉（贝纳勒斯）",source:"崩坏3",type:"龙娘",desc:"第二文明纪元第二律者空之律者西琳的伴生审判级龙型崩坏兽，第二次崩坏中被西琳制造，被赐予征服宝石能力，拥有冰火雷暗四块核心，能操纵天气，昵称贝拉/贝贝龙",story:"崩坏3。第二文明纪元第二律者「空之律者」西琳以权能创造的伴生审判级龙型崩坏兽，被赐予征服宝石，握有冰火雷暗四块核心、可操纵天气。对西琳而言，贝拉是孤独女王唯一的「家人」，昵称「贝贝龙」背后是末世里仅存的温情；对世界而言，她是第二次崩坏里遮天蔽日的灾厄。西琳陨落后，征服宝石与她遗留的力量成为后续主线的重要伏笔。龙型崩坏兽也有心——她对西琳的忠诚，是崩坏世界里罕见的纯粹情感。",images:["龙族/贝拉_1.jpg","龙族/62_1.jpg"],tags:["崩坏"]},
{id:63,name:"帆稀",source:"公主连结",type:"龙娘",cv:"大西沙织",desc:"全名远野帆稀，龙族据点公会会长，外号「龙妈」。日服FES限定（国服2023年10月实装），雷厉风行的会长，私下是黑客+连载漫画家。",story:"公主连结Re:Dive角色，全名远野帆稀，龙族据点公会会长，玩家间外号「龙妈」。日服以FES限定实装（国服2023年10月），白天的她是雷厉风行的会长，私下还是身手不俗的黑客与连载漫画家。把公会成员当家人罩着——龙族据点的屋檐下，没有流浪的龙。会长室里通宵赶稿的漫画家，正是战场上令敌人闻风丧胆的龙族大姐头。",images:["龙族/帆稀_1.jpg","龙族/帆稀_2.jpg","龙族/帆稀_3.jpg"],tags:["公主连结","龙妈"]},
{id:64,name:"琳德",source:"公主连结",type:"龙娘",cv:"关根明良",desc:"公主连结Re:Dive角色，与妹妹维尔姆原本是虚拟世界数字生命NPC，为来到现实世界姐妹共同寄宿于同一机械义体实现逆向登录，12岁身高145cm，2月5日生日水瓶座，趣味与妹妹过假日。",story:"公主连结Re:Dive。与妹妹维尔姆原是虚拟世界的数字生命NPC，为来到现实世界，姐妹以「逆向登录」的方式共同寄宿于同一台机械义体——一台身体、两个灵魂。12岁、145cm、2月5日生水瓶座，趣味是和妹妹过假日。白天是乖乖的少女，灵魂里住着两个人的日常，是公主连结最特别的双子设定。用一台身体的预算，过出两个人的热闹——琳德的日常，比谁都拥挤，也比谁都温暖。",images:["龙族/琳德_1.jpg","龙族/琳德_2.jpg","龙族/琳德_3.jpg"],tags:["公主连结","姐妹"]},
{id:65,name:"维尔姆",source:"公主连结",type:"龙娘",cv:"关根明良",desc:"公主连结Re:Dive限定角色，★3后卫魔法攻击，Debuffer，龙族，25岁4月17日生日牡羊座O型，所属龙巢，趣味绘画读书，与姐姐琳德共同寄宿同一机械义体逆向登录现实世界，连结爆发降敌魔法防御但偶尔偷懒。",story:"公主连结Re:Dive限定角色，琳德的妹妹——姐妹原是虚拟世界的数字生命NPC，为实现「逆向登录」共同寄宿于同一台机械义体。25岁、4月17日生牡羊座O型，★3后卫魔法Debuffer，所属龙巢，趣味绘画读书。连结爆发降低敌人魔法防御，偶尔偷懒摸鱼——但姐妹同体的默契从不出错。一人身两魂的设定之下，是「姐妹永不分离」这句最朴素的誓言。",images:["龙族/维尔姆_1.jpg"],tags:["公主连结","姐妹"]},
{id:66,name:"古月娜",source:"斗罗大陆3龙王传说",type:"真龙",desc:"龙神创生神格所化银龙王，魂兽共主，唐舞麟之妻、蓝轩宇生母，三形态（本体银龙王/古月主人格/娜儿附属人格）后融合，银发紫眸斗罗大陆第一女神，武器白银龙枪金龙逆鳞龙神之心天圣裂渊戟，武魂融合技龙神变",story:"斗罗大陆3龙王传说。龙神创生神格所化的银龙王，魂兽共主。以「古月」「娜儿」双重人格行走人间，在史莱克学院与唐舞麟相识相爱，武魂融合技「龙神变」是两人命运的锚点。白银龙枪、金龙逆鳞、龙神之心与天圣裂渊戟，三形态最终归一——斗罗大陆第一女神，为爱人与魂兽两个世界的存续下注了一切。从魂兽共主到为人妻母，银龙王的每一次抉择，都改写了斗罗大陆的命运。",images:["龙族/古月娜_3.jpg","龙族/古月娜_1.jpg","龙族/古月娜_2.jpg","龙族/古月娜_4.webp"],tags:["女神","一体多魂"]},
{id:67,name:"夭夭",source:"元尊",type:"龙娘",desc:"元尊女主角，祖龙意志孕育之女，天地间「第三序列之神」，先天精神力冠绝诸天。受黑帝苍渊之托随周元修行，守护兽吞吞（祖饕圣源兽），中配醋醋",story:"元尊女主角。祖龙意志孕育之女，天地间「第三序列之神」，先天精神力冠绝诸天。受黑帝苍渊之托随周元修行，一路以近乎全知的视野指引其成长，性情冷漠至极，唯独对周元露出温柔。她的身世与祖龙留下的后手纠缠至深，周元踏遍诸天寻找祖龙血肉，只为让她真正「活」过来——天地棋局中最静、也最重的一子。当第三序列之神露出笑容时，连诸天的法则都会为之让路。",images:["龙族/夭夭_1.jpg","龙族/夭夭_2.jpg"],tags:["第三序列之神","元尊"]},
{id:68,name:"紫妍",source:"斗破苍穹",type:"真龙",desc:"《斗破苍穹》太虚古龙，吸收龙凰本源果后进化为龙凰（天凰之翼+古龙之体），魔兽界至尊，一统分裂太虚古龙族成为新龙皇，天赋蛮力惊人，短时间可变成人大小提升至巅峰，修为从斗宗巅峰飙升至斗圣",story:"斗破苍穹太虚古龙族的小姑娘，天赋蛮力惊人，短时间可化作人形。彼时太虚古龙族四分五裂，她吞服龙凰本源果进化为「龙凰」，生出天凰之翼与古龙之体，登顶魔兽界至尊，随后一统分裂的族群成为新龙皇，修为从斗宗巅峰一路飙至斗圣。与萧炎情同兄妹，是斗气大陆上最可靠的「小祖宗」。从小跟在萧炎身边蹭吃蹭喝的小尾巴，转眼已是魔兽界说一不二的龙皇。",images:["龙族/紫妍_1.jpg"],tags:["龙皇"]},
{id:69,name:"王秋儿",source:"斗罗大陆2绝世唐门",type:"龙娘",desc:"本体星斗大森林帝皇瑞兽三眼金猊（15000年），唐舞桐下界一抹化身附其身上，武魂黄金龙，强攻系战魂圣，绰号黄金龙女，因接引得到霍雨浩完整记忆对人类世界向往化形，史莱克战队队长，性格高傲坚韧，为救霍雨浩主动献祭魂环魂骨命运之力",story:"斗罗大陆2绝世唐门。本体为星斗大森林的帝皇瑞兽三眼金猊（一万五千年），唐舞桐下界的一抹化身曾附其身。化形为绰号「黄金龙女」的强攻系战魂圣，武魂黄金龙，任史莱克战队队长，性格高傲坚韧。因接引得到霍雨浩的完整记忆而对人类世界心生向往，最终为救霍雨浩主动献祭魂环魂骨与命运之力——黄金龙女把自己燃成了照进他命运的那束光。帝皇瑞兽的一万五千年，最终浓缩成一句话：她选择了人类的世界。",images:["龙族/王秋儿_1.jpg","龙族/王秋儿_2.jpg"],tags:["黄金龙"]},
{id:70,name:"伊莉丝·芙蕾雅",source:"铳皇无尽的法夫纳",type:"龙之巫女",cv:"日高里菜",desc:"布伦希尔德教室7号，女主角，银长发粉眼天然呆冒失迷糊，驾空武装双翼之杖/灾厄之杖/灾厄之眼，权能灾厄时间（Catastrophe），击败巴西利斯克后完全继承，利维坦战中发展出远距离物质变换轰炸。",story:"铳皇无尽的法夫纳女主角，布伦希尔德教室7号。银长发粉眼的天然呆，冒失迷糊到能把教室日常搅得天翻地覆，却从不缺席任何一场龙灾。驾空武装「双翼之杖」「灾厄之杖」「灾厄之眼」，权能「灾厄时间（Catastrophe）」在击败巴西利斯克后完全继承；利维坦之战中更发展出远距离物质变换轰炸——笨蛋的努力，从来不输天才。",images:["龙族/伊莉丝_2.jpg"],tags:["天然呆"]},
{id:71,name:"莉莉丝",source:"神话原型（图鉴始祖）",type:"吸血鬼",race:"吸血鬼",desc:"夜之魔女/吸血鬼之母，犹太传说中亚当第一任妻子，被逐出伊甸园后与恶魔结合的夜之女王。作为本图鉴精神始祖收录。",story:"非ACGN角色，神话中吸血鬼的共同源头。",images:["吸血鬼/01_莉莉丝.jpg"],tags:["神话","始祖"]},
{id:72,name:"蕾蒂西亚·德克雷亚",source:"问题儿童都来自异世界？",type:"吸血鬼",cv:"巽悠衣子",race:"吸血鬼",desc:"金发红瞳；平时萝莉外形，摘掉头上蝴蝶结切换成年御姐形态。纯种吸血鬼，前任「穿刺魔王德古拉」，曾持蛇夫座太阳主权，恩赐名「纯洁吸血姬」，保留神格时具备鬼种+神格双重力量。别称「箱庭的骑士」，原为祭祀于夜叉池的活祭品，数百年前被白夜叉授予神格，曾任外门支配者。",story:"原为祭祀于夜叉池的活祭品，数百年前被白夜叉授予神格。三年前被吸血鬼内乱反贼背叛，为守护阶层支配者制度自愿担罪；后作为No Name女仆组一员支撑众人；为查清衔尾蛇全貌潜入魔王联盟。",images:["吸血鬼/t01ec7c1b174ff72e45.jpg","吸血鬼/t0196fcb5813cff0f12.jpg","吸血鬼/R-C.jpg","吸血鬼/images_3.jpg","吸血鬼/images_4.jpg"],tags:["萝莉","御姐"]},
{id:73,name:"嘉妲·库寇坎",source:"噬血狂袭",type:"吸血鬼",cv:"川澄绫子",race:"吸血鬼",desc:"宝石般淡绿长发，翡翠色深湖双瞳，「无貌」之躯容貌可千变万化。第三真祖「混沌皇女」，中美洲夜之帝国混沌境域统治者，T种吸血鬼（族内确认只有女性），可将眷兽化为鞭子/枪状活武器，带兽人体质，27只眷兽，又称「武艺之祖」。",story:"与第一真祖凯伊为旧友，亲自袭击弦神岛测试第四真祖实力。在OVA《噬血狂袭 FINAL》中登场。",images:["吸血鬼/03_嘉妲.jpg"],tags:["真祖"]},
{id:74,name:"克鲁鲁·采佩西",source:"终结的炽天使",type:"吸血鬼",cv:"悠木碧",race:"吸血鬼",desc:"145cm幼女萝莉，赤瞳尖眼尾上挑，暗桃色长发过膝三马尾，蝙蝠状发圈，黑哥特萝莉超短裙。第三位始祖，吸血鬼地下都市桑古尼姆女王。",story:"4年前将濒死的百夜米迦尔喂下自己的血，把他变成吸血鬼复活；亲哥哥阿什拉被第一始祖带走变成鬼（阿朱罗丸）。",images:["吸血鬼/04_克鲁鲁.jpg","吸血鬼/OIP-C.webp","吸血鬼/OIP-C_1.webp","吸血鬼/OIP-C_2.webp","吸血鬼/OIP-C_3.webp","吸血鬼/images_6.jpg","吸血鬼/74_1.jpg","吸血鬼/74_2.jpg","吸血鬼/74_3.jpg"],tags:["萝莉","女王"]},
{id:75,name:"阿古罗拉·弗洛雷斯蒂娜",source:"噬血狂袭",type:"吸血鬼",cv:"石原夏织",race:"吸血鬼",desc:"平时蓝眼金发长及腿部，初中生制服；使用力量时眼瞳燃焰、虹色发光长发；洋娃娃般精致但笑容稚气。先代第四真祖「焰光夜伯」（Kaleid Blood），焰光夜伯计划第12号实验体，12号眷兽冰鸟，本是怯懦怕生的人偶性格。",story:"将第四真祖之力托付给晓古城后死去；是古城的初恋；OVA中作为意识残片再度登场。",images:["吸血鬼/05_阿古罗拉.jpg","吸血鬼/images_5.jpg","吸血鬼/images_7.jpg"],tags:["真祖"]},
{id:76,name:"月",source:"平凡职业造就世界最强",type:"吸血鬼",cv:"桑原由气",race:"吸血鬼",desc:"金发红瞳，外表约12岁娇小少女，哥特风黑裙礼服，323岁却停在萝莉外形。已灭亡吸血鬼王国「阿法达尔」末代女王；无需魔法阵直接操纵魔法的天才，自动再生近乎不死。",story:"被叔父与贵族背叛封印于奈落50层，被始救出后爱上他，第一卷结尾主动诱导始；是始的妻子中「特别」的那位。",images:["吸血鬼/06_月.jpg","吸血鬼/LrsE4na.jpg","吸血鬼/EE6OhrEVAAM8XVE.jpg","吸血鬼/images.jpg","吸血鬼/images_1.jpg","吸血鬼/images_2.jpg","吸血鬼/76_1.jpg","吸血鬼/76_4.jpg"],tags:["萝莉","女王"]},
{id:77,name:"缇拉鞠·加德斯布拉德",source:"家里蹲吸血公主的郁闷",type:"吸血鬼",cv:"楠木灯",race:"吸血鬼",desc:"金发红瞳呆毛M刘海，家里蹲吸血姬，七红天第七军团长。因不能喝血而三重苦：不会魔法、运动白痴、长不高。身怀三种血：吸血种之血（红魔力）、苍玉之血（白银魔力肉体硬化）、翦刘之血（金魔力操刀剑，奥义剑山刀树）。",story:"15岁被皇帝指名当上七红天，率第七军团；在薇儿赫泽辅佐下屡战屡胜；与逆月组织的米莉森特有旧怨。",images:["吸血鬼/638628600880270000.jpg","吸血鬼/638628600880270000_1.jpg","吸血鬼/images_8.jpg","吸血鬼/78_1.jpg","吸血鬼/78_2.jpg","吸血鬼/78_3.png","吸血鬼/78_4.jpg"],tags:["家里蹲","军团长"]},
{id:78,name:"薇尔赫泽",source:"家里蹲吸血公主的郁闷",type:"吸血鬼",cv:"铃代纱弓",race:"吸血鬼",desc:"缇拉鞠的专属女仆，被称为「变态女仆」，负责辅佐家里蹲的将军处理军务与谋略。",story:"突然出现在缇拉鞠面前告知她被任命为七红天，此后一直跟随辅佐。",images:["吸血鬼/08_薇尔赫泽.jpg"],tags:["女仆","谋士"]},
{id:79,name:"卡莲·艾露维希娅斯",source:"家里蹲吸血公主的郁闷",type:"吸血鬼",cv:"日笠阳子",race:"吸血鬼",desc:"穆露奈依特帝国皇帝，性格难以捉摸且奔放，亲自任命家里蹲的缇拉鞠为七红天。",story:"非常喜欢缇拉鞠，曾趁她睡着时偷吻；正是她力排众议亲自点将，把家里蹲的缇拉鞠推上七红天之位——既是任性的皇帝，也是看中她潜力的伯乐。",images:["吸血鬼/09_卡莲.jpg"],tags:["皇帝","奔放"]},
{id:80,name:"朔奈·梅墨瓦鲁",source:"家里蹲吸血公主的郁闷",type:"吸血鬼",cv:"石见舞菜香",race:"吸血鬼",desc:"七红天之一，腼腆柔弱少女，失去战斗时的记忆，对自身力量毫无自觉。被皇帝指派与缇拉鞠搭档调查恐怖分子。",story:"与缇拉鞠搭档追查逆月组织，柔弱外表下藏着未知力量。",images:["吸血鬼/10_朔奈.jpg"],tags:["腼腆","七红天"]},
{id:81,name:"艾丝蒂尔·克莱尔",source:"家里蹲吸血公主的郁闷",type:"吸血鬼",race:"吸血鬼",desc:"穆露奈依特帝国第七部队（加德斯布拉德队）第六班·特殊班班长，军校毕业时以品行SS、礼仪SS等多项SS成绩被评为优等生，性格认真，是队里少有的正常人。",story:"作为缇拉鞠的部下在第七部队任职；小说后期剧情中缇拉鞠一行四人曾造访艾丝蒂尔老家经营的温泉旅馆。",images:["吸血鬼/11_艾丝蒂尔.jpg"],tags:["优等生","认真"]},
{id:82,name:"佩特萝丝·卡拉玛丽娜",source:"家里蹲吸血公主的郁闷",type:"吸血鬼",race:"吸血鬼",desc:"穆露奈依特帝国军第一部队队长，七红天大将军之一，性格懒散，拥有烈核解放能力。",story:"统率穆露奈依特帝国军第一部队，为七红天大将军之一，参与七红天相关的帝国军务。",images:["吸血鬼/12_佩特萝丝.jpg"],tags:["懒散","大将军"]},
{id:83,name:"芙蕾蒂·玛斯卡雷尔",source:"家里蹲吸血公主的郁闷",type:"吸血鬼",cv:"杉山里穗",race:"吸血鬼",desc:"七红天第三部队队长，称号「黑色闪光」，橙发金瞳御姐，擅长黑暗魔法，性格严苛对自己和他人要求都高。",story:"七红天争霸战中与缇拉鞠部队冲突，部下曾突袭缇拉鞠军。",images:["吸血鬼/13_芙蕾蒂.jpg"],tags:["御姐","黑色闪光"]},
{id:84,name:"米莉森特·布露娜特",source:"家里蹲吸血公主的郁闷",type:"吸血鬼",cv:"雨宫天",race:"吸血鬼",desc:"及腰蓝发黄瞳巨乳美女，七红天五号，后加入恐怖组织「逆月」。对缇拉鞠怀有异常敌意。",story:"3年前袭击帝国学院事件的真凶，正是此事让缇拉鞠变成家里蹲；庆功宴上突然现身袭击缇拉鞠。",images:["吸血鬼/14_米莉森特.jpg"],tags:["反派","巨乳"]},
{id:85,name:"梅茜·贝利奇斯",source:"家里蹲吸血公主的郁闷",type:"吸血鬼",race:"吸血鬼",desc:"穆露奈依特帝国第六部队队长（七红天之一），后被朔奈·梅墨瓦鲁打倒，队长之位被其夺取。",story:"作为第六部队队长统领帝国军，在与朔奈·梅墨瓦鲁的较量中落败，第六部队队长与七红天之位由朔奈接任。",images:["吸血鬼/15_梅茜.jpg"],tags:["七红天","败北"]},
{id:86,name:"绯樱闲",source:"吸血鬼骑士",type:"吸血鬼",cv:"折笠富美子",race:"吸血鬼",desc:"纯血种Level A，绰号「狂咲姬」。银白及腰长发，绯红/粉红瞳，身穿和服，171cm。能力：操纵植物（令非花期之花开放）、消磨时间、治愈。玖兰李土的原未婚妻。",story:"被锥生家族猎杀爱人后向锥生家复仇；附身于红玛利亚活动；最终被玖兰枢所杀。",images:["吸血鬼/16_绯樱闲.jpg"],tags:["和服","狂咲姬"]},
{id:87,name:"早园瑠佳",source:"吸血鬼骑士",type:"吸血鬼",cv:"皆川纯子",race:"吸血鬼",desc:"Level B吸血鬼贵族，黑主学园夜间部，冷美人，自带贵族高贵沉稳气质。169cm，外见年龄17岁。",story:"对玖兰枢怀有注定无果的单恋，为此纠结悲伤。",images:["吸血鬼/17_早园瑠佳.jpg"],tags:["冷美人","贵族"]},
{id:88,name:"玖兰优姬",source:"吸血鬼骑士",type:"吸血鬼",cv:"堀江由衣",race:"吸血鬼",desc:"本作女主，152cm。对外是黑主理事长养女/风纪委员，实际是玖兰家纯血Level A爱女、玖兰枢的妹妹兼未婚妻。人类时期棕发及肩，觉醒后棕长及腰卷发、血红瞳。武器狩猎女神Artemis（可伸缩金属棍，觉醒后变镰刀状）。",story:"母亲树里以命封印其吸血鬼记忆使其作为人类成长；后觉醒恢复纯血身份。",images:["吸血鬼/18_玖兰优姬.jpg"],tags:["女主角","纯血种"]},
{id:89,name:"红玛利亚",source:"吸血鬼骑士",type:"吸血鬼",cv:"名冢佳织",race:"吸血鬼",desc:"被纯血种绯樱闲附身的贵族少女。",story:"绯樱闲借其身体潜入黑主学园接近锥生零；事件平息后，本性温柔的她与优姬等人结下友谊，回归平静的日常。",images:["吸血鬼/19_红玛利亚.jpg"],tags:["温柔","附身"],star:false},
{id:90,name:"玖兰树里",source:"吸血鬼骑士",type:"吸血鬼",cv:"国府田麻理子",race:"吸血鬼",desc:"玖兰优姬与玖兰枢的母亲，纯血种。褐色长发、深红眼眸，性格温柔坚韧，拥有强大咒术能力；与丈夫玖兰悠为亲生兄妹（玖兰族为保纯血血脉常行兄妹通婚）。为保护优姬不被玖兰李土抓走，以自己生命封印优姬作为吸血鬼的全部能力与记忆。",story:"十年前以自己的生命为代价封印优姬的吸血鬼能力与记忆；同年丈夫玖兰悠为保护优姬死于玖兰李土之手——夫妇二人的牺牲，换来了女儿十年的平静。",images:["吸血鬼/20_玖兰树里.jpg"],tags:["母亲","纯血种"]},
{id:91,name:"爱尔梅希尔德·卡恩斯坦",source:"恶魔高校D×D",type:"吸血鬼",race:"吸血鬼",desc:"卡蜜拉派（女性主导派阀）上级纯血吸血鬼贵族，150cm/42kg，8月28日生，金发白肤红眼，洋娃娃般可爱外表，性格高傲，歧视不纯血者。阳光直射时能力大幅下降。",story:"以和平协议为筹码要求莉雅丝提供加斯帕协助；后被兵藤一诚所救，喜欢上一诚并主动要求成为其眷属。",images:["吸血鬼/21_爱尔梅希尔德.jpg"],tags:["大小姐","高傲"]},
{id:92,name:"瓦雷莉·采佩什",source:"恶魔高校D×D",type:"吸血鬼",race:"吸血鬼",desc:"吸血鬼与人类混血美女，神灭具「幽世的圣杯」（三圣杯一套）持有者，加斯帕·弗拉迪的恩人。",story:"圣杯被兄长马利乌斯夺走用于强化采佩什派吸血鬼，本人昏迷；后被真圣杯碎片唤醒，邪龙战役后夺回圣杯复原；此后作为吉蒙里战队主教参加国际大赛，运用圣杯实施即时战场治疗。",images:["吸血鬼/22_瓦雷莉.jpg"],tags:["圣杯","混血"]},
{id:93,name:"蕾米莉亚·斯卡蕾特",source:"东方Project",type:"吸血鬼",race:"吸血鬼",desc:"活了500多年的吸血鬼，红魔馆主人，芙兰朵露的姐姐与监护人。淡蓝短发红瞳，背后巨大蝙蝠翼，身材如10-14岁少女。能力「操纵命运程度」，惧怕阳光出门必撑阳伞。原作官方游戏无固定CV，同人作品配音各异。",story:"红魔馆之主，红雾异变的元凶；与十六夜咲夜、红美铃、帕秋莉同居红魔馆。",images:["吸血鬼/images_9.jpg","吸血鬼/23_蕾米莉亚.jpg","吸血鬼/images_10.jpg","吸血鬼/images_16.jpg","吸血鬼/93_2.jpg","吸血鬼/93_3.jpg","吸血鬼/204_2.jpg"],tags:["大小姐","红魔馆"]},
{id:94,name:"芙兰朵露·斯卡蕾特",source:"东方Project",type:"吸血鬼",race:"吸血鬼",desc:"蕾米莉亚的妹妹，约495岁。金发金瞳幼女，头上带红色水晶翼饰。能力「破坏一切事物程度」，因暴走被长期禁足在红魔馆地下，鲜少外出。，CV=原作无官方CV（衍生作品配音：金元寿子、小仓唯等）",story:"东方红魔乡EXTRA BOSS，首次在红魔馆地下室被灵梦/魔理沙打倒后才得以外出。",images:["吸血鬼/images_11.jpg","吸血鬼/images_12.jpg","吸血鬼/images_13.jpg","吸血鬼/images_14.jpg","吸血鬼/images_15.jpg","吸血鬼/94_2.png","吸血鬼/94_4.jpg"],tags:["妹妹","破坏"]},
{id:95,name:"爱尔奎特·布伦史塔德",source:"月姬",type:"吸血鬼",cv:"长谷川育美（Remake/MELTY BLOOD/FGO）",race:"吸血鬼",desc:"167cm/52kg，B88/W55/H85。金发红瞳，真祖王族最后的公主，为狩猎堕落真祖而被人造出的「最强真祖」。不必吸血也不畏阳光，能力为「空想具现化」。性格天真傻气带点任性，旧版（MELTY BLOOD系列）为柚木凉香。",story:"800年间为消灭罗亚多次觉醒，平时沉睡千年城；被远野志贵杀死一次后实力弱化，转而要求其协助狩猎罗亚。",images:["吸血鬼/25_爱尔奎特.jpg"],tags:["真祖"]},
{id:96,name:"索菲·特瓦伊莱特",source:"隔壁的吸血鬼小妹",type:"吸血鬼",cv:"富田美忧",race:"吸血鬼",desc:"1651年生，360余岁。浅银白长发紫瞳美少女，哥特黑裙。超现代化死宅吸血鬼：网购血液、追新番打游戏、棺材里塞美少女抱枕，不袭击人类反而怕人。",story:"夜晚散步时捡到迷路的天野灯，从此与灯及好友们过上日常同居喜剧。",images:["吸血鬼/26_索菲.jpg","吸血鬼/96_1.png","吸血鬼/96_2.jpg","吸血鬼/96_3.jpg","吸血鬼/96_4.jpg"],tags:["死宅","哥特"]},
{id:97,name:"千堂瑛里华",source:"赤色的约定/FORTUNE ARTERIAL",type:"吸血鬼",cv:"神田理江（动画）/观村咲子（游戏）",race:"吸血鬼",desc:"160cm，金发碧眼，6月7日生B型。修智学院学生会副会长，学院人气第一的完美少女，文武双全，好奇心旺盛行动力过剩。真实身份为吸血鬼，但厌恶吸人血。",story:"身为「夜之一族」的吸血鬼，为防力量暴走而服用特殊药物抑制，与学园长及东仪家共同生活；在修智学院以学生会副会长身份活动。",images:["吸血鬼/27_千堂瑛里华.jpg"],tags:["学生会","完美少女"]},
{id:98,name:"赤夜萌香",source:"十字架与吸血鬼",type:"吸血鬼",cv:"水树奈奈",race:"吸血鬼",desc:"阳海学园美少女，表里双人格：表萌香粉长发温柔学霸；摘下发际十字架后切换为里萌香——银发红瞳身材成长（G罩杯90-58-88），「力量的大妖」等级吸血鬼。",story:"喜欢第一次直接吸血的青野月音；因表人格温柔想交朋友，里人格凶暴，靠十字架封印人格切换。",images:["吸血鬼/28_赤夜萌香.jpg"],tags:["双人格","大妖"]},
{id:99,name:"忍野忍",source:"化物语/伤物语",type:"吸血鬼",cv:"坂本真绫（动画）/平野绫（广播剧）",race:"吸血鬼",desc:"本名姬丝秀忒·雅赛劳拉莉昂·刃下心，活了598年的传说Kissshot。全盛期182cm金发红瞳御姐，被夺力量后沦为8岁金发金瞳萝莉，肌肤白皙、无影子无实体。",story:"四百年间一直在寻找自己的死地；被阿良良木历救下后眷属化，从此寄居历的影子里。",images:["吸血鬼/29_忍野忍.jpg","吸血鬼/99_3.jpg","吸血鬼/99_4.png"],tags:["萝莉","御姐"]},
{id:100,name:"黎榭莉亚·雷·克里斯塔利亚",source:"圣剑学院的魔剑使",type:"吸血鬼",cv:"石川由依（动画）/东山奈央（游戏）",race:"吸血鬼",desc:"15岁，克里斯塔利亚公爵家千金，圣剑学院第十八小队队长。为救雷欧尼斯而丧命，被复活成最上位不死者「吸血鬼女王」。",story:"探索死都遗迹时唤醒沉睡的雷欧，后以其监视者兼未婚妻身份共同战斗。",images:["吸血鬼/30_黎榭莉亚.jpg","吸血鬼/100_1.jpg","吸血鬼/100_2.jpg","吸血鬼/100_3.jpg","吸血鬼/100_4.jpg"],tags:["吸血鬼女王","队长"]},
{id:101,name:"伊琳娜·卢米涅斯克",source:"月与莱卡与吸血公主",type:"吸血鬼",cv:"林原惠美",race:"吸血鬼",desc:"利里特国出身纯血吸血鬼，蓝发前刘海泛白，尖耳赤瞳，皮肤苍白。从小梦想登月成为宇航员，却有恐高症。作为「诺斯费拉图计划」实验体被送上太空。",story:"在监视官列夫训练下克服恐高，作为人类历史上第一个飞上太空的吸血鬼。",images:["吸血鬼/31_伊琳娜.jpg","吸血鬼/101_4.png"],tags:["宇航员","纯血种"]},
{id:102,name:"吉田友纪",source:"这样算是僵尸吗？",type:"吸血鬼",cv:"金元寿子",race:"吸血鬼",desc:"与瑟拉芬同为吸血忍者一族少女，相川步的同班同学。本名吉田友纪，因性格男性化自称トモノリ（友纪）。第二季《这是僵尸吗？OF THE DEAD》中的主要角色。",story:"吸血忍者村出身，借由吸人血获得年轻与力量；在第二季《OF THE DEAD》中作为主要角色活跃。",images:["吸血鬼/32_吉田友纪.jpg","吸血鬼/103_1.jpg"],tags:["吸血忍者","假小子"]},
{id:103,name:"瑟拉芬",source:"这样算是僵尸吗？",type:"吸血鬼",cv:"日笠阳子",race:"吸血鬼",desc:"身材丰满的吸血忍者，黑发马尾。秘剑「燕返」使用者，能将树叶化为刀刃。",story:"萨拉丝巴蒂的部下，保守派吸血忍者；因步的臀部而喜欢上他。",images:["吸血鬼/33_瑟拉芬.jpg"],tags:["吸血忍者","马尾"]},
{id:104,name:"萨拉丝巴蒂",source:"这样算是僵尸吗？",type:"吸血鬼",cv:"合田彩",race:"吸血鬼",desc:"保守派吸血忍者指挥官，瑟拉芬的直属上司，人间假名为「星川辉罗罗」，与步同校学生。表面严格固执，实际在网上做偶像。",story:"非常喜欢步的臀部。",images:["吸血鬼/34_萨拉丝巴蒂.jpg","吸血鬼/104_3.jpg"],tags:["吸血忍者","偶像"]},
{id:105,name:"依文洁琳·AK·麦道威尔",source:"魔法老师/悠久持有者",type:"吸血鬼",cv:"松冈由贵",race:"吸血鬼",desc:"约600-700岁真祖吸血鬼，金发130cm萝莉外形（67/48/63）。与纳吉·史普林菲尔德齐名的最强魔法使，人称「暗黑福音」「Maga Nosferatu」。续作《悠久持有者》化名雪姬，以成年金发御姐姿态登场。",story:"15年前被涅吉父亲下「上学地狱」诅咒无法离开麻帆良学园；后创立UQ Holder不死者组织。",images:["吸血鬼/35_依文洁琳.jpg"],tags:["真祖"]},
{id:106,name:"伊丽莎白",source:"想要成为影之实力者！",type:"吸血鬼",cv:"早见沙织",race:"吸血鬼",desc:"「血之女王」异名的吸血鬼始祖，红发黑裙哥特御姐；约千年前毁灭数国后据传已消亡，其部下克利姆森在无法都市暗跃。",story:"心脏用肉体容器复活后被奥萝拉附身的克蕾娅击退，后遭暗影击败；事后与梅丽一同踏上旅程寻找「安息之地」。",images:["吸血鬼/36_伊丽莎白.jpg"],tags:["血之女王","哥特"]},
{id:107,name:"梅丽",source:"想要成为影之实力者！",type:"吸血鬼",cv:"加隈亚衣",race:"吸血鬼",desc:"曾经的吸血鬼真祖。千年前是伊丽莎白的部下，身为吸血鬼却以「吸血鬼猎人」身份行动，与血之暴走、赤之塔有关。",story:"千年前作为伊丽莎白的部下活动，与伊丽莎白结伴踏上寻找「安息之地」的旅程。",images:["吸血鬼/0b55b319ebc4b74543a9b0287da009178a82b901bfc3.webp"],tags:["真祖"]},
{id:108,name:"露露西·露",source:"异世界悠闲农家",type:"吸血鬼",cv:"下地紫野",race:"吸血鬼",desc:"数百岁银发长发吸血姬，能自由改变身体大小（年龄），擅长魔法能飞，喜欢番茄。",story:"在森林里与村主火乐相遇后共同生活，成为村长夫人；能自由改变身体大小（外表年龄）的她，常以幼女或成人形态穿梭于村里的日常，是村中最有仙气的住户。",images:["吸血鬼/38_露露西.jpg","吸血鬼/14_1.jpg"],tags:["吸血姬","番茄"]},
{id:109,name:"真红杏树",source:"增血鬼果林",type:"吸血鬼",cv:"猪口有佳（动画）/下屋则子（游戏）",race:"吸血鬼",desc:"真红家幺女，果林的妹妹（1992年6月6日生）。银白长卷发哥特黑裙，金瞳，端庄优雅的吸血鬼美少女。",story:"真红家的小女儿，与姐姐果林、哥哥真红炼一起在人间过着伪装的普通人生活。",images:["吸血鬼/39_真红杏树.jpg"],tags:["妹妹","哥特"]},
{id:110,name:"桐敷沙子",source:"尸鬼",type:"吸血鬼",cv:"大浦冬华",race:"吸血鬼",desc:"外表13岁哥特萝莉，黑/深紫波浪长发齐刘海，暗红空洞大眼，脸色苍白洋娃娃般脸庞，常穿繁复蕾丝哥特洋装。实际是尸鬼宗主，活了极长岁月。",story:"自称患SLE不能晒太阳，实为兼正洋房尸鬼一家的宗主；喜欢结城夏野的小说，夜里穿蕾丝裙独自活动；最终被村人识破存在。",images:["吸血鬼/40_桐敷沙子.jpg"],tags:["尸鬼","哥特萝莉"]},
{id:111,name:"华法琳",source:"明日方舟",type:"吸血鬼",cv:"石见舞菜香（日）/格林（中）",race:"吸血鬼",desc:"157cm，银发尖耳赤瞳，6月27日生，出身卡兹戴尔。罗德岛元老医疗部门话事人，血液学专科医生，疯狂研究员。",story:"萨卡兹血魔分支原型为吸血鬼，能操控血液、把血炼成宝石；被其他干员用来吓唬不听话的小孩。",images:["吸血鬼/41_华法琳.jpg","吸血鬼/111_1.jpg","吸血鬼/111_2.jpg","吸血鬼/111_3.jpg"],tags:["医生","萨卡兹"]},
{id:112,name:"莉萝·艾",source:"Bloodline 血族",type:"吸血鬼",cv:"山新（中）",race:"吸血鬼",desc:"1510年生，158cm，B77/W55/H78，白发红瞳双马尾萝莉，外号「纯白恶魔」。血族最后的元老拉斯特之女。",story:"北极圈与圣地决战后流浪人间寻父；与夜壬同居黑塔帮其学习魔法；被战争姬念刃打伤后觉醒新异能。",images:["吸血鬼/42_莉萝艾.jpg"],tags:["萝莉","血族"]},
{id:113,name:"高城千砂",source:"羊之歌",type:"吸血鬼",cv:"林原惠",race:"吸血鬼",desc:"黑长直和服少女，高城家继承家族「吸血病」的悲剧女主。",story:"弟弟高城一砂患有高城家遗传的嗜血怪病返乡后，姐弟在宿命与病痛中相互依存，文艺致郁向悲剧。",images:["吸血鬼/43_高城千砂.jpg"],tags:["和服","悲剧"]},
{id:114,name:"叶月",source:"月咏-MOON PHASE-",type:"吸血鬼",cv:"斋藤千和",race:"吸血鬼",desc:"紫发尖耳猫耳吸血鬼少女，初源吸血鬼伯爵之女。被社会隔绝长大，性格要强任性根上却是怕寂寞。",story:"为吸血找上摄影师森丘耕平，后相恋，从此随他在城市生活。",images:["吸血鬼/44_叶月.jpg"],tags:["猫耳","任性"]},
{id:115,name:"Diva",source:"BLOOD+",type:"吸血鬼",cv:"矢岛晶子",race:"吸血鬼",desc:"黑长发蓝瞳，音无小夜的双胞胎妹妹，始祖翼手女王。",story:"与小夜对立的存在，歌声能驱使翼手；BLOOD+主线大BOSS。",images:["吸血鬼/45_Diva.jpg"],tags:["女王","反派"]},
{id:116,name:"美夕",source:"吸血姬美夕",type:"吸血鬼",cv:"长泽美树",race:"吸血鬼",desc:"金瞳和服黑发少女，「监视者」神魔的吸血鬼主人。",story:"以神魔为食，负责把逃跑神魔送回黑暗；表面普通少女实则背负宿命。",images:["吸血鬼/46_美夕.jpg","吸血鬼/116_1.jpg","吸血鬼/116_3.jpg"],tags:["和服","监视者"]},
{id:117,name:"紫苑·艾尔特拉姆·阿特拉西亚",source:"MELTY BLOOD/月姬",type:"吸血鬼",cv:"夏树理绪",race:"吸血鬼",desc:"161cm/48kg，浅紫长发紫瞳麻花辫，阿特拉斯学院天才炼金术师。因实验被注入死徒化因子而成为死徒。",story:"为解自己死徒化之法而行动，MELTY BLOOD主角之一。",images:["吸血鬼/47_紫苑.jpg"],tags:["炼金术师","死徒"]},
{id:119,name:"莎缇拉",source:"Re:从零开始的异世界生活",type:"魔女",cv:"高桥李依（与爱蜜莉雅同一声优，动画未单独署名）",race:"魔女",desc:"「嫉妒魔女」。银发半精灵，紫绀瞳，容貌与爱蜜莉雅一模一样，黑袍笼罩。嫉妒权能——吞噬一切，被她选中的事物会被黑洞般吞噬；吞噬了其他大罪魔女的权能。",story:"吞噬整个世界的嫉妒之力；对菜月昴说出「我爱你」。与昴在梦中相遇时，黑发黑瞳的「第二个爱蜜莉雅」形象令人印象深刻。",images:["魔女/莎缇拉_1.png","魔女/莎缇拉_2.png","魔女/莎缇拉_3.png","魔女/119_1.jpg","魔女/119_2.jpg","魔女/119_3.jpg"],tags:["嫉妒魔女","银发"]},
{id:120,name:"艾姬多娜",source:"Re:从零开始的异世界生活",type:"魔女",cv:"坂本真绫",race:"魔女",desc:"「强欲魔女」。白长发过腰，紫瞳，黑紫紧身裙，蝴蝶发饰，知性优雅。强欲权能——全知的智慧，能读取世间一切知识；契约能力，与她签订契约者可获得知识但需付出代价。",story:"圣域篇中与菜月昴喝下午茶，以「我的知识是无限的」引诱昴签订契约。",images:["魔女/02_艾姬多娜.jpg","魔女/Echidna1.webp","魔女/images.jpg","魔女/images_1.jpg","魔女/images_2.jpg","魔女/images_3.jpg","魔女/images_4.jpg","魔女/images_5.jpg","魔女/120_1.png","魔女/120_3.jpg"],tags:["强欲魔女","知性","魔女茶会"]},
{id:121,name:"瑟莉卡·阿尔佛涅亚",source:"不正经的魔术讲师与禁忌教典",type:"魔女",cv:"喜多村英梨",race:"魔女",desc:"「灰烬魔女」。金长发双马尾，红瞳，黑色拖地长裙，哥特风。外表年轻实际约400岁，魔术师最高位阶「第七阶梯」的大魔术师，阿尔扎诺帝国魔术学院教授。",story:"格伦的养母兼魔术师师父，以一人之力可压制整个魔术学院的存在；与问题儿童弟子格伦吵吵闹闹的师徒日常是本作一大看点。",images:["魔女/e4478058d88345dcb8ef8e8458dd337e~tplv-xv4ileqgde-resize-w_360.jpg","魔女/03_瑟莉卡.jpg"],tags:["灰烬魔女","教授"]},
{id:122,name:"奥萝拉",source:"我想成为影之强者！",type:"魔女",cv:"名冢佳织",race:"魔女",desc:"「灾厄魔女」。紫长发，黑色紧身战衣，妖娆成熟。给世界带来破坏与混乱的传说级人物，其正体被指与约千年前的魔人狄亚波罗斯有关。",story:"传说中毁灭世界的「灾厄之魔女」，暗影庭园追寻的目标；动画14话中在圣域与希德（克莱德）再会。",images:["魔女/04_奥萝拉.jpg"],tags:["灾厄魔女","反派"]},
{id:123,name:"爱丽丝莉洁·露·涅比利斯九世",source:"你与我最后的战场，亦或是世界起始的圣战",type:"魔女",cv:"雨宫天",race:"魔女",desc:"「冰祸魔女」。白金长发，红瞳，白裙蓝玫瑰装饰。涅比利斯皇厅第二王女（17岁），强力的冰之星灵使，被帝国畏称为「冰祸之魔女」，号称皇厅最强。",story:"战场上与帝国剑士伊斯卡相遇，剑与魔法的宿命对决就此展开；第1期ED《冰之鸟笼》由雨宫天以爱丽丝莉洁名义演唱。",images:["魔女/05_爱丽丝莉洁.jpg"],tags:["冰祸魔女","王女"]},
{id:124,name:"席尔薇雅·琉奈海姆",source:"学战都市Asterisk",type:"魔女",cv:"千菅春香",race:"魔女",desc:"「战律魔女」（戦律の魔女）。淡紫长发，偶像级美貌的演出服歌姬。奎恩薇尔女学园学生会长、学园序列一位，世界闻名的顶级歌姬；持有纯星煌式武装《福尔克范格》。",story:"以歌声为媒介施展「战律」魔法的世界级歌姬，学园祭演唱会与战斗结合的舞台是她的主场。",images:["魔女/06_席尔薇雅.jpg"],tags:["战律魔女","歌姬"]},
{id:125,name:"南宫那月",source:"噬血狂袭",type:"魔女",cv:"金元寿子",race:"魔女",desc:"「空隙的魔女」。黑长直，蓝瞳，哥特萝莉风，紫边伞帽。弦神岛监狱结界的管理者，感应力魔法的达人。",story:"看守监狱结界的魔女，曾多次把违规的古城关进结界「补习」；过去曾与仙都木阿夜敌对并封印之。",images:["魔女/07_南宫那月.jpg","魔女/images_6.jpg","魔女/images_7.jpg","魔女/images_8.jpg"],tags:["空隙的魔女","监狱长"]},
{id:126,name:"仙都木阿夜",source:"噬血狂袭",type:"魔女",cv:"高桥美佳子",race:"魔女",desc:"「书记的魔女」（書記（ノタリア）の魔女）。黑长直，紫白和服，和风美人。代代魔导师家系出身的纯血魔女，统领魔术犯罪组织LCO（图书馆），过去与南宫那月敌对而被囚于监狱结界。",story:"被囚于监狱结界的最强魔女之一；其女儿（复制体）仙都木优麻为「苍蓝之魔女」，母女的存在是监狱结界篇的核心。",images:["魔女/OIP-C.webp"],tags:["书记魔女","反派"]},
{id:127,name:"伊蕾娜",source:"魔女之旅",type:"魔女",cv:"本渡枫",race:"魔女",desc:"「灰之魔女」。灰白长发，紫瞳，黑魔女帽+白衬衫黑裙+黑斗篷，骑扫帚旅行。15岁便取得魔法使最高位「魔女」称号的天才少女，自称屑魔女。",story:"自称「我是伊蕾娜，灰之魔女」环游世界；2021年第14届国际最萌大会（世萌）冠军。动画播出时「眼镜伊蕾娜」「暗黑伊蕾娜」等22个伊蕾娜全部由本渡枫一人配音成为话题，2026年1月官宣新作剧场版。",images:["魔女/images_12.jpg","魔女/images_9.jpg","魔女/images_10.jpg","魔女/images_11.jpg","魔女/images_13.jpg","魔女/images_14.jpg","魔女/127_4.jpg"],tags:["灰之魔女","旅行"]},
{id:128,name:"缇娜夏",source:"无名记忆",type:"魔女",cv:"种崎敦美",race:"魔女",desc:"「青月魔女」（青き月の魔女）。深蓝黑长发，紫瞳，黑高开衩裙，黑丝长靴。大陆上最强大魔力的持有者，栖于荒野之塔的最上层。",story:"栖居荒野之塔最上层，只有克服重重试炼登顶者才能向她许愿。奥斯卡为解开「无法留下子嗣的诅咒」造访魔女之塔，两人围绕彼此的羁绊展开跨越岁月的故事。",images:["魔女/10_缇娜夏.jpg","魔女/128_2.jpg","魔女/128_4.jpg"],tags:["青月魔女","最强魔力"]},
{id:129,name:"莫妮卡·艾瓦雷特",source:"Silent Witch 沉默魔女的秘密",type:"魔女",cv:"会泽纱弥",race:"魔女",desc:"「沉默魔女」（沈黙の魔女）。金棕长发，兜帽斗篷，安静系少女。因在人前说不出话而练成人类首个无咏唱咒文，15岁便入选「七贤人」的天才魔女。",story:"极怕生的天才引きこもり魔女，被塞进极秘任务转入塞伦迪亚学园——在第二王子菲利克斯本人毫无察觉的情况下秘密护卫他；性格胆小怯懦，实力却是最强。",images:["魔女/11_莫妮卡.jpg","魔女/129_2.png","魔女/129_3.jpg","魔女/129_4.jpg"],tags:["沉默魔女","怕生"]},
{id:130,name:"亚梓莎",source:"持续狩猎史莱姆三百年",type:"魔女",cv:"悠木碧",race:"魔女",desc:"「高原的魔女」。金长发，蓝瞳，黑魔女帽，17岁容貌的不老不死魔女。前世是27岁过劳死的社畜OL，经女神转生到异世界；持续狩猎史莱姆300年不知不觉达到等级上限。",story:"社畜OL过劳死后，经女神之手转生为17岁容貌的不老不死高原魔女；因前世记忆憎恨加班、只求安稳，靠持续狩猎史莱姆300年不知不觉升到等级上限，悠闲生活却总被打破。",images:["魔女/12_亚梓莎.jpg"],tags:["高原魔女","不老不死"]},
{id:131,name:"零",source:"从零开始的魔法书",type:"魔女",cv:"花守由美里",race:"魔女",desc:"「泥暗之魔女」。银白长发，白黑短打，神秘魔女。禁忌魔书《零之书》的作者——在魔术普及而「魔法」尚不为人知的世界，唯有此书蕴含魔法的真髓。",story:"《零之书》被盗后踏上寻书之旅，途中请半人半兽的「獣堕ち」佣兵担任护卫，条件是以自己的魔法之力让他恢复人形；两人一路追查盗书的魔术师「十三番」。",images:["魔女/13_零.jpg","魔女/131_1.jpg","魔女/131_3.jpg","魔女/131_4.jpg","魔女/132_1.png"],tags:["泥暗魔女","零之书"]},
{id:132,name:"芙兰",source:"魔女之旅",type:"魔女",cv:"花泽香菜",race:"魔女",desc:"「星屑魔女」。黑长直发，蓝瞳，星空纹魔女帽。伊蕾娜的魔法师父，温柔注视着她成长。星屑魔法——星辰系魔法。",story:"伊蕾娜的师父，传授了她魔女的修行；动画第5话中师徒再会。其师承可上溯至伊蕾娜的母亲。",images:["魔女/14_芙兰.jpg","魔女/132_2.png","魔女/132_3.jpg","魔女/132_4.jpg"],tags:["星屑魔女","师父"]},
{id:133,name:"潘朵拉",source:"Re:从零开始的异世界生活",type:"魔女",cv:"钉宫理惠",race:"魔女",desc:"「虚饰魔女」。银白长发蓝瞳，白色宽松连衣裙配蓝色丝带，赤脚。虚饰权能——操控现实、改写事实的大罪魔女。",story:"操纵一切的幕后黑手，大罪魔女教团的核心人物；动画第二季中于爱蜜莉雅的回忆里现身，亲手改写了艾姬多娜等人的命运。",images:["魔女/索雷娜_1.jpg","魔女/索雷娜_2.jpg","魔女/索雷娜_3.jpg","魔女/索雷娜_4.jpg","魔女/133_1.jpg","魔女/133_2.jpg","魔女/133_4.jpg"],tags:["魔女","虚饰"]},
{id:134,name:"贝阿朵莉切",source:"海猫鸣泣之时",type:"魔女",cv:"大原沙耶香",race:"魔女",desc:"「黄金与无限的魔女」（黄金と無限の魔女）。金发碧眼，黑色礼服缀红玫瑰，黄金蝶环绕，自称「妾」。活了千年的魔女，拥有把一个人「无限次杀死」的力量。",story:"六轩岛连续杀人事件的核心，反复上演「无限杀戮」的怪奇戏码，与战人展开猫箱推理对决；其真身与安田纱代及右代宫家的悲剧密不可分。",images:["魔女/134_2.jpg","魔女/16_贝阿朵莉切.jpg"],tags:["黄金魔女","无限"]},
{id:135,name:"爱丽丝",source:"原神",type:"魔女",cv:"井上喜久子（日）/张琦（中）",race:"魔女",desc:"「魔女会」元老成员，代号A。金长发长辫，红瞳，红白配色中国风服饰，精灵耳。可莉（火花骑士）之母、阿贝多的监护人、《提瓦特游览指南》作者，人称「诸世界的大冒险家」",story:"行踪如风般难以捉摸的传奇旅行家，多次为旅行者指引方向；2025年7月随剧情PV「魔女的茶会」正式露脸登场。",images:["魔女/魔女替换_1.jpg","魔女/135_1.jpg","魔女/135_2.jpg"],tags:["原神","魔女会"]},
{id:136,name:"美狄亚",source:"Fate/stay night",type:"魔女",cv:"田中敦子",race:"魔女",desc:"「背叛之魔女」（裏切りの魔女）。浅紫长发，尖耳，紫袍法杖。第五次圣杯战争的Caster，以高速神言驱动大魔术，宝具「Rule Breaker」可破除一切魔术与契约。",story:"希腊神话中被伊阿宋背叛的科尔基斯公主；圣杯战争中占据柳洞寺为根据地，与葛木宗一郎缔结契约相依；FGO中亦有登场。",images:["魔女/18_美狄亚.jpg","魔女/136_1.jpg"],tags:["背叛魔女","Caster"]},
{id:137,name:"尤莉丝",source:"学战都市Asterisk",type:"魔女",cv:"加隈亚衣",race:"魔女",desc:"「华焰魔女」（華焔の魔女，グリューエンローゼ）。玫瑰粉长发，碧瞳，白红校服。自在操焰的魔女，星导馆学园序列五位，实力在学战都市屈指可数。",story:"雷斯菲尔德小国的公主，本作女主角之一；与天雾绫斗组队出战《凤凰星武祭》争夺优胜。",images:["魔女/19_尤莉丝.png"],tags:["华焰魔女","公主"]},
{id:138,name:"尼可",source:"原神",type:"魔女",cv:"丰口惠美（日）/云鹤追（中）",race:"魔女",desc:"「魔女会」成员，代号N，别称「记忆女巫」。金长直发，白蓝圣女装。未退化为仙灵、以人类形态生活至今的天使；因天使一族向天理举起叛旗而无法开口说话，官方称号「The Silent Mage, the Voiceless Angel」。",story:"无法言语的魔女，转而以特殊方式与人交流；角色PV《缄口的金弦》讲述其过往，6.6版本作为魔女会首位可玩角色实装。",images:["魔女/20_尼可.jpg"],tags:["魔女会","缄默"]},
{id:139,name:"贞德Alter",source:"FGO",type:"龙之巫女",cv:"坂本真绫",race:"魔女",desc:"「龙之魔女」（竜の魔女）。金白发，黑甲黑旗，黑化圣女。Avenger职阶，性情别扭但根性认真，可召唤魔龙。",story:"奥尔良特异点中率领魔龙与复仇军团的黑化圣女，挥舞漆黑旗帜与「白贞德」对峙；FGO情人节活动等剧情中亦有活跃表现。",images:["魔女/21_贞德Alter.jpg","魔女/139_1.jpg","魔女/139_2.jpg","魔女/139_3.jpg","魔女/139_4.jpg"],tags:["龙之魔女","黑化"]},
{id:140,name:"奥古斯特·冯·帕塞瓦尔",source:"碧蓝航线",type:"魔女",cv:"立花理香",race:"魔女",desc:"灰紫长发，黑红哥特装束，羊角状舰装。碧蓝航线铁血所属空母，特别计划舰（第4期）；性格沉稳，擅长人心掌控，以让挣扎于命运之人惨败为乐。",story:"特殊航空弹幕可将敌舰完全停止的强力空母；2024年11月上线「魔女」主题换装。",images:["魔女/BLHX_奥古斯特·冯·帕塞瓦尔皮肤国际服官宣图.jpg","魔女/140_2.jpg","魔女/140_3.png"],tags:["铁血","空母"]},
{id:141,name:"帕秋莉·诺蕾姬",source:"东方Project",type:"魔女",race:"魔女",desc:"「不动的大图书馆」（官方称号）。粉紫长直发，条纹睡帽风睡衣装，昵称「姆Q」。红魔馆大图书馆的司书魔女，操纵木火土金水加日月七曜魔法，体弱多病、深居书库。，CV=原作无官方CV（衍生作品配音各异，如清都亚里沙《东方LostWord》）",story:"常年栖身红魔馆大图书馆的病弱魔女，以七曜魔法与华丽弹幕著称；与主人蕾米莉亚、女仆十六夜咲夜同住红魔馆。",images:["魔女/23_帕秋莉.jpg","魔女/141_2.png"],tags:["大图书馆","七曜魔法"]},
{id:142,name:"久远寺有珠",source:"魔法使之夜",type:"魔女",cv:"花泽香菜（剧场版动画）",race:"魔女",desc:"「现代的魔女」。深紫短发，黑长袖连衣裙，成熟优雅，苍崎青子的搭档。现代魔法——童话使魔与概念武装。",story:"魔法使之夜双女主之一，久远寺洋馆的主人；与苍崎青子搭档，以童话般的使魔施展「现代魔法」守护三咲町的夜晚。ufotable剧场版动画2026年11月20日公开。",images:["魔女/24_久远寺有珠.jpg"],tags:["现代魔女","使魔"]},
{id:143,name:"伊丽莎白·巴托里",source:"FGO",type:"龙娘",cv:"大久保瑠美",race:"魔女",desc:"「鲜血魔女」。粉红长发，龙角龙尾，自称吸血鬼伯爵。FGO中的Lancer职阶，以毁灭性的歌声为武器的年轻魔王。",story:"鲜血城堡的年轻歌姬魔王，音痴级歌声即是攻击手段；与「魔人卡蜜拉」（其成年形态）的对手戏是FGO剧情名场面。",images:["魔女/25_伊丽莎白.jpg"],tags:["FGO","歌姬"]},
{id:144,name:"丽塔·洛丝薇瑟",source:"崩坏3",type:"魔女",cv:"悠木碧（日）/蒋丽（中）",race:"魔女",desc:"「冥府魔女」（失落迷迭装甲）。金长卷发，紫玫瑰，女仆装。女武神丽塔·洛丝薇瑟的量子属性装甲「失落迷迭」，以近距离雷电伤害为主，战斗中可役使猎犬协同作战。",story:"崩坏3 4.2版本（2020年8月）登场的S级女武神装甲，兼顾自身输出与全队元素增伤；同装甲自带「冥府」主题的猎犬召唤演出。",images:["魔女/26_丽塔.jpg","魔女/144_4.jpg"],tags:["崩坏3","女武神"]},
{id:145,name:"露娜",source:"毒菇魔女（シャンピニオンの魔女）",type:"魔女",cv:"白石晴香",race:"魔女",desc:"「毒菇魔女」。黑长直，红帽白袍。居住在漆黑森林的年轻魔女，与毒蘑菇同住，因「黑魔女」的身份被世人畏惧，实则心地善良。",story:"被城镇的人们畏惧地称作「蘑菇魔女」，与毒蘑菇相伴的孤独而温柔的日常；2026年1月起在TBS・BS11播出（初回1小时特别篇）。",images:["魔女/145_2.jpg","魔女/27_露娜.jpg"],tags:["毒菇魔女","温柔"]},
{id:146,name:"久远崎彩祸",source:"国王的求婚",type:"魔女",cv:"高桥李依",race:"魔女",desc:"「世界最强魔女」。银白长发，黑哥特裙，天使翼。持续拯救世界的最强魔女，魔术师学园〈空隙之庭园〉的学园长。",story:"在这个每300小时遭遇一次灭亡危机的世界里持续拯救世界的「最强魔女」；因重伤与玖珂无色合为一体，让他继承了自己的力量与身体。TV动画制作已于2025年10月宣布。",images:["魔女/28_久远崎彩祸.jpg"],tags:["最强魔女","学园长"]},
{id:147,name:"佩特拉·雷蒂",source:"Re:从零开始的异世界生活（阿尔篇）",type:"魔女",race:"魔女",desc:"「忧郁魔女」。银金渐变长直发，绿瞳，白紫兔耳饰，白蓝连衣裙持发光法杖，清冷优雅。阿尔篇（Web小说第十章）以「忧郁」权能登场的大罪魔女。",story:"阿尔篇中的冲击性展开：曾为昴家茶会小女仆的佩特拉获得「忧郁」魔女因子，自称「忧郁之魔女佩特拉·雷蒂」，以忧郁权能分割战场，并向世界起源欧德·拉格纳支付大量「可能性」为代价。",images:["魔女/29_佩特拉.jpg"],tags:["忧郁魔女","大罪"]},
{id:148,name:"莱茵多特",source:"原神",type:"魔女",cv:"山口由里子（日）/狄菲菲（中）",race:"魔女",desc:"「黄金」。魔女会代号R的元老，坎瑞亚五大罪人之一、王国四柱中炼金术的代表。吞噬「生之执政」纳贝里士后的形象为及膝长发、发色由金渐变至橘红，右鬓卷发呈DNA状。阿贝多的制作者（母亲）兼师父，与艾莉丝交好。幕间PV一人分饰与纳贝里士的双重人格",story:"曾为坎瑞亚首席炼金术师，制造出杜林等大量漆黑魔兽；5.6版本幕间剧情中现身，与冰之女皇会面，并吞噬纳贝里士、取得身体控制权。",images:["魔女/148_2.jpg","魔女/30_莱茵多特.jpg","魔女/148_1.jpg","魔女/148_4.jpg"],tags:["魔女会","炼金术"]},
{id:149,name:"桃乐丝",source:"魔兵传奇MAR",type:"魔女",cv:"中岛沙树",race:"魔女",desc:"粉红发双麻花辫，黑裙魔女。卡尔迪亚出身的魔女，风之使者，使用ARM作战，约17岁。",story:"动画第23话「恐怖的魔女！桃乐丝!!」迎来初阵，以风之魔法与ARM展现强大实力。",images:["魔女/149_3.jpg","魔女/31_桃乐丝.jpg"],tags:["风之使者","MAR"]},
{id:150,name:"卡拉",source:"罗德岛战记",type:"魔女",cv:"榊原良子",race:"魔女",desc:"「灰色魔女」。黑长发，黑袍，金色头饰。500多年前古代魔法王国卡斯特乌尔的魔术师之一，以灵魂转移（凭依他人身体）存续至今，司掌罗德岛战局的「均衡」。",story:"罗德岛战记开篇故事《灰色魔女》即以其为名；并非单纯的恶役，而是暗中操纵战局、维持「均衡」的谜之魔女。",images:["魔女/32_卡拉.jpg"],tags:["灰色魔女","均衡"]},
{id:151,name:"索雷娜",source:"从零开始的魔法书（魔法使黎明期）",type:"魔女",cv:"榊原良子",race:"魔女",desc:"「咏月魔女」。浅金长辫，绿袍，森系。拥有「咏月」异名的伟大魔女，魔法学校学长的阿尔巴斯之祖母。",story:"出自《从零开始的魔法书》（2017年动画登场）；续作《魔法使黎明期》中其「咏月」异名与才能由孙女阿尔巴斯继承，短篇《黎明之魔女》描绘了祖孙二人的往事。",images:["魔女/33_索雷娜.jpg"],tags:["魔女","咏月"]},
{id:152,name:"密涅瓦",source:"Re:从零开始的异世界生活",type:"魔女",cv:"小松未可子",race:"魔女",desc:"「愤怒魔女」。金发高马尾，白紫战斗服。愤怒权能——以「愤怒」为媒介，用殴打把伤者的伤势转移治愈。",story:"拳打脚踢治愈一切伤痛——被她揍得越狠，伤好得越快的奇特权能；魔女茶会上总是最先挥拳的那一个。",images:["魔女/34_密涅瓦.jpg"],tags:["愤怒魔女","治愈"]},
{id:153,name:"赛赫麦特",source:"Re:从零开始的异世界生活",type:"魔女",cv:"中原麻衣",race:"魔女",desc:"「怠惰魔女」。赤紫长发，黑紫露肩装，气质慵懒的美女（官方角色介绍）。怠惰权能——让人停止思考与活动。",story:"连呼吸都觉得苦恼的怠惰化身，大罪魔女中实力顶级的强者；在魔女茶会上以昏昏欲睡的姿态接见昴。",images:["魔女/35_赛赫麦特.jpg","魔女/152_1.png","魔女/153_1.jpg","魔女/153_2.png"],tags:["怠惰魔女","魔女茶会"]},
{id:154,name:"萝·库里斯塔斯",source:"魔法使黎明期（从零开始的魔法书续作）",type:"魔女",cv:"冈咲美保",race:"魔女",desc:"「黎明之魔女」。金长发粉瞳，幼童外表，深蓝斗篷白裙。活了300年的魔女，第一人称「我」；将自身魔力尽数交给吸食魔力的恶魔「卢登斯之杖」并与之契约。",story:"外表如幼女、实则已跨越300年时光的「黎明之魔女」；因与恶魔魔杖「卢登斯之杖」的契约而失去自身魔力，成为《魔法使黎明期》故事的关键人物。",images:["魔女/36_萝.jpg"],tags:["黎明魔女","幼态"]},
{id:155,name:"火火里绫火",source:"魔女的使命",type:"魔女",cv:"瀬戸麻沙美",race:"魔女",desc:"「工房魔女」。黑长直，大小姐气质，黑校服。风见学园的「公主殿下」，守护工房的魔女，拥有压倒性的魔力与战斗力。",story:"平凡高中生多华宫仄遭「塔之魔女」魔法袭击之际，以魔法救下他的正是这位学园公主；此后将仄带入工房贴身保护，与来袭的塔之魔女们展开攻防。",images:["魔女/37_火火里绫火.jpg"],tags:["工房魔女","大小姐"]},
{id:156,name:"Chloe",source:"直到某魔女死去",type:"魔女",cv:"种崎敦美",race:"魔女",desc:"「言の葉の魔女」。白发萝莉，白帽灰绿斗篷白袍，凉鞋，张牙舞爪元气脸。无法使用魔法的「半分精灵」，作为人与精灵的中介。",story:"魔法式典会场与梅格相遇的谜之少女，外表幼女实际已150岁+，是Faust的粉丝、七贤人之一。",images:["魔女/38_Chloe.jpg"],tags:["言之叶魔女","半精灵"]},
{id:157,name:"祈",source:"直到某魔女死去",type:"魔女",cv:"伊藤静",race:"魔女",desc:"「英知の魔女」。黑长直超长发过腰，绿瞳，黑橙魔女帽+开衩魔女裙，东洋出身。以知识与理论构筑魔法的七贤人之一，制药公司研究员。",story:"七贤人之一，以「英知」为名的理性派魔女；与Chloe等同伴守护着魔法世界的秩序。",images:["魔女/39_祈.jpg"],tags:["英知魔女","七贤人"]},
{id:158,name:"绫地宁宁",source:"魔女的夜宴",type:"魔女",cv:"桐谷华（种崎敦美的别名义）",race:"魔女",desc:"银白长直发紫瞳，黑校服蝴蝶结。柚子社Gal《魔女的夜宴》的女主角，与魔灵缔结契约的魔女。",story:"因特殊体质而与魔灵缔结契约的魔女，与主人公保科柊史的相遇让她的「愿望」开始转动；柚子社代表作女主。",images:["魔女/40_绫地宁宁.jpg","魔女/158_2.png","魔女/158_3.png","魔女/158_4.png"],tags:["Gal女主","魔女"]},
{id:159,name:"艾露迪",source:"魔女之泉3",type:"魔女",cv:"高野麻里佳（日・Re:Fine版）",race:"魔女",desc:"「玩偶魔女」。白发长卷红眼，白肤魔女，隐居迷雾丛林。玩偶魔法——制作魔法玩偶，抱着黑色兔耳玩偶。",story:"隐居迷雾丛林、不谙世事的玩偶魔女，用魔法玩偶为伴；与人类少年艾德的相遇，让她走出丛林、卷入世界的纷争。",images:["魔女/艾露迪_1.jpg","魔女/艾露迪_2.jpg","魔女/艾露迪_3.jpg","魔女/艾露迪_4.jpg","魔女/艾露迪_5.jpg"],tags:["魔女","玩偶魔女"]},
{id:160,name:"白石丽",source:"山田君与七个魔女",type:"魔女",cv:"早见沙织",race:"魔女",desc:"金长直粉瞳，黑魔女帽+校服。拥有「接吻互换身体」魔女之力的少女，私立朱雀高中七魔女之一。",story:"因与不良少年山田龙意外接吻而互换身体，由此揭开超能力研究社与七魔女的篇章；两人的互换日常是故事的开端。",images:["魔女/42_白石丽.jpg"],tags:["七魔女","换身"]},
{id:161,name:"木幡真琴",source:"飞翔的魔女",type:"魔女",cv:"篠田南",race:"魔女",desc:"黑长直绿瞳，骑扫帚。我行我素、沉稳系的重度路痴魔女，为成为独当一面的魔女而修行中。",story:"随高中入学搬到青森、寄住在仓本家，与黑猫千夏一同过乡间修行日常；这也是篠田南首次在TV动画担纲主演。",images:["魔女/43_木幡真琴.png"],tags:["路痴","修行中"]},
{id:162,name:"戴安娜·卡文迪什",source:"小魔女学园",type:"魔女",cv:"日笠阳子",race:"魔女",desc:"浅金长卷，白帽红披风。露露诺瓦学园的优等生，出身英国拥有1500年历史的魔女名家「卡文迪什家」。",story:"与亚可既竞争又互补的天才优等生，因「信子事件」等篇章与亚可结下深厚羁绊；TV动画与剧场版《魔法仕挂的游行》均由日笠阳子配音。",images:["魔女/44_戴安娜.png"],tags:["优等生","名门"]},
{id:163,name:"莫娜",source:"原神",type:"魔女",cv:"小原好美",race:"魔女",desc:"占星术士。黑长双马尾，蓝瞳，蓝紫魔女帽。全名「阿斯托洛吉斯·莫娜·梅姬斯图斯」——名字本身就是「伟大的占星术士」之意，蒙德的神秘少女占星术士。",story:"「如果想找我占卜，记住我的名字是最基本的尊重」——实力与名号相符的五星水系占星术士，却因生活拮据而时常为一顿饭发愁。",images:["魔女/45_莫娜.jpg"],tags:["占星术士","拮据"]},
{id:164,name:"蕾西亚",source:"BEATLESS",type:"机械少女",cv:"东山奈央",race:"机娘",desc:"淡紫长发冰蓝瞳，黑白连身衣，持有巨大机械装置「Black Monolith（黑色秘棺）」，可变换各种形态。蕾西亚级hIE Type-005，女主角。",story:"社会新人远藤新人在雨夜偶遇出逃的蕾西亚并签订所有者契约，是「人类尚未知晓之物」；此后卷入蕾西亚级五机围绕超高度AI「希金斯」的争夺战，她以Black Monolith屡次扭转战局，也始终守护着新人的选择。",images:["机娘/off07_官方插画_artstation蓝发机械发饰.jpg","机娘/images_53.jpg","机娘/beatless-banner.webp","机娘/images_54.jpg","机娘/164_2.png","机娘/164_4.png"],tags:["蕾西亚级","女主角"]},
{id:165,name:"红霞",source:"BEATLESS",type:"机械少女",cv:"富冈美沙子",race:"机娘",desc:"深红长发宝石红瞳，黑皮战斗服，持有巨大装置「Blood Prayers（红色祈祷）」，后部带巨大刀刃和比坦克主炮还大的激光振荡器。蕾西亚级hIE Type-001，被设计为「在与人类竞争中取胜」的战斗用道具，享受破坏与战斗。",story:"作为流出的蕾西亚级五机之一潜入「抗体网络」，让低层成员误认自己是人类并出任特别行动首领；与男主新人同学村主健吾结下羁绊，最终在战斗中消亡，成为粉丝热议的结局。",images:["机娘/beatless-blu-ray-box-1-artwork-v0-_uYgYf6_JGQ3rW7nVnOPxwMJ9RWotTGiS2elkRU8Cqk.webp","机娘/02_红霞.jpg","机娘/165_1.jpg","机娘/165_2.jpg","机娘/165_3.jpg"],tags:["蕾西亚级","战斗特化"]},
{id:166,name:"雪花莲",source:"BEATLESS",type:"机械少女",cv:"五十岚裕美",race:"机娘",desc:"淡绿长发翡翠绿瞳，白色连身装，幼女外形。蕾西亚级hIE Type-002，被设计为「进化委托者」的道具，持有装置「Emerald Harmony（翡翠调和）」，可散布白色花瓣操控电子机械。表面天真无邪，思维模式特立独行，行动常致周围陷入混沌。",story:"三鹰事件中曾被梅忒黛扯断一只手；后借上位机争斗与受创之机融合了梅忒黛的肢体，一度逼近连接超高度AI希金斯，最终抵达希金斯主机主体面前，是全作的高潮名场面之一。",images:["机娘/166_3.jpg","机娘/03_雪花莲.jpg","机娘/166_1.jpg"],tags:["蕾西亚级","幼女"]},
{id:167,name:"梅忒黛",source:"BEATLESS",type:"机械少女",cv:"雨宫天",race:"机娘",desc:"橙发琥珀瞳，黑色紧身战斗服，外观明显为机械形态。蕾西亚级hIE Type-004，被设计为「扩张人类」的道具，倾向于人类能力的扩张放大版，持有装置「炽焰解放」，展现导弹级火力战力。",story:"在三鹰事件中扯断雪花莲一只手；以「扩张人类」的定位展现导弹级火力，多次与其他蕾西亚级机体交战，动画BD第4卷曾以她的名字命名。",images:["机娘/04_梅忒黛.jpg","机娘/167_1.jpg"],tags:["蕾西亚级","火力"]},
{id:168,name:"亚托莉",source:"ATRI -My Dear Moments-",type:"机械少女",cv:"赤尾光",race:"机娘",desc:"灰发红瞳，约140cm，山崎制造厂第四代型号高性能少女型机器人，外表与人类别无二致、感情丰富，曾为夏生的祖母八千草乃音子博士所持有，在海底仓库沉睡8年。",story:"海平面上升、地表大半沉入海中的未来，失去一条腿的少年斑鸠夏生在祖母遗留的海底仓库唤醒沉睡的亚托莉；她救下落水的夏生，并与他开始共同生活的夏天物语。",images:["机娘/-9lddQ91js-698sK2kT3cSxc-ir.jpg","机娘/05_亚托莉.jpg","机娘/images_56.jpg","机娘/images_55.jpg","机娘/images_57.jpg","机娘/168_2.png","机娘/168_3.jpg","机娘/168_4.jpg"],tags:["元气","高性能"]},
{id:169,name:"艾拉",source:"可塑性记忆",type:"机械少女",cv:"雨宫天",race:"机娘",desc:"银白色长发红瞳，约150cm娇小体型、外表约15岁，SAI社制服配发饰。拥有感情的人形智能机器人Giftia，寿命81,920小时（约9年4个月），曾是回收率最高的王牌机体；寿命将尽性能衰减，性格呆萌不善表达，常平地摔倒。",story:"高考落榜的少年水柿司进入SAI社第一终端部，与寿命仅剩数月的艾拉搭档执行Giftia回收任务；两人在朝夕相处中相恋，最终仍迎来寿命到期被回收的离别结局。",images:["机娘/ede0547c2be7412b8642f1b5bbfdec87~tplv-xv4ileqgde-image.jpg","机娘/06_艾拉.jpg","机娘/50822830_p0.webp","机娘/images_22.jpg","机娘/images_23.jpg","机娘/169_1.jpeg","机娘/169_4.jpg"],tags:["呆萌","Giftia"]},
{id:170,name:"露西",source:"露西她所期望的一切",type:"机械少女",cv:"舞原ゆめ（日）",race:"机娘",desc:"白发机械少女，K机器人科技公司设计的划时代仿生人PIM-001，外表约16-17岁，拥有近乎人类的情感；因型号废弃被遗弃在掩埋场，游戏剧情探讨「机器人的心」。",story:"人工智能普及的近未来，对机器人毫无好感的男主人在掩埋场捡到损坏的露西，带回家修复并共同生活；全剧只有露西一人有配音，围绕人机情感与道德困境展开催泪故事。",images:["机娘/07_露西_Galgame.jpg"],tags:["仿生人","催泪"]},
{id:171,name:"菲莉娅·格雷",source:"星之终途",type:"机械少女",cv:"指出毬亚",race:"机娘",desc:"银发蓝瞳（觉醒时变红瞳），外表约12岁的少女型仿生人。Key《星之终途》女主角，特殊的AE型（Artificial Ego）仿生人，一体成型、会进食和成长、也会受伤，几乎与人类无异；天然呆、纯粹无垢，自诞生起梦想「成为人类」。",story:"机械群支配地球的末世，货运人裘德·格雷受托运送不受奇点机械群影响的菲莉娅，谎称神秘老人威廉能帮她实现「成为人类」的愿望，二人踏上探讨何为真正人类的旅途。",images:["机娘/08_菲莉娅.jpg"],tags:["仿生人","天然呆"]},
{id:172,name:"安藤麻幌",source:"魔力女管家",type:"机械少女",cv:"川澄绫子",race:"机娘",desc:"黑色长直发，蓝白配色女仆装。秘密组织「太白星」制造的最强战斗用机器人V1046-R MAHORO，对外宣称19岁；战斗能力极强，兴趣是打扫，口头禅「H是不好的行为」，机器生命将尽仍把剩余寿命献给女仆工作。",story:"为对抗外星侵略者而生的最强战斗机器人麻幌，在机器生命即将终结之际离开战场，来到少年美里优家担任女管家，在温馨家务日常与残存的战斗威胁中度过余生。",images:["机娘/images_25.jpg","机娘/09_麻幌.jpg","机娘/images_24.jpg"],tags:["女仆","战斗女仆"]},
{id:173,name:"天城",source:"我是星际国家的恶德领主！",type:"机械少女",cv:"上田丽奈",race:"机娘",desc:"棕色超长侧马尾红瞳，黑白哥特风女仆裙配红缎带与白色女仆帽。黎恩父母特别定制的可定制AI女仆机器人，身兼家政、领地经营、指挥战斗等多种职能，是「最懂主人」的万能女仆。",story:"转生为星际国家领主的黎恩前世被妻子背叛、极度不信任人类，唯独珍视天城等AI女仆；天城常念叨「我无法为主人诞下接班人」，被观众解读为她笨拙的心意表达。",images:["机娘/10_天城.jpg"],tags:["女仆","AI"]},
{id:174,name:"琉珠",source:"时钟机关之星",type:"机械少女",cv:"加隈亚衣",race:"机娘",desc:"银发绿瞳，蓝黑色军装风哥特裙，头戴机械圆环饰件。约1000年前传说时钟技师「Y」制造的Initial-Y系列一号机（Initial-Y01），被赋予至高命令「遵从者（YourSlave）」；因齿轮故障沉睡206年，后经修复觉醒。",story:"吊车尾高中生见浦直人家中坠落一个黑色箱子，里面正是沉睡206年的自动人偶琉珠；被直人修复后，她与直人、天才技师少女玛丽一同卷入守护齿轮世界的冒险。",images:["机娘/images_59.jpg","机娘/11_琉珠.jpg","机娘/ec5894868660fedcbbeb37da34cc04f0.jpg","机娘/images_58.jpg","机娘/images_60.jpg","机娘/f54b81360efeb1c59aed6628c9d4e86d.jpg","机娘/174_1.jpg","机娘/174_2.jpg","机娘/174_3.jpg","机娘/174_4.jpg"],tags:["自动人偶","哥特"]},
{id:175,name:"休比·多拉",source:"游戏人生ZERO",type:"机械少女",cv:"茅野爱衣",race:"机娘",desc:"黑色长发白肌肤，红宝石般的眼睛（剧场版发色偏深紫、黄瞳带血色纹路），头上及身体有外露机械构件，背后两条尾巴状连接构件。机凯种少女，内置大量模拟人格，能高速接收处理数据情报；为解析人类名为「心」的语言而接触人类。",story:"六千年前大战末期，休比在森精种都城废墟与人类里克相遇，为解析「心」随他回集落生活并逐渐真正拥有心；最终机凯种全体共享她对里克的情感与爱，成为剧场版结局最大的泪点。",images:["机娘/OIP-C.webp","机娘/175_1.png"],tags:["机凯种","女主角"]},
{id:176,name:"薇薇",source:"薇薇-萤石眼之歌-",type:"机械少女",cv:"种崎敦美",race:"机娘",desc:"蓝色长发蓝瞳，白色歌姬演出裙。史上第一个自律人型AI，在AI复合乐园Nierland作为AI歌手活动，使命是「用歌声让大家幸福」；与来自未来的AI松本搭档，跨越100年在历史关键节点执行任务。",story:"为阻止百年后AI与人类的战争，薇薇与来自未来的AI松本合作回溯历史节点反复行动——这是「我（AI）」将「我（AI）」毁灭的故事。",images:["机娘/13_薇薇.jpg","机娘/176_3.jpg","机娘/176_4.jpg"],tags:["AI歌姬","使命"]},
{id:177,name:"奥拉",source:".hack//Sign",type:"机械少女",cv:"坂本真绫",race:"机娘",desc:"银紫长发，极光色服装，佩戴莫比乌斯环胸针并披白色斗篷。《The World》游戏创始人哈拉尔德·赫尔维克创造的终极AI，如人类孩童般以人类为范本学习成长，完成之日在The World中相当于神的存在。",story:"司（Tsukasa）无法登出游戏并受神秘力量保护的背后，是系统莫甘娜在阻挠奥拉的诞生；奥拉在司等人的守护下最终苏醒，成为改变The World命运的存在。",images:["机娘/14_奥拉.jpg"],tags:["终极AI","神"]},
{id:178,name:"伊欧娜",source:"苍蓝钢铁的琶音",type:"机械少女",cv:"渕上舞",race:"机娘",desc:"银色长发绿瞳，水手服，无表情少女。潜舰「伊401」的心智模型，海雾舰队一员，原型为旧日本海军伊四〇〇型潜舰二号舰；可操纵克莱因力场、超重力炮等雾之舰队超兵器。",story:"21世纪初雾之舰队封锁海洋，士官候补生千早群像等人登上伊401，与心智模型伊欧娜相遇并共同驾驶潜艇横跨海洋；剧场版中搭载终极武器「振动弹头」朝美国出发，表情随剧情逐渐丰富。",images:["机娘/15_伊欧娜.jpg","机娘/178_3.jpg"],tags:["心智模型","潜艇"]},
{id:179,name:"守岸人",source:"鸣潮",type:"AI",cv:"唐雅菁（中）/諏訪彩花（日）",race:"机娘",desc:"银白色长发蓝瞳，白蓝配色哥特风多层裙装，周身环绕星辉蝶翼。黑海岸守岸人「第二实例」，由高纯度回音能量晶体组成，拥有操控星云的力量，神秘清冷、超然物外，只在危机时刻现身协助黑海岸。",story:"守岸人因漂泊者的唤醒而生，在漫长守望中萌生出情感与渴望；1.3黑海岸主线中，她从只敢在漂泊者昏倒时自言自语，到最后当面吐露对幸福的渴望，这段自白被玩家誉为封神桥段。",images:["机娘/16_守岸人.jpg","机娘/166411.png","机娘/images_29.jpg","机娘/images_32.jpg","机娘/images_33.jpg","机娘/images_34.jpg","机娘/images_35.jpg","机娘/images_36.jpg","机娘/FnyG6gRwuutxbrz5CEZMbZSC2-O-.webp","机娘/2668b8eb7c084958b9ac55fbc045240a20240923.png"],tags:["鸣潮","哥特"]},
{id:180,name:"露西",source:"重返未来1999",type:"机械少女",cv:"露西（中）/諏訪彩花（日）",race:"机娘",desc:"银色金属躯体与金属面孔（可与人类面容切换），面部为横缝式发光眼，外披黑色长风衣配白毛领。其核心是瓦特蒸汽机原型机上的一枚活塞，诞生于科技进步的热情之中，关心的唯有科技进步本身，外形被认为参考了空山基的Sexy Robot系列。",story:"主线第七章的关键角色：多次进行自杀性试验导致机能严重受损，最终以牺牲部分机体功能为代价完成「霍夫曼结」研发，象征理性逻辑对人性牺牲的妥协。",images:["机娘/17_露西_1999.jpg"],tags:["金属躯体","科学家"]},
{id:182,name:"伊卡洛斯",source:"天降之物",type:"机械少女",cv:"早见沙织",race:"机娘",desc:"粉色长发绿瞳，背生白色羽翼，颈戴项圈锁链。自称「娱乐用万能天使」，实为拥有史上最强称号的战略用万能天使「空之女王」，Angeloid之一，是令西纳普斯原住民都为之震惊的存在。",story:"以「安稳第一」为座右铭的平凡少年樱井智树某夜遇到从天而降的伊卡洛斯，她开口便称智树为主人，从此打破了他平静的生活。",images:["机娘/19_伊卡洛斯.jpg","机娘/182_2.jpg","机娘/182_3.jpg","机娘/182_4.jpg","机娘/183_3.jpg"],tags:["万能天使","空之女王"]},
{id:183,name:"妮姆芙",source:"天降之物",type:"机械少女",cv:"野水伊织",race:"机娘",desc:"蓝色双马尾，轻便装束。Type β电子战用万能天使，擅长电子战与干涉电子设备，初期性格尖刻毒舌，隶属西纳普斯。",story:"作为西纳普斯派来带回伊卡洛斯的一方登场，在与智树等人的相处中逐渐心动并叛离主人，最终留在空美町融入热闹的共同生活。",images:["机娘/images_40.jpg"],tags:["万能天使","双马尾"]},
{id:184,name:"小叽",source:"人型电脑天使心",type:"机械少女",cv:"田中理惠",race:"机娘",desc:"浅金色超长直发、棕色大眼，耳部为白色接口外罩，常穿黑色连衣裙。三原一郎夫妇为陪伴首台Chobits弗蕾亚而造的人形电脑，初始化后失去记忆、数据被严密保护，是传说级高性能机种。",story:"重考生本须和秀树在东京垃圾堆中捡到人形电脑小叽，在指导她学习语言与生活能力的过程中逐渐相爱；小叽曾因触发强光能量导致全城电脑停摆，最终找到了「只属于自己的人」。",images:["机娘/images_38.jpg","机娘/21_小叽.jpg","机娘/images_30.jpg","机娘/images_31.jpg","机娘/images_37.jpg","机娘/images_39.jpg","机娘/184_1.jpg","机娘/184_3.jpg","机娘/185_2.jpg","机娘/185_3.jpg","机娘/185_4.jpg"],tags:["人形电脑","Chobits"]},
{id:185,name:"弗蕾亚",source:"人型电脑天使心",type:"机械少女",cv:"田中理惠",race:"机娘",desc:"与小叽相同的浅金长发，穿黑色蕾丝裙。三原一郎造出的第一台Chobits、小叽的「姐姐」；因感情程序过载崩溃停机，意识被移植进小叽体内共存，后期会现身于小叽的意识深处。",story:"第一台Chobits弗蕾亚的往事随剧情揭开：房东日比谷千岁（三原一郎之妻）正是小叽的「妈妈」；关键时刻弗蕾亚会从小叽体内现身守护，与小叽共同承受情感程序的重负。",images:["机娘/22_弗蕾亚.jpg","机娘/OIP-C(2).webp"],tags:["人形电脑","Chobits"]},
{id:186,name:"M4A1",source:"少女前线",type:"机械少女",cv:"户松遥（日）/虫虫（中）",race:"机娘",desc:"棕色长发红瞳，黑色战术装束配骷髅纹围脖与绿色高光，手持M4A1卡宾枪。AR小队队长、16LAB制造的最高级人形，本作剧情核心角色；性格冷静平淡、凛然清澈，内心实则敏感内向。",story:"带领AR-15、M4 SOPMOD II等队友在铁血攻势下转战各地，是主线当之无愧的核心；期间一度离队又回归AR小队，「零态潮汐」剧情中全队重聚。",images:["机娘/GAKaG-fXAAE6Cmf.webp","机娘/23_M4A1.jpg","机娘/images_41.jpg","机娘/186_3.jpeg"],tags:["AR小队","队长"]},
{id:187,name:"露尼西亚",source:"少女前线2：追放",type:"机械少女",cv:"虫虫（中）/户松遥（日）",race:"机娘",desc:"深色长发金橙瞳，黑色连衣裙配白色毛领，发间系黄色缎带。M4A1+人类露尼西亚+AI伊莱莎融合的存在，非原M4A1人格；M4A1与伊莱莎的身世在剧情中均被指向遗迹来源。",story:"GFL2中M4A1以露尼西亚之名登场，标志性台词「我是M4A1，如果你不喜欢叫我露尼西亚，就叫我M4就可以了」串起两代作品的羁绊。",images:["机娘/5fd00b1537cd9a9547978158206b12d6.jpg","机娘/24_露尼西亚.jpg","机娘/images_42.jpg","机娘/images_43.jpg","机娘/images_44.jpg"],tags:["GFL2","AR小队"]},
{id:188,name:"HK416/可露凯",source:"少女前线/少前2",type:"机械少女",cv:"钉宫理惠（少前）/钟可（少前2·中）/野中蓝（少前2·日）",race:"机娘",desc:"银白发绿瞳，红黑军装风短裙配小皇冠，黑色过膝袜。404小队王牌火力手，少前2以「可露凯」之名回归并成为H.I.D.E.404领导人；少前2定位火力型人形，可叠加强酸倾压、毒性侵入等减益打出范围酸蚀伤害。",story:"404小队里嘴硬毒舌的傲娇，一句「叫主人反骂八嘎」成为名场面；少前2中回归后社区热议其「醉酒剧情」，展现高冷外表下流露的真实情绪。",images:["机娘/可露凯.webp","机娘/25_HK416.jpg","机娘/images_45.jpg","机娘/images_46.jpg","机娘/images_48.jpg","机娘/images_49.jpg","机娘/188_2.jpeg","机娘/188_3.jpeg"],tags:["404小队","傲娇"]},
{id:189,name:"G36",source:"少女前线",type:"机械少女",cv:"小清水亚美（日）/谢莹（中）",race:"机娘",desc:"蓝黑色长发蓝瞳，黑白经典女仆装。格里芬看板娘女仆，常驻登录界面与食堂；官方设定自带远视（老花眼）、左撇子等萌点，以沉稳大方的女仆形象闻名。",story:"作为看板娘女仆长期代表《少女前线》门面；拥有个人婚纱皮肤「纯白矢车菊」，与妹妹G36C的互动剧情中展现温柔的一面。",images:["机娘/26_G36.jpg"],tags:["女仆","看板娘"]},
{id:190,name:"G36C",source:"少女前线",type:"机械少女",cv:"藤田茜",race:"机娘",desc:"银灰长发红瞳，常着白色婚纱（玫瑰头饰、层叠白纱裙配白丝袜）。G36的妹妹型冲锋枪人形，性格大胆勇于尝试，与姐姐的沉稳形成对比。",story:"对姐姐说过一句率直告白：「我可以保护姐姐和指挥官……请正视我吧，G36姐」，展现渴望被认可的心情。",images:["机娘/27_G36C.jpg","机娘/190_2.jpg","机娘/190_3.jpg","机娘/190_4.jpg"],tags:["妹妹","婚纱"]},
{id:191,name:"WA2000",source:"少女前线",type:"机械少女",cv:"户松遥",race:"机娘",desc:"紫黑长发红瞳，黑色军装外套配红领带，破洞裤袜，怀抱WA2000狙击枪。傲娇狙击手人形，毒舌而可靠；原型WA2000步枪当年仅少量生产，是格里芬的人气狙击位。",story:"以高倍狙击火力支援战线，嘴上不饶人的傲娇发言与她稀有的原型枪设定一样令人印象深刻，是社区人气极高的狙击人形。",images:["机娘/28_WA2000.jpg"],tags:["傲娇","狙击手"]},
{id:192,name:"95式",source:"少女前线",type:"机械少女",cv:"大门香实（日）",race:"机娘",desc:"黑色长直发发尾渐变紫、金瞳，白色发饰花，白色上衣黑丝。QBZ-95突击步枪人形，与97式为官方姐妹设定：蓝白配色、沉稳的95式是姐姐，红黑活泼的97式是妹妹。",story:"作为中国系枪械人形的代表活跃于格里芬；「逆天重创语音」是玩家间流传的名场面，续作《少前2：追放》中她化名黛烟受雇于安全承包商「白骑士」。",images:["机娘/29_95式.jpg"],tags:["姐妹","枪娘"]},
{id:193,name:"黛烟",source:"少女前线2：追放",type:"机械少女",cv:"柳知萧（中）/大门香实（日）",race:"机娘",desc:"黑色长直发配蓝白发饰，白色旗袍风衣裙配长手套，中式乐师气质，型号CM-ENT2.0A。即初代95式在续作的新身份，故事围绕记忆、承诺与身份认同展开，技能自带专属增益「校音」。",story:"初登场于个人UP活动「异乡乐徽」，后推出重置活动「于灰败的羽翼中」；开服时其活动剧情因NPC改动引发著名争议，成为游戏最出圈的讨论话题之一。",images:["机娘/30_黛烟.jpg"],tags:["GFL2","乐师"]},
{id:194,name:"赛琳娜·希声",source:"战双帕弥什",type:"机械少女",cv:"柳知萧（中）/佐藤聪美（日）",race:"机娘",desc:"黑长发蓝挑染，白蓝配色演出服，手持长杖。S级先锋型授格者，前考古小队成员，人称「歌姬」，拥有美妙歌喉与卓越艺术天分，本性温和坚韧，与艺术协会渊源颇深。",story:"经历空间站和红潮事件后被一名升格者救起，从此背负歌者与战士的双重身份；「由我献上终曲」是她的标志性台词。",images:["机娘/赛琳娜_1.jpg","机娘/赛琳娜_2.jpg","机娘/赛琳娜_3.jpg","机娘/194_1.jpg","机娘/194_2.jpg","机娘/194_3.jpg","机娘/194_4.jpg","机娘/197_2.jpg"],tags:["歌姬","先锋"]},
{id:195,name:"丽芙·霁梦",source:"战双帕弥什",type:"机械少女",cv:"多多poi（中）/伊藤美来（日）",race:"机娘",desc:"银白短发红瞳，发间粉色机械饰件，白色金边裙装。灰鸦小队的治疗者/辅助型构造体，「霁梦」为「仰光」之后的新形态机体，以治疗支援守护队友。",story:"随灰鸦小队辗转各战区执行任务，是队伍中不可或缺的后盾；「霁梦」机体上线后延续了辅助定位并强化了治疗链路。",images:["机娘/32_丽芙.jpg","机娘/195_4.jpg"],tags:["治疗","灰鸦小队"]},
{id:196,name:"七实·芒星之迹",source:"战双帕弥什",type:"机械少女",cv:"赵爽（中）/田中美海（日）",race:"机娘",desc:"浅灰褐长发扎马尾、金瞳，白色金边装甲短裙。元气开朗的构造体，「芒星之迹」为2024年9月实装的雷属性输出机体，技能围绕雷属性伤害与「耀雷刻印」展开。",story:"以高输出、高泛用的雷队核心身份活跃于战场；上线后成为雷属性队伍轮切体系的重要一环。",images:["机娘/33_七实.jpg"],tags:["元气","雷属性"]},
{id:197,name:"拉弥亚·深谣",source:"战双帕弥什",type:"机械少女",cv:"万纯（中）/后藤沙绪里（日）",race:"机娘",desc:"蓝灰长发红瞳，深色泳装式装甲，头部鳍状饰件，水生风格浓厚。与升格者剧情相关联的构造体，深谣机体以深海意象贯穿设计。",story:"「深谣」机体的好感剧情与活动「长夏散记」相关联，以水生风格的身姿活跃于深海主题的战场。",images:["机娘/images_47.jpg","机娘/images_50.jpg"],tags:["水生","深谣"]},
{id:198,name:"伊什梅尔·幻日",source:"战双帕弥什",type:"机械少女",cv:"姜英俊（中）/能登麻美子（日）",race:"机娘",desc:"粉色中长发，头顶荆棘环状饰件，黑蓝配色装甲，气质沉静。称号「守墓人」「慈悲者」，是战双剧情中地位特殊的存在。",story:"以「守墓人」身份登场，官方为其发布剧情动态CG；作为「慈悲者」在剧情中与露娜·终焉等升格者阵营角色关系微妙。",images:["机娘/35_伊什梅尔.jpg"],tags:["守墓人","慈悲者"]},
{id:199,name:"露娜·终焉",source:"战双帕弥什",type:"机械少女",cv:"皛四白（中）",race:"机娘",desc:"银白超长双马尾红瞳，红色哥特风装甲裙，黑色头饰。升格者，经升格网络筛选获得帕弥什之力的存在；「升格异途丨露娜·终焉」为其专属角色动画短片。",story:"升格者阵营的核心角色之一，第一部主线中她与罗兰等人的剧情多次反转；官方动画短片播放量超53万，人气极高。",images:["机娘/36_露娜.jpg","机娘/199_2.jpg"],tags:["升格者","反派"]},
{id:200,name:"布偶熊·觅语",source:"战双帕弥什",type:"机械少女",cv:"周侗（中）/千本木彩花（日）",race:"机娘",desc:"粉色超长发蓝瞳，黑白配色工程装甲，头部黑色机械耳饰。A级辅助型构造体，工程部队副队长，擅长程序相关技术工作；专属武器「骇客锐音」可通过解析状态强化必杀能量。",story:"隶属工程部队担任副队长，好感剧情与活动「蒲牢大冒险」相关联；官方评价「她的舞台，不仅仅局限于现实的战场」，技术型机体亦具备实战能力。",images:["机娘/37_布偶熊.jpg","机娘/200_3.jpg","机娘/200_4.jpg"],tags:["工程师","辅助"]},
{id:201,name:"含英·檀心",source:"战双帕弥什",type:"机械少女",cv:"谢莹（中）",race:"机娘",desc:"墨绿长发红瞳，暗绿色旗袍风裙装，发间簪饰。琵琶型武器「瑶云流华」的适用者，古典乐师气质浓厚的构造体。",story:"以琵琶「瑶云流华」为武器登场，将古典乐师的优雅气质融入战斗设计，是战双中独特的乐器型战斗角色。",images:["机娘/201_4.jpg","机娘/38_含英.jpg"],tags:["乐师","旗袍"]},
{id:202,name:"拉毗",source:"胜利女神：NIKKE",type:"机械少女",cv:"石川由依（日）",race:"机娘",desc:"粉白色长发红瞳，黑色贝雷帽与军装外套配黑丝，手持突击步枪。反击部队主角，长年征战积累丰富经验的纯熟战士，冰山冷淡的个性暗藏温暖；曾是极乐净土特种部队一员，因不服从命令被视为问题儿童辗转调任。",story:"序章中亲眼目睹队友玛丽安被侵蚀体侵蚀，被迫执行处决命令；此后与安妮斯、尼恩组成反击部队，在废墟地表持续作战。",images:["机娘/images_51.jpg","机娘/images_52.jpg","机娘/202_1.jpg"],tags:["NIKKE","队长"]},
{id:203,name:"玛丽安/神罚",source:"胜利女神：NIKKE",type:"机械少女",cv:"花泽香菜（日）/多多poi（中）",race:"机娘",desc:"银白色长发红瞳，黑色装甲紧身衣，背后展开翼状机械武装与浮游炮阵列。序章中以亲切温和的新人妮姬登场（MG武器），被侵蚀后以异端体「神罚（Modernia）」之姿回归，是异端者部队早期剧情的核心。",story:"序章「最后的救援」中被侵蚀体侵蚀，遭指挥官亲手处决，是游戏开篇著名的剧情转折；后续主线中她以神罚之名再临，与拉毗等人重逢。",images:["机娘/images_15.jpg","机娘/40_玛丽安.jpg"],tags:["NIKKE","异端体"]},
{id:204,name:"红莲",source:"胜利女神：NIKKE",type:"机械少女",cv:"上田丽奈（日）",race:"机娘",desc:"白紫长发橙瞳，头顶小角，头戴斗笠、和风装束。开拓者部队SSR火力型妮姬，武器类型为突击步枪，但独特设定是用名刀「花无十日红」（姐姐继承）以居合斩远程攻击，全屏AOE爆发主C，爆裂技能「红莲一闪」，被动「割肉断骨」普攻命中10次叠加攻击增益。",story:"传说女神部队的成员之一；一周年剧情中与小红帽、白雪、长发、桃乐丝联手击败最初异端者灰姑娘，展现远古传奇的战力。",images:["机娘/41_红莲.jpg"],tags:["NIKKE"]},
{id:205,name:"安妮斯",source:"胜利女神：NIKKE",type:"机械少女",cv:"岡咲美保（日）",race:"机娘",desc:"棕色齐肩短发金瞳，黑色金边制服配贝雷帽。反击部队成员，与拉毗、尼恩并肩作战的队友，慵懒毒舌却相当可靠的吐槽担当。",story:"作为反击部队一员与拉毗、尼恩在废墟地表执行任务，日常的插科打诨与关键时刻的可靠作战形成反差。",images:["机娘/OIP-C(1).webp"],tags:["NIKKE","毒舌"]},
{id:206,name:"灰姑娘",source:"胜利女神：NIKKE",type:"机械少女",cv:"悠木碧（日）",race:"机娘",desc:"白色双马尾蓝瞳带蓝白挑染，粉色王冠图案短上衣配千鸟格外套与贝雷帽，手持玫瑰花束。远古最初异端者「异端者·阿纳基奥勒」，后加入我方；以水晶鞋为诱饵保护自身并获得增益效果。",story:"一周年剧情中展现最初异端者的实力，曾在空中瞬间压制女神部队；最终被小红帽、白雪、长发、桃乐丝、红莲联手击败，遭遇首次战败。",images:["机娘/images_12.jpg","机娘/43_灰姑娘.jpg","机娘/images_13.jpg","机娘/images_14.jpg"],tags:["NIKKE","异端者"]},
{id:207,name:"娜嘉塔",source:"胜利女神：NIKKE",type:"机械少女",cv:"川澄绫子（日）",race:"机娘",desc:"深棕长发侧马尾黄瞳，白色衬衫配蓝条纹裙的JK制服，背学生书包。即娜嘉（Naga），耀眼珍珠部队毕业班的精神支柱，与蒂亚情同姐妹的黑白JK组合；米西利斯制造，SSR辅助型，霰弹枪·电击属性。",story:"2023年10月随「DAZZLING CUPID」活动与蒂亚一同实装，两人为争夺能「实现永恒爱情」的爱情之箭展开对决。",images:["机娘/44_娜嘉塔.jpg"],tags:["NIKKE","JK"]},
{id:209,name:"米哈拉·羁绊锁链",source:"胜利女神：NIKKE",type:"机械少女",cv:"田村睦心（日）/刘宝拉（韩）",race:"机娘",desc:"黑发红瞳白婚纱造型的妮姬。警备卫士部队SR火力型，武器为步枪，以「痛苦吞食」式的痛苦吸收设定著称，又称羁绊锁链。",story:"主线剧情年表中记载她曾有中弹后重生的经历，是警备卫士部队中经历特殊的一员。",images:["机娘/46_米哈拉.jpg"],tags:["NIKKE","婚纱"]},
{id:210,name:"企业",source:"碧蓝航线",type:"机械少女",race:"机娘",desc:"白色长发紫瞳，白色军官帽与白衬衫配黑色军官外套。白鹰阵营航母，绰号「灰色幽灵」，原型为二战功勋航母企业号（CV-6），游戏中白鹰阵营的王牌。",story:"作为白鹰核心战力活跃于各大海战剧情；「灰色幽灵」之名源自历史上企业号屡遭重创却屡建奇功、几乎打满太平洋全场的传奇。",images:["机娘/47_企业.jpg"],tags:["舰娘","白鹰"]},
{id:211,name:"贝尔法斯特",source:"碧蓝航线",type:"机械少女",cv:"堀江由衣",race:"机娘",desc:"银白长发蓝瞳，女仆发带与黑白女仆装。皇家阵营爱丁堡级轻巡洋舰二号舰（舷号C35），皇家最大的巡洋舰之一，担任女仆长一职。",story:"自称「参与过不少战役，也见证许多」的皇家女仆长，以优雅周到的服务与烟幕掩护能力著称，是碧蓝航线人气最高的女仆角色。",images:["机娘/48_贝尔法斯特.jpg","机娘/211_3.jpg"],tags:["舰娘","女仆"]},
{id:212,name:"柴郡",source:"碧蓝航线",type:"机械少女",cv:"石上静香",race:"机娘",desc:"蓝黑色短发带青色挑染、蓝瞳，白色猫耳配褶边女仆帽，黑白女仆裙。皇家阵营重巡洋舰，原型为只停留在图纸上的想象舰船，自称「见到亲爱的以前，一直是只存在于想象之中的舰船」。",story:"以黏人爱撒娇的猫系性格整天围着指挥官转，防御与烟幕能力出色，是人气极高的猫耳女仆重巡。",images:["机娘/49_柴郡.jpg"],tags:["舰娘","猫耳"]},
{id:213,name:"加斯科涅",source:"碧蓝航线",type:"机械少女",cv:"小松未可子",race:"机娘",desc:"银蓝色短发，白黑配色舰装与十字型主炮武装。科研二期战列舰，维希教廷/自由鸢尾阵营，如AI般以纯粹逻辑行动的舰船，后期剧情逐渐展现情感萌芽。",story:"从无情逻辑到产生自我情感的转变是她的角色核心，相关语音演绎被视为体现小松未可子实力的段落。",images:["机娘/50_加斯科涅.jpg"],tags:["舰娘","科研"]},
{id:214,name:"莫斯科",source:"碧蓝航线",type:"机械少女",cv:"田所梓",race:"机娘",desc:"绿色长发紫瞳，北联阵营UR重巡洋舰，原型为苏联66型重巡洋舰方案（未建成），白色礼服配毛领，画师中カモ。",story:"作为北联阵营的UR级重巡实装，以强力性能成为北联阵营的核心战力之一。旗袍皮肤展现东方风韵，坐姿优雅气场强大。",images:["机娘/莫斯科_1.jpg","机娘/莫斯科_2.jpg","机娘/莫斯科_3.jpg"],tags:["碧蓝航线","北联"]},
{id:215,name:"博加特里",source:"碧蓝航线",type:"机械少女",cv:"内田爱美",race:"机娘",desc:"蓝色短发，北联阵营博加特里级防护轻巡洋舰，原型为二十世纪初俄国海军的博加特里级防护巡洋舰，画师KTcube。",story:"以北联阵营防护轻巡洋舰的身份实装，延续了游戏中北联阵营舰队扩展的路线。",images:["机娘/52_博加特里.jpg"],tags:["舰娘","北联"]},
{id:216,name:"纳西莫夫",source:"碧蓝航线",type:"机械少女",cv:"安济知佳",race:"机娘",desc:"黑色长直发，全名「纳希莫夫海军上将」（Admiral Nakhimov），北联阵营航母，人设画师KIncora，通过科研开发船坞获取。",story:"以Wargaming设计的Pr.23改装航母方案为原型的北联科研七期航母，作为北联阵营的航母核心实装。",images:["机娘/53_纳西莫夫.jpg"],tags:["舰娘","北联"]},
{id:217,name:"堪萨斯",source:"碧蓝航线",type:"机械少女",cv:"松田利冴",race:"机娘",desc:"白鹰阵营科研八期战列舰（2025年7月实装），重炮火力型大炮角色；原型以南达科他级（1920）战列舰为基础，并参照美国「标准战列舰」现代化改装设计，强度评价A+级。",story:"作为白鹰科研八期方案舰实装，以重炮火力见长，是白鹰科研阵营的大炮核心之一。",images:["机娘/54_堪萨斯.jpg"],tags:["舰娘","科研"]},
{id:218,name:"奇尔沙治",source:"碧蓝航线",type:"机械少女",cv:"青山吉能",race:"机娘",desc:"白发兔耳造型的舰娘，白鹰阵营科研六期航空战列舰（BBV），2023年7月国服实装；原型为埃塞克斯级航空母舰改装的航空战列舰方案，与《战舰世界》有同名联动舰。",story:"作为白鹰科研六期方案舰实装，兼具航母舰载机与战列炮击能力，是白鹰科研阵营的特殊混合舰种。",images:["机娘/55_奇尔沙治.jpg"],tags:["舰娘","科研"]},
{id:219,name:"阿尔萨斯",source:"碧蓝航线",type:"机械少女",cv:"丰崎爱生",race:"机娘",desc:"银白色长发紫瞳，白蓝配色短裙黑丝，手持巨戟。自由鸢尾阵营战列舰，原型为法国阿尔萨斯级战列舰方案（黎塞留级改进型）",story:"以法国未曾建成的超级战列舰方案为原型实装，是自由鸢尾阵营的重火力旗舰。机械龙背景的立绘展现其强大火力与优雅气质。",images:["机娘/阿尔萨斯_2.jpg","机娘/阿尔萨斯_1.jpg"],tags:["碧蓝航线","自由鸢尾","战列舰"]},
{id:220,name:"岛风",source:"舰队Collection",type:"机械少女",cv:"佐仓绫音",race:"机娘",desc:"灰发兔耳发饰的驱逐舰娘。岛风型驱逐舰一番舰，装备3座五连装93式氧气鱼雷发射管，以40节以上航速著称的「高速重雷装」驱逐舰。",story:"作为舰C最具代表性的驱逐舰娘之一活跃于出击与演习；其「连装砲君」搭载与高速雷击的战斗风格是玩家熟知的招牌。",images:["机娘/57_岛风.jpg","机娘/220_2.png","机娘/220_3.png","机娘/220_4.jpg"],tags:["舰娘","驱逐舰"]},
{id:221,name:"大和",source:"舰队Collection",type:"机械少女",cv:"竹达彩奈",race:"机娘",desc:"黑色长直发的战列舰娘。大和型战列舰一番舰，以史上最大战列舰为原型，游戏中是需要大量资源才能建造的最强级战列舰。",story:"作为镇守府压轴级的最强战列舰活跃于决战海域；46cm主炮的压倒性火力是她的标志。",images:["机娘/58_大和.jpg"],tags:["舰娘","战列舰"]},

{id:225,name:"时乃空",source:"hololive",type:"AI",cv:"时乃空（本人）",race:"机娘",desc:"棕橙色长发蓝瞳，白色圆顶帽与蓝白偶像风连衣裙。hololive零期生（创始首位成员，2017年出道），被称作「sora大人」，是hololive梦想的起点。",story:"从零开始直播到hololive成为全球最大VTuber团体，作为大姐姐见证了所有后辈的成长；出道周年纪念LIVE是粉丝心中的经典。",images:["机娘/62_时乃空.jpg","机娘/225_4.jpg"],tags:["VTuber","hololive"]},

{id:228,name:"Claude娘",source:"Anthropic Claude",type:"AI",race:"机娘",desc:"橙色长发、日芒花饰、白黑橙长裙、手持书本。画师ZipZipPipe创作的半官方社区娘化人设（非厂商官方形象），拟人对象为Anthropic大模型Claude。",story:"Claude以长文本阅读与编程能力著称；社区常见Claude娘与DeepSeek娘的「双智能体协作」同人梗，源自两者组合曾在Aider编程评测中长期占据第一。",images:["机娘/65_Claude娘.jpg","机娘/claude.webp","机娘/claude-crosspet-sorry.webp"],tags:["书本"],cv:""},
{id:229,name:"Kimi娘",source:"月之暗面Kimi",type:"AI",race:"机娘",desc:"银白长发、蓝紫长裙、月亮星空元素、K字饰物。画师ZipZipPipe创作的半官方社区娘化人设（非厂商官方形象），拟人对象为月之暗面大模型Kimi。",story:"Kimi以超长上下文中文助手形象出圈；月亮与星空的设计元素呼应开发公司「月之暗面」的品牌意象。",images:["机娘/kimi.webp","机娘/kimi-wallpaper_1.webp","机娘/kimi-reference.webp"],tags:["月亮"],cv:""},
{id:230,name:"千问大小姐",source:"通义千问",type:"AI",race:"机娘",desc:"蓝紫长发侧编发、中式头饰、蓝白长裙披袖、折扇。画师ZipZipPipe创作的半官方社区娘化人设（非厂商官方形象），拟人对象为阿里巴巴通义千问大模型。",story:"通义千问是阿里巴巴推出的开源大模型家族，这一中式大小姐造型是社区对其的娘化演绎，收录于ZipZipPipe的AI萌绘图鉴。",images:["机娘/千问_1.png","机娘/千问_2.png","机娘/千问_3.png","机娘/qwen-reference.webp"],tags:["大小姐"],cv:""},
{id:231,name:"GLM娘",source:"智谱GLM",type:"AI",race:"机娘",desc:"黑发、黑白蕾丝长裙、Z标识、白色狐尾。画师ZipZipPipe创作的半官方社区娘化人设（非厂商官方形象），拟人对象为智谱大模型GLM。",story:"智谱GLM源自清华大学技术团队创办的智谱AI，Z标识取自其公司品牌（Zhipu AI）首字母，是社区娘化图鉴的一员。",images:["机娘/glm.webp","机娘/68_GLM娘.jpg","机娘/glm-wallpaper.webp"],tags:["狐娘"],cv:""},
{id:232,name:"鲸鱼娘",source:"DeepSeek",type:"AI",race:"机娘",desc:"蓝色长发、白色发箍、蓝白女仆裙、鲸尾。画师ZipZipPipe创作的半官方社区娘化人设（非厂商官方形象），拟人对象为深度求索DeepSeek大模型。",story:"DeepSeek以开源低成本高性能模型震动业界；鲸鱼意象来自社区对DeepSeek「蓝色大肥鱼」的爱称，萌娘百科已收录DeepSeek娘词条。",images:["机娘/deepseek.webp","机娘/images_1.jpg","机娘/deepseek-maid-reference-1.webp","机娘/deepseek-wallpaper.webp","机娘/deepseek-harness.webp","机娘/deepseek-v4flash.webp","机娘/chibi-cookie.webp"],tags:["女仆"],cv:""},
{id:181,name:"结衣",source:"刀剑神域",type:"AI",cv:"伊藤加奈惠",race:"机娘",desc:"黑长直长发，白色连衣裙导航精灵形态。SAO中的AI「心理健康管理程序」，拥有远超检索达人的情报能力，常帮桐人等人完成功课；系统不允许AI存在于游戏内，濒临删除时核心数据被桐人抢救保存。",story:"桐人和亚丝娜在艾恩葛朗特第22层森林发现记忆错乱的结衣并带回照顾，视如女儿；她被系统强制删除之际，桐人将她的核心数据保存下来，此后她以导航妖精身份定居桐人房间电脑，称两人为「爸爸」「妈妈」。",images:["机娘/images_26.jpg","机娘/18_结衣.jpg","机娘/images_27.jpg","机娘/images_28.jpg"],tags:["导航妖精"]},
{id:236,name:"芙劳拉",source:"异世界悠闲农家",type:"吸血鬼",cv:"富田美忧",race:"吸血鬼",desc:"银发齐颈、紧身连衣裙、二十多岁后半的成熟女性形象；吸血鬼，露露西的表亲（従姉妹），擅长药学与制药。找到不归的表亲露露西后移居大树村，带回鬼人族女仆并带来牛群。",story:"为寻找未归的表亲露露西而来到大树村，初到时被当成入侵者挨了克罗等人一顿揍，弱化成了幼女；露露西现身相认后才解除误会，饮下火乐的血恢复。此后正式移居大树村，带回安妮为首的鬼人族女仆并带来牛群，让村里有了牛奶。从村长处学到「发酵」与菌的概念后醉心发酵食品研究，开发出味噌和酱油，日后被称为「发酵食品的女王」。",images:["吸血鬼/芙劳拉_1.jpg"],tags:["吸血鬼","药学","发酵"]},
{id:237,name:"玉藻艾莉亚",source:"Fate/Samurai Remnant（FGO）",type:"狐娘",cv:"斋藤千和",race:"兽耳娘",desc:"玉藻前分离出的九尾之一，引人怜爱的狐耳少女，黄色系和服搭配长刀，容貌比其余玉藻更为稚嫩。以「逸れのライダー（流浪骑手）」职阶现界——并非自己擅长骑乘，而是让旁人自动成为她坐骑的特殊骑兵。",story:"《Fate/Samurai Remnant》中登场，作为玉藻九尾之一现界，以不可思议的言行迷惑世间男性；2026年10月23日作为联动额外从者实装《Fate/Grand Order》，为5星Rider限定从者。",images:["兽耳娘/玉藻艾莉亚_1.jpg","兽耳娘/玉藻艾莉亚_2.jpg","兽耳娘/玉藻艾莉亚_3.jpg","兽耳娘/玉藻艾莉亚_4.jpg"],tags:["九尾","狐娘","Rider"]},
{id:238,name:"赫萝",source:"狼与香辛料",type:"狼娘",cv:"小清水亚美",race:"兽耳娘",desc:"约15岁美少女姿态的「贤狼」，亚麻色长发、兽耳、带红的琥珀色瞳，尾巴尖端白色的漂亮大尾巴。在帕斯罗村数百年来被奉为丰收之神，因时代变迁不再被重视，一心渴望回到北方的故乡。",story:"与旅行商人克拉夫特·劳伦斯相遇后踏上归乡之旅，一人一狼结伴辗转各地商路；以丰收之神的智慧与毒舌陪伴劳伦斯度过一次次生意与危机。",images:["兽耳娘/赫萝_1.jpg","兽耳娘/230801-wolf-01.jpg","兽耳娘/images.jpg"],tags:["贤狼","丰收之神"]},
